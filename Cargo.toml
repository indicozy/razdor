[package]
name = "razdor"
version = "1.5.1"
edition = "2021"
authors = ["@indicozy"]
license = "GPL-3.0-only"

[dependencies]
ab_glyph_rasterizer = "0.1"
# The built-in depth model (`depth`, feature `depth-model`): tract runs the ONNX file, imageproc
# finds the sprite outlines, earcutr triangulates them. Pure Rust; tract 0.23 needs rustc 1.91.
earcutr = { version = "0.5.0", optional = true }
# The file's fp16 weights are upcast to fp32 at load (tract's fp16 path runs at 23 to 36 s per image).
half = { version = "2.7", optional = true }
image = { version = "0.25", default-features = false, optional = true }
imageproc = { version = "0.27.0", default-features = false, optional = true }
tract-onnx = { version = "0.23.10", default-features = false, optional = true }
bzip2 = "0.6.1"
dirs = "7.0.0"
encoding_rs = "0.8.42"
gilrs = { version = "0.11.2", optional = true }
libc = "0.2"
png = "0.17"
lewton = "0.9"
macroquad = "0.4"
rustybuzz = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
# The system language (`ui::language`): the first start picks Russian or English from it. Pinned:
# 0.3.2 (2024-11-01) reads the locale on Linux, macOS, iOS, Windows and Android.
sys-locale = "=0.3.2"
# Unpacking the game archive on the phones (`dt::unpack`): pure Rust, no deflate C code.
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["ppmd"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# The tests of `dt::unpack` write a 7z archive; the game itself only reads them.
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["compress"] }

# The desktop's file picker for «Добавить карту…» (`ui::map_import`). Linux: the desktop portal
# (no GTK, no system libraries); Windows and macOS: their own dialogs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[features]
default = ["audio", "gamepad", "depth-model"]
# The built-in depth model (`depth`): the 2.5D cards of sprites that have no shipped cut data
# (mods, community maps). Off: no model, such sprites stand as one card, as before.
depth-model = ["dep:earcutr", "dep:half", "dep:image", "dep:imageproc", "dep:tract-onnx"]
# Sound and music (macroquad's quad-snd; on Linux it links ALSA's libasound).
# Build with `--no-default-features` for a silent game without it.
audio = ["macroquad/audio"]
# Gamepads (gilrs): the sticks and buttons drive the pointer, its clicks and some keys
# (`ui::gamepad`). On Linux it links libudev. Without it the game is mouse and keyboard only.
gamepad = ["dep:gilrs"]

# Line tables only: backtraces keep file and line, and the debug build stays several times
# smaller on disk (full debug info made target/debug grow past 30 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The test edit-run loop (`cargo test --profile fasttest`): incremental, 256 codegen units, so a
# change rebuilds only its own units; Razdor's own code at opt-level 2, dependencies at 3.
# Release still ships and CI still tests `--release`.
# Measured (rustc 1.91.1, 12 jobs on CPUs 8-19; `--release` in the same worktree, same target dir):
# a one-line body edit under src/rules/ rebuilds in 199 CPU-s (34 s wall) against 481 CPU-s (94 s)
# (opt-level 3: 255 CPU-s, 66 s); the test run takes 297 CPU-s (2:01; opt-level 3: 268 CPU-s);
# the warm build (once) takes 515 CPU-s (1:41) against 1273 CPU-s (4:45). Opt-level 1 broke the
# time budget of rules::ai::real_maps::thirty_days_on_every_map.
[profile.fasttest]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 2

[profile.fasttest.package."*"]
opt-level = 3

# macroquad 0.4.16 plus one patch (QuadGl::push_cpu_model_matrix: a CPU-side model transform
# that does not split batches; see the fork's commit). The 2.5D view's billboards batch through
# it: one draw call instead of one per sprite. Drop the patch once upstream releases it.
[patch.crates-io]
# Razdor's stack (branch razdor-stack in each fork): upstream master plus our batching fix
# (not-fl3/macroquad#1082) and picked upstream PRs; miniquad without 413218d
# (not-fl3/miniquad#704). See the forks' branch history for the list.
macroquad = { git = "https://github.com/indicozy/macroquad", rev = "351b2b3e84f5dbbb3f6bb312afb8587abe6f5f7e" }
miniquad = { git = "https://github.com/indicozy/miniquad", rev = "3c37a7bb6abb7302df41f60001066fde99806bdb" }

# The map translator (src/bin/razdor-translate): its own window, built on Razdor's ui module.
# Its unit tests are the library's (`razdor::translate`); the ui module's run with the game.
[[bin]]
name = "razdor-translate"
path = "src/bin/razdor-translate/main.rs"
test = false

# Android (experimental): the APK of `scripts/dist-android.sh`, built by cargo-quad-apk
# (https://github.com/not-fl3/cargo-quad-apk, pinned in the release workflow). The build uses
# `--no-default-features --features audio` (no gamepads: gilrs is Linux and desktop only).
# Storage: Razdor on Android keeps everything in its own folder (`platform::app_dir`, the app's
# `getExternalFilesDir`), so it declares no storage permission. Players' files from the old shared
# folders come in through the system folder picker (`ui::migrate`), which needs none.
# Updates (`update::phone`): INTERNET for the check and the APK's download; REQUEST_INSTALL_PACKAGES
# for handing the downloaded APK to the system installer (the player confirms it there). No
# FileProvider: cargo-quad-apk cannot declare a <provider>, and the installer session takes the
# file's bytes, so no content URI is shared.
[package.metadata.android]
package_name = "io.github.indicozy.razdor"
label = "Раздор"
android_version = 36
target_sdk_version = 36
min_sdk_version = 26
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
# The status bar is hidden in every mode, as in 1.0.3; «Полный экран» (src/ui/android.rs) also
# hides the navigation bar.
fullscreen = true
# The launcher icon: the mipmap PNGs of Razdor's own icon (data/icon/razdor.png, resized).
icon = "@mipmap/ic_launcher"
res = "android/res"
# The first screen's art (src/ui/menu_art.rs): menu-art/ (from scripts/fetch-menu-art.sh) is packed into
# the APK's assets; Razdor copies it to its cache at the first run without an install.
assets = "menu-art"

[package.metadata.android.application_attributes]
# Razdor is a game to the system (API 26+): the adaptive refresh (OnePlus's ADFR and the like)
# keeps the panel at its top rate for a game while no finger touches the screen. The surface
# asks for the rate too (android/MainActivityInject.java, razdorWatchSurfaceFrameRate).
"android:appCategory" = "game"
# Android 10+ asks on uninstall whether to keep the app's data (the game and the saves live in the
# app's own folder).
"android:hasFragileUserData" = "true"

[package.metadata.android.activity_attributes]
# Any way up the phone is held (the owner's request, 2026-10-23), following the system's
# rotation lock; the activity takes the rotation as a resize (configChanges), no restart.
"android:screenOrientation" = "fullUser"
# Targeting Android 12 (API 31) and later requires it where the activity has an intent filter.
"android:exported" = "true"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

