[package]
name = "razdor"
version = "1.3.3"
edition = "2021"
authors = ["@indicozy"]
license = "GPL-3.0-only"

[dependencies]
ab_glyph_rasterizer = "0.1"
bzip2 = "0.6.1"
dirs = "7.0.0"
encoding_rs = "0.8.42"
gilrs = { version = "0.11.2", optional = true }
libc = "0.2"
lewton = "0.9"
macroquad = "0.4"
rustybuzz = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
# The `.rzpack` package format (`pack`): its manifest, texts and content files.
toml = { version = "0.9", features = ["serde"] }
# Format-preserving TOML for the studio's writes (`studio::edit`): comments, order and layout survive.
toml_edit = "0.25"
# Line diffs of a file changed on disk (`studio::reconcile`).
similar = "3.2"
# The terrain picture of a package map (`maps/<id>/terrain.png`): indexed or RGB, 8-bit after decoding.
png = "0.17"
# Unpacking the game archive on the phones (`dt::unpack`): pure Rust, no deflate C code.
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["ppmd"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }
unicode-bidi = "0.3"
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }
# Razdor Studio's UI (step 1): egui 0.31 inside macroquad's window (`ui::studio`) and its docks.
# Desktop only: the studio feature is compiled out of Android and iOS (see below).
egui-macroquad = { version = "0.17.3", optional = true }
egui_dock = { version = "0.16", optional = true }
# Watches the open package folder for outside changes (`ui::studio::watch`).
notify = { version = "8.2.1", optional = true }

[dev-dependencies]
# The tests of `dt::unpack` write a 7z archive; the game itself only reads them.
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["compress"] }

# The desktop's file picker for «Добавить карту…» (`ui::map_import`). Linux: the desktop portal
# (no GTK, no system libraries); Windows and macOS: their own dialogs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[features]
default = ["audio", "gamepad", "lua", "studio"]
# Sound and music (macroquad's quad-snd; on Linux it links ALSA's libasound).
# Build with `--no-default-features` for a silent game without it.
audio = ["macroquad/audio"]
# Gamepads (gilrs): the sticks and buttons drive the pointer, its clicks and some keys
# (`ui::gamepad`). On Linux it links libudev. Without it the game is mouse and keyboard only.
gamepad = ["dep:gilrs"]
# Lua 5.4 scripts of a package (`src/lua`): the sandboxed runtime behind the field battles and
# the `scripts/` folder. Vendored (compiled from source by the `lua-src` crate); a build without it
# drops the runtime and the Lua-driven battles.
lua = ["dep:mlua"]
# Razdor Studio: the editor for `.rzpack` packages (`razdor --studio`), egui over the game's window.
# Compiled out of Android and iOS (the gated code is `cfg(all(feature = "studio", not(any(android, ios))))`).
studio = ["dep:egui-macroquad", "dep:egui_dock", "dep:notify"]

# Line tables only: backtraces keep file and line, and the debug build stays several times
# smaller on disk (full debug info made target/debug grow past 30 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The content package tool (src/bin/razdor-pack): checks a package folder or `.rzpack` and
# generates the Latin alias table of the base game's content (`pack::aliases`).
[[bin]]
name = "razdor-pack"
path = "src/bin/razdor-pack/main.rs"
test = false

# The map translator (src/bin/razdor-translate): its own window, built on Razdor's ui module.
# Its unit tests are the library's (`razdor::translate`); the ui module's run with the game.
[[bin]]
name = "razdor-translate"
path = "src/bin/razdor-translate/main.rs"
test = false

# Android (experimental): the APK of `scripts/dist-android.sh`, built by cargo-quad-apk
# (https://github.com/not-fl3/cargo-quad-apk, pinned in the release workflow). The build uses
# `--no-default-features --features audio` (no gamepads: gilrs is Linux and desktop only).
# Storage: Razdor reads the install from the shared storage, so the app asks for the all-files
# access (MANAGE_EXTERNAL_STORAGE); Android 8 to 10 get the runtime storage permissions.
# Updates (`update::phone`): INTERNET for the check and the APK's download; REQUEST_INSTALL_PACKAGES
# for handing the downloaded APK to the system installer (the player confirms it there). No
# FileProvider: cargo-quad-apk cannot declare a <provider>, and the installer session takes the
# file's bytes, so no content URI is shared.
[package.metadata.android]
package_name = "io.github.indicozy.razdor"
label = "Раздор"
android_version = 34
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
# The status bar is hidden in every mode, as in 1.0.3; «Полный экран» (src/ui/android.rs) also
# hides the navigation bar.
fullscreen = true
# The launcher icon: the mipmap PNGs of Razdor's own icon (data/icon/razdor.png, resized).
icon = "@mipmap/ic_launcher"
res = "android/res"

[package.metadata.android.application_attributes]
# Android 10 (API 29): the old storage layout, for the install folder and the saves.
"android:requestLegacyExternalStorage" = "true"

[package.metadata.android.activity_attributes]
# Any way up the phone is held (the owner's request, 2026-10-23), following the system's
# rotation lock; the activity takes the rotation as a resize (configChanges), no restart.
"android:screenOrientation" = "fullUser"
# Targeting Android 12 (API 31) and later requires it where the activity has an intent filter.
"android:exported" = "true"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[[package.metadata.android.permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
