[package]
name = "razdor-openmw"
version = "0.1.0"
edition = "2021"
authors = ["@indicozy"]
license = "GPL-3.0-only"
publish = false
description = "Converts a Discord Times map (razdor-dtm-json) into an OpenMW plugin (the OpenMW world, milestone 1: land and textures)."

[[bin]]
name = "razdor-openmw"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
