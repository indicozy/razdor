# --- chapter 1: the frame, the beats, the diary (docs/ideas/pepelnaya-marka-narrative.md §5) ---
[arrival]
title = "The writ"
text = "The courier does not get off his horse. He throws down a sealed writ and says, not looking at you: 'Keeper of the March. The Crown grants you a province and not one soldier. The tower's garrison ran a week ago. The barrows in the north-east have been humming at night. If the dead cross the Pepelka, nobody will hold the March.' He rides off without waiting for an answer."

[farm]
title = "The burnt farmstead"
text = "The farm burned to the ground. A rag doll with one eye lies in the ashes. A few coins were left in the oven, where nobody thought to look. The tracks lead south-west, to the bog: the family got away."

[north_bridge]
title = "The north bridge"
text = "The road runs down to the north ford. Three logs lie across the river, and the planks on them are torn out. Someone tried to cross here at night and went back. A cap hangs on the rail, soaked through."

[mill_wheel]
title = "The mill wheel"
text = "The mill wheel stands in the stream, charred at the rim. Something glints in the silt under it. For now it is only a glint."

[cairn]
title = "A sign on the road"
text = "Stones by the verge are stacked into an arrow pointing to the bog. Someone was in a hurry to get there and did not wait to be understood."

[bog_edge]
title = "The bog's edge"
text = "The reeds by the water are strewn with bird bones and small bones. A rag doll sits on a hummock. A pale face shows in the fog for a moment and hides again."

[ruts]
title = "The ruts"
text = "The ruts in the road are deep: many carts went this way, loaded with whatever would fit. The tracks lead south, to Ashford. Not one came back."

[milestone]
title = "The milestone"
text = "A milestone by the north road bears the Crown's arms, half hacked away. Under them someone has written in charcoal: 'Ashford three days. The road is empty.'"

[grave_marker]
title = "The marker"
text = "Three stones by the verge and a ribbon from a child's kerchief. Nobody lies under the stones. Scratched on one of them: 'Ivor did not reach the bog. We went on.'"

[ferry]
title = "The sunken boat"
text = "A boat has sunk by the bank, an oar sticking out of the silt. The ferryman is nowhere: the barrows took him, or he walked away. The mill ford is the only crossing left."

[tower_log]
title = "The guard's log"
text = "The tower is empty and the hearth is cold ash. On the table lies the guard's log. The last entry, five days old: '...the third night the ground by the barrows is warm. The captain ordered us out.' Below it, in another hand: 'Whoever stayed, chose it for himself.'"

[stones]
title = "The tower and the stones"
text = "From the tower you can see the standing stones on the hill above the barrows. Their marks can still be read. People say that once someone walked through them without touching the ground. The barrows hear that there are people in the tower again: fear grows."

[varga_meet]
title = "The halberdier"
text = "Behind the blackened walls is a row of fresh graves, with no crosses. Beside them sits a halberdier in a torn cuirass. 'The garrison ran, but someone has to bury the dead,' she says. 'I buried them. The Crown sent you, so you will not last long. Choose.'"
join = "Walk with me"
refuse = "Let her go her own way"
burn = "Burn the ruins: there is gold under them (+40, Fear +2)"

[scout]
title = "The scout's letter"
text = "A dead scout in a scout's coat lies face down by the road. In his fist is a scrap of parchment, its line smeared with blood: 'Forty dead and one crowned among them. He looks at the Ford and waits.' There is no signature."

[toll]
title = "The ford"
text = "A band with spears stands at the ford. Their leader grins, but his eyes dart about. 'There is one crossing, and it is ours. The dead will come through this ford, and we are going south. And you? You stay and stand here? Then pay, or fight.'"
pay = "Pay twenty gold"
fight = "Fight"
talk = "Let them go: a promise for passage"

[deserter_note]
title = "The hanged man"
text = "A man in a soldier's jacket hangs at the crossroads. A note is pinned to his chest, written in charcoal: 'There were six of us. We did not want to fight the dead. Five are left, hiding in the wood by the north ford.' There is no blood. Nobody beat him. He could not bear it."

[refugees]
title = "The overturned cart"
text = "The cart lies on its side, a wheel broken, sacks of flour in the mud. A woman holds a child and looks at you without fear. 'We are from the farm by the road. Take us to Reedmere, to the marsh folk. They will take us in if we give our names.'"
take = "Take them to the bog"
leave = "Not my road"

[herb]
title = "The herb-wife"
text = "An old woman dries herbs on poles by the bog path. 'You cannot kill ghosts with iron,' she says. 'It is fire and faith that drive them off. Smear your wounds with this, before they fester.'"
buy = "Buy the salve: fifteen gold (a healing potion)"
leave = "Go on"

[marsh_plea]
title = "The marsh folk"
text = "An old woman with a soaked hem holds your stirrup. Wraiths come out of the bog every night, and every night they take one. Her son did not come back from the last. 'Help us, or ride past. But remember who rode past.'"
help = "Help her"
ride_on = "Ride past (Trust −1)"

[marsh_thanks]
title = "The bog's thanks"
text = "The marsh folk bow and give a name: Tess, the witch's daughter from the far side of the bog. 'She knows the paths through the swamp,' the old woman says. 'She will come when the bog calls her.'"

[dread_1]
title = "The barrows"
text = "The ground hums under your feet, as if someone is counting your steps. This is Fear: it grows from fire, blood and noise. When it reaches five, the dead stand up at the ford. Watch it in your diary."

[raid_sent_tower]
title = "A raid"
text = "The barrows stir harder. From under the ground in the north-east a band of the dead has come out and is marching on the watchtower. If the tower falls, there will be nobody here to raise men."

[raid_sent_village]
title = "A raid"
text = "The barrows stir harder. From under the ground in the north-east a band of the dead has come out and is marching on Reedmere. The village has no walls: if they reach it, the marsh folk will leave or burn."

[raid_tower]
title = "The tower falls"
text = "In the night a band of the dead came out of the barrows. The tower gate did not hold, and the garrison ran into the dark. The tower is theirs now."

[raid_village]
title = "Reedmere burns"
text = "A band of the dead came through the bog and set the village on fire. The marsh folk stand among the ashes and look at you: you did not protect them."

[raid_beaten]
title = "The dead lie down"
text = "The band that marched on the tower or the village fell apart on the road. You searched the bodies: fifteen coins in a bone clasp. Blood wakes the barrows: Fear grows."

[host_warning]
title = "Fires in the barrows"
text = "In the night fires lit up in the barrows. By morning they will be at the ford. Gather whoever can still hold a spear, and go to the middle ford."

[host_rises]
title = "The barrows"
text = "The earth by the middle ford hums. From under the burnt fields the dead rise: knights in rusted mail and things that crawl on four legs. They are coming for you."

[barrow]
title = "The barrow"
text = "A barrow in the north-east: stones set in a ring, and a dark stair showing in the breach. The inscription says not to wake whoever sleeps inside. The barrow can be broken open before the dead get out, or sealed with a rite."
break = "Break it open: a hard fight"
seal = "Seal it with a rite: forty gold, Fear −1"
leave = "Leave it alone"

[barrow_broken]
title = "The barrow broken"
text = "The stair collapsed, and the bones under the stones crumbled to dust. A rasp comes from the depths. The host that stands at the ford will be weaker: one of the dead is already gone."

[barrow_sealed]
title = "The barrow sealed"
text = "The rite lasts until night. The ring flares with a grey light and goes out. The barrow sleeps, and Fear draws back at least one step."

[refugees_thanks]
title = "Kin"
text = "In Reedmere they are met at the door. The old woman nods to you in silence and gives you the fifteen coins found at the bottom of the sack. The marsh folk remember who brings their own home."

[deserters]
title = "The Crown's deserters"
text = "In the wood by the north ford, five men in torn uniforms. Their leader comes out with a spear: 'We ran from the Crown. It does not pay us. Hire us for thirty gold, or hand us over to the Crown for a reward.'"
serve = "Hire them for thirty gold (two join the band)"
hand = "Hand them to the Crown: Crown +1"
pass = "Let them go where they like"

[deserters_served]
title = "Deserters in the band"
text = "Two deserters throw off their coats and fall into line. The rest slip away into the reeds. They take their pay in advance and count what is left."

[deserters_handed]
title = "The Crown's reward"
text = "The deserters are led to the captain. The Crown thanks you in a letter with no signature, and the garrison of the March looks at you with new respect."

[omen]
title = "The new moon"
text = "The new moon. Someone laughs in the reeds. In the morning there is something on your threshold: a bad sign, or a gift."

[end_fire]
title = "Smoke over the March"
text = "The dead lie down at the ford. Smoke still rises from the burnt mill, and the farmers who stayed look at you the way they look at a fire. The March lives, and your name is written among its arsonists."

[end_mercy]
title = "The ford holds"
text = "The dead lie down at the ford. The mill still stands, and the field behind it is green with the first grass. The March will not forget who held it, and will not forgive him if he leaves."

[rider]
title = "A rider from Ashford"
text = "A rider in a dusty cloak reins in at the ford. He looks at the river, then at you. 'The March saw you hold the ford. The council in Ashford wants you. Not all of them will bring bread, but all of them will want to know what you did.'"

[quest.hold_ford]
title = "Hold the ford"
start = "The dead will come to the middle ford. Gather men while there is time."
dread_1 = "The barrows hear you. Fear: 1 of 5."
dread_2 = "The barrows are stirring. Fear: 2 of 5. Raids will come to the tower or the bog."
dread_3 = "Fear: 3 of 5. The dead gather at the barrows."
dread_4 = "Fear: 4 of 5. Not long now, and they will stand at the ford."
warned = "In the night fires lit up in the barrows. By morning they will be at the middle ford. Meet them there."

[quest.tower]
title = "Take the watchtower"
text = "The tower on the hill to the north. Its garrison has gone. Take it: men can be raised there, and wounds healed."

[quest.barrow]
title = "Find out what is stirring in the barrows"
text = "The barrows are in the north-east. What is there?"
scout_title = "The barrow"
scout_text = "A dead man by the road held a letter: 'Forty dead and one crowned.' The barrow on the hill waits."

[quest.varga]
title = "Varga"
text = "The halberdier among the ruins. Walk with her?"

[quest.toll]
title = "The ford"
text = "A band at the ford wants a toll or a fight."

[quest.deserters]
title = "Deserters"
text = "Five runaways in the wood by the north ford. Hire them, or hand them to the Crown."

[quest.refugees]
title = "Refugees"
text = "A family from the overturned cart. Take them to Reedmere?"
taken = "Take the family to Reedmere."

[quest.marsh]
title = "Ghosts of the bog"
text = "The old woman from Reedmere asks for help: the ghosts take one each night."

[quest.raid_tower]
title = "A raid on the tower"
text = "A band of the dead marches on the watchtower. Meet it there."
lost = "The tower fell. The band stayed in it."

[quest.raid_village]
title = "A raid on Reedmere"
text = "A band of the dead marches on the village in the bog. Drive it back."
lost = "The village burned."

# --- marka ---
[marka.map]
title = "The March"
description = "The river Pepelka and its three fords. The abbey to the north-west, the salt marsh to the south-west, the Companies' camp to the south-east, the barrows to the north-east."
won = "The March has chosen its side. The roads lead on."

# --- marka bridges ---

[marka.bridge.north]
name = "The north ford"

[marka.bridge.ashford]
name = "The bridge of Ashford"

[marka.bridge.south]
name = "The south ford"

[marka.building.ashford]
name = "Ashford"
description = "A market town at the middle ford. The Crown's garrison still holds the gate, but its captain looks at you without trust."

[marka.building.millspring]
name = "Millspring"
description = "A village north of the town. The mill wheel still turns, but the gates are shut."

[marka.building.greyreed]
name = "Greyreed"
description = "A village on a dry island in the salt marsh. The marsh folk live here."

[marka.building.abbey]
name = "The ruined abbey"
description = "The abbey walls are black with fire. The Order holds the bell tower and wants no one to touch it."

[marka.building.shrine]
name = "Shrine of Ash"
description = "An altar by the old road. It smells of wet earth and something sweet."

[marka.building.barrow]
name = "The barrows"
description = "Mounds above the standing stones. The ground here is warm and hums."

[marka.building.camp]
name = "The Companies' camp"
description = "A palisade, campfires and a banner without a crest. Here they trade in whatever can be sold."

[marka.army.caravan]
name = "The Crown's caravan"

[marka.army.patrol_w]
name = "Crown patrol (west)"

[marka.army.patrol_n]
name = "Crown patrol (north)"

[marka.army.raiders]
name = "Raiders on the road"

[marka.army.kord_band]
name = "Kord's company"

[marka.army.wraiths]
name = "Wraiths of the marsh"

[marka.unit.ash_knight]
name = "Ash knight"
description = "A knight raised from a barrow. His armour is burnt through."

[marka.item.ash_seal]
name = "Seal of Ash"
description = "A copper seal of the Order with a burnt circle on it. It opens the standing gate, if you remember how."

[marka.item.company_token]
name = "Company token"
description = "A token of the Free Companies. Every camp lets its bearer in without a question."

[marka.captain]
title = "The garrison captain"
text = "The captain does not rise from his table. “You are the one they sent without men and without money. The Crown needs officers, not exiles. Well?”"
serve = "I serve the Crown"
alone = "I answer to no one"
gold = "Ask for gold for the garrison"

[marka.shrine_offer]
title = "The shrine"
text = "A monk of the Order waits by the old road. “The altar is defiled: darkness seeps out of it at night. Cleanse it, and the Order will remember you.” The dead, they say, stand inside."
accept = "I will cleanse it"
refuse = "Not my business"

[marka.shrine_inside]
title = "Inside the shrine"
text = "The altar is cracked, and on it lies a rusted hoop with foreign runes. Brother Ilm, a novice in a torn habit, prays and does not look at you. “Cleanse it by the rite,” he says, “or take the black power before the dead do?”"
cleanse = "Cleanse it by the rite (the Order)"
take = "Take the power of the curse (heresy)"

[marka.ritual_offer]
title = "The gate"
text = "The standing stone hums under your hand. Brother Ilm waits at its foot: “The Seal of Ash will open the gate. One road, one night, and the host of the dead loses its way to the ford.”"
open = "Open the gate with the seal"
walk = "Not now"

[marka.marsh_offer]
title = "The marsh folk"
text = "Tess, a huntress from the far edge of the marsh, stands at the gate of Greyreed. “Wraiths come up out of the water. Find their lair and burn it. Then I will ride with you.”"
accept = "I will go into the marsh"
later = "Later"

[marka.tess_join]
title = "Tess"
text = "The wraiths broke apart into mist. Tess wipes her knife on the grass. “The debt is paid. I ride with you until I say otherwise.”"

[marka.kord_offer]
title = "Kord"
text = "Kord, captain of the Free Companies, sits on a beer barrel. “My company is cheap, but it fights dear. Forty coins and it is yours. Or would you rather hand me to the Crown for a reward?”"
hire = "Hire the company: forty coins"
betray = "Hand Kord over to the Crown"
walk = "Walk away"

[marka.council]
title = "The March's council"
text = "Two of the three tasks are done. The March waits to see whom you will swear to. Choose only those who trust you."
order = "The Order of Ash"
marsh = "The marsh folk"
companies = "The Free Companies"
later = "Not yet"

[marka.raid_warning]
title = "Raiders"
text = "A caravan of salt and flour has left Ashford. Someone among the raiders knows its route. Three men with spears have gone after it."

[marka.caravan_lost]
title = "The caravan is gone"
text = "The caravan never reached the camp. The empty wagon was found by the road, and the carters were not. Salt and flour cost twice as much in Ashford by morning."

[marka.caravan_safe]
title = "The caravan arrived"
text = "The caravan reached the camp of the Free Companies. The Crown paid the guides, and you were given your share."

[marka.mill_fell]
title = "Millspring has fallen"
text = "The barrow men walked into the village at dawn. The mill burns, and the bell is silent: the bell-ringer went to the dead. Fear grows in the March."

[marka.marsh_fell]
title = "Greyreed has fallen"
text = "The salt flats caught fire at night. Greyreed burned to the ground, and the marsh folk fled into the bog. Tess did not come to the gathering."

[marka.host_stir]
title = "The barrows open"
text = "The hills in the north-east stir. Knights in rusted armour rise from the earth, and beasts that crawl on four legs. They walk toward the village, and no one leads them."

[marka.siege]
title = "The siege"
text = "The dead stand at the edge of the village. The people have barred their doors, and shadows walk over the roofs. One more night, and there will be no village."

[marka.host_beaten]
title = "The host lies down"
text = "The knights lay down at the edge of the village and did not rise again. The villagers come out of their houses and thank you. The Crown has paid for the report."

[marka.ilm_abbey]
title = "The abbey"
text = "Brother Ilm walks among the ruins, touching the walls. “There was an archive here,” he whispers. “It may say how to close the gate.”"

[marka.sign_plague]
title = "Plague"
text = "The new moon. Birds lie by the wells with their beaks open. People say it is the breath of the barrows."

[marka.sign_deserters]
title = "Deserters"
text = "A band of deserters has appeared on the old trade road. They ran from the Crown, and now they follow whoever pays. Merchants go around them."

[marka.sign_merchant]
title = "The merchant prince"
text = "A merchant in a silk cloak rode through the March in the night and left a purse on your doorstep: “For keeping the road open.”"

[marka.taint_week]
title = "The taint"
text = "The curse in your blood does not sleep. At night you hear bells ringing under the earth, and the Dread grows with them."

[marka.revisit_abbey]
title = "The Order's banner"
text = "A black and white banner flies over the abbey. The Order has sent its priest to Ashford, and the garrison has given him the gate. The captain says nothing."

[marka.revisit_salt]
title = "Greyreed returns"
text = "The marsh folk came back to their village with fish and salt. The houses are rebuilt and the gate stands open. Greyreed is yours now, and the people ask only one thing: do not sell it."

[marka.revisit_camp]
title = "The camp has grown"
text = "The Free Companies have brought more men and weapons into the camp. The palisade is higher, and there are more fires. They wait for your word."

[marka.stones_note]
title = "The inscription"
text = "The standing stone is covered in an old script. Brother Ilm reads it aloud: “Whoever walks on the stone does not touch the ground.” The stone says nothing more."
# --- abbey ---
[abbey.map]
title = "The Abbey"
description = "A ruined abbey on a stony hill. The barrows come from the east, the inquisition from the north."
won = "The abbey held. The Order has written your name in its book."

[abbey.building.abbey]
name = "The Abbey of Saint Ansel"
description = "Cracked walls, the bell taken down. The monks hold the gate for as long as they can."

[abbey.building.watch]
name = "The Crown's watchtower"
description = "The Crown's garrison kept the Order out. Now it is quiet here."

[abbey.building.alder]
name = "Alder"
description = "A village by the bog. At night you can hear someone singing the dead's songs."

[abbey.army.inquisitors]
name = "The Order's inquisition"

[abbey.army.dead_wave]
name = "Barrow host"

[abbey.army.unmarked]
name = "Old watch"

[item.abbey_scripture]
name = "Ilm's book"
description = "The Order's rule, copied out by hand. In the margins, in small script, the names of graves."

[item.abbey_water]
name = "The Order's holy water"
description = "Water from the well under the abbey. It helps against the dead, until it runs out."

[abbey.arrival]
title = "The Order's summons"
text = "The abbey of Saint Ansel is under siege. The Order asks for help, and the Crown orders you to stay out. You are to choose a side, and the choice cannot be undone. The inquisitors have set out from the north."

[abbey.inquisitors]
title = "The inquisitors"
text = "The inquisitors ride through the gate with their visors up. Their eldest says the Order will remember everyone who stood by the walls, and everyone who stood aside."

[abbey.ilm_meet]
title = "The novice"
text = "A novice sits by the gate with a borrowed sword across his knees. His name is Ilm. He says he can read graves: 'Take me, and I will show you which of them are still people.'"
take = "Take him into the company"
leave = "Send him back to the abbey"

[abbey.blight]
title = "Cold"
text = "The grass here is grey and cracks under the hooves. The soldiers are cold even in their armour. To go on is to ride under a curse."

[abbey.walls]
title = "A curse on the walls"
text = "The dead have reached the walls. Where they struck, the stone went black, and the monks fall to their knees in prayer. The abbey's garrison is cursed."

[abbey.siege]
title = "The barrows advance"
text = "The barrow host climbs the slope and halts at the abbey's south gate. It waits, and no one leads it but an old order."

wall_falls = "The wall beside the gate cracks and falls: the dead pour into the gap."
courtyard_warning = "The dead stand in the courtyard. Hold them, or the abbey falls."

[abbey.trial]
title = "Alder"
text = "Everyone in the village is well, and everyone whispers. Ilm looks at the houses: 'This is corruption. The Order says burn it. Or spare them, if you are sure.'"
burn = "Burn the village: the Order commands it"
spare = "Spare the people: let them go"
ride = "Ride past without interfering"

[abbey.heresy]
title = "Ilm's whisper"
text = "At night Ilm comes alone. 'The Order burns because it is afraid. There is another way: take what comes from the dead and do not burn. Do you want to know how?'"
accept = "Listen, and accept the gift"
refuse = "Refuse and leave"

[abbey.rite]
title = "The rite of cleansing"
text = "The monks are ready to lift the curse. The rite costs money: candles, holy water, a night of prayer."
rite = "Undergo the rite (30 gold)"
decline = "No need, I will manage"

[abbey.inquisition]
title = "The sentence"
text = "The inquisitors lower their banners. 'You are defiled, and you came here anyway,' says their eldest. 'Then we finish it here.' They charge."

[abbey.end_inquisitor]
title = "Fire and order"
text = "The dead lie at the abbey's walls. Ilm stands over burnt Alder and does not look away. The Order writes: 'Cleansed'. The March will remember the fires."

[abbey.end_heretic]
title = "Grey light"
text = "The dead lie at the walls, but Ilm is not looking at them. He is looking at you. The Order will not forgive heresy, but for now it needs you, and Ilm knows it."

[abbey.end_plain]
title = "The abbey held"
text = "The barrow host lies at the walls. The monks sing over the dead, and you ride out of the gate without a companion and without promises. The March knows now that you came."

# --- salt ---
[salt.map]
title = "The Salt Marsh"
description = "A marsh of white salt, a causeway through the bog, and the Crown's Salt Gate to the east."
won = "The Salt Gate is taken. The March remembers who opened the road."

[salt.building.reedmere]
name = "Reedmere"
description = "A village on a dry island. Here they know the paths through the bog."

[salt.building.witch]
name = "The witch's hut"
description = "Bundles of herbs above the door and bones on a cord. Tess's mother does not ask why you came."

[salt.building.saltgate]
name = "The Salt Gate"
description = "The Crown's garrison guards the salt. Everything sold in the March goes through these gates."

[salt.building.watch]
name = "The watch post"
description = "Two dozen spears and a dry well at the causeway's north end."

[salt.building.den]
name = "The bandits' den"
description = "Old piles and a fire that burns all winter."

[salt.army.smugglers]
name = "The salt wagon"

[salt.army.patrol_north]
name = "The Crown's patrol"

[salt.army.bounty]
name = "Bounty men"

[salt.army.bog_ghosts]
name = "Ghosts of the bog"

[salt.army.unmarked]
name = "Old watch"

[item.salt_bow]
name = "Tess's bow"
description = "A hunting bow of yew. Tess cut the mark of her trail into it."

[item.salt_salve]
name = "Bog salve"
description = "A thick salve of the marsh folk's herbs. It smells of smoke and hops."

[salt.arrival]
title = "The salt marsh"
text = "A causeway through the bog leads to the Salt Gate. The Crown pays for salt, and the March pays for the Crown. The wagon has already left the marsh. If it reaches the gate, the Crown will be fed and the March will go hungry."

[salt.reedmere]
title = "Reedmere"
text = "The marsh folk meet you with spears, but they do not shoot. Tess, the witch's daughter, stands in front. 'The Crown is looking for you on the roads,' she says. 'Ride as a bandit and no one will touch you. Or ride as an officer, and we will see.'"
disguise = "Dress as a bandit"
openly = "Ride openly"

[salt.caught]
title = "The gate"
text = "They know you at the gate. A guard lowers his spear: 'A bandit with an officer's bearing. Wait here until the men come.'"
draw = "Draw your blade"

[salt.witch]
title = "The witch's hut"
text = "Tess's mother looks at your company, then at what sits in it. 'The curse clings to you like bog mud. I can lift it, for herbs or gold. And if there is an Order's page in your book, I will burn it in front of you.'"
cure = "Lift the curse"
blessing = "Ask for a blessing (20 gold)"
page = "Burn the page from the book"

[salt.bog]
title = "The bog"
text = "Mist lies on the water. The ghosts look at you with empty eyes, and a cold stays on your skin. This is only the start."

[salt.tess]
title = "Tess"
text = "Tess lowers her eyes. 'Mother says I know the paths, but not the road back. If I go with you, be honest with the bog.' She holds out her hand."
take = "Take Tess into the company"
leave = "Not yet"

[salt.trail]
title = "The trail"
text = "Tess leads the company through the bog by a trail that is not on any map. The water holds while she walks. An hour later you come out at the eastern hills, on the white salt."

[salt.end_marsh]
title = "Salt and bog"
text = "The gate is open. Tess is the first into the salt store, and the marsh folk come for their share. The March knows now that the salt belongs to those who dig it."

[salt.end_alone]
title = "The Salt Gate"
text = "The gate is taken, and the garrison rides south. The marsh folk watch from afar and do not dare come closer. You are alone in the town that held the Crown. Will you hold it?"

# --- camp ---
[camp.map]
title = "The Companies' Camp"
description = "The camp of the free companies in the lowland of the March. The Crown's road runs past it, and the Crown needs guarding."
won = "The companies' camp holds. The companies remember who came to them first."

[camp.building.waygate]
name = "The camp stones"
description = "A standing stone by the company's fire. Old rune marks can still be read on it."

[camp.building.post]
name = "The Companies' post"
description = "A palisade and a dozen hired swords. The companies pay their men from the tolls on the road."

[camp.building.hall]
name = "The Empty Mug inn"
description = "Here the companies drink, play dice and decide whom to serve."

[camp.building.oakford]
name = "Oakford"
description = "A market town on the road. The Crown's garrison holds the gates, but the walls are low."

[camp.army.kord_band]
name = "Kord's company"

[camp.army.red_company]
name = "The Red Cloaks"

[camp.army.supply]
name = "The Crown's supply column"

[camp.army.duel_captain]
name = "The captain's guard"

[camp.army.unmarked]
name = "Old watch"

[camp.captain]
name = "Captain of the Crown's guard"

[item.camp_axe]
name = "The captain's axe"
description = "A heavy axe of the Crown's guard. Varga said she would take it if she won."

[camp.arrival]
title = "The companies"
text = "The free companies camp in the lowland, between the Crown and the barrows. They are not waiting for you, and they do not love the Crown. They say everyone here has a price, and whoever has none is already dead. A Crown supply column is on the road."

[camp.kord]
title = "Kord"
text = "The company's captain in a leather cloak raises his mug. 'I am Kord. My men follow whoever pays, and they keep their word as long as the pay keeps coming. Sixty gold, and we are with you. Or walk on.'"
hire = "Hire the company (60 gold)"
turn = "Refuse"

[camp.red]
title = "The Red Cloaks"
text = "A second company, in faded red cloaks, pitches its tents at the edge of the camp. Its captain says he serves whoever pays most, and does not believe in the Crown."
buy = "Buy the company (100 gold)"
leave = "Not now"

[camp.duel]
title = "The challenge"
text = "The captain of the Crown's guard stands in the arena and looks at your halberdier. 'Varga,' he says. 'They say you are a coward who sold the Crown for a crust of bread. Come out, if you are not afraid.'"
accept = "Let Varga fight the duel"
refuse = "Keep her out of it"

[camp.duel_won]
title = "The duel"
text = "The captain lies in the arena. Varga stands over him with her halberd lowered and wipes her face. She takes his axe and thanks no one."

[camp.duel_lost]
title = "Varga"
text = "The arena is empty. Varga is not in the ranks: they carried her away, or she fell and did not rise. The companies are silent, and no one says her name."

[camp.raid]
title = "The Crown's column"
text = "The Crown's supply column comes down the road with sacks of grain and barrels of salt. The guard is covered in dust and does not expect an ambush. You can strike from behind the stones, or let it pass."
hit = "Send the companies out of the camp"
pass = "Let the column pass"

[camp.loot]
title = "The spoils"
text = "Kord divides the loot. 'My men are owed their share,' he says. 'Split it fairly and we are brothers. Keep it all, and I will remember.'"
split = "Split it evenly"
keep = "Keep the spoils"

[camp.gate]
title = "The standing stone"
text = "An old sentry by the stone points at the marks. 'At night it glows if you light fires on all four sides. So they say. Try it?'"
light = "Light the fires"
leave = "Leave the stone in the dark"

[camp.relief]
title = "The Crown's relief"
text = "The Crown's guard comes from the north-east. Their banner is still new, and they march on the camp as if on parade."

[camp.trust]
title = "The companies' captain"
text = "The companies gather at the fire and raise their mugs. Everyone has heard your name. Gold passes from hand to hand, and no one asks where it came from."

[camp.end_friend]
title = "The free company"
text = "The Crown's guard lies before the camp. Kord sits beside you and watches the fire. 'You kept your word, and we keep yours. Let the Crown look for another.'"

[camp.end_hired]
title = "The mercenary"
text = "The Crown's guard lies before the camp. Kord takes his pay and rides on to the next employer. You owe him nothing now, and he owes you nothing."

[camp.end_betrayed]
title = "Betrayal"
text = "The Crown's guard lies before the camp, but Kord's company has ridden off into the steppe with the spoils. Kord swore he would come back, and the companies remember who refused to share first."

[camp.end_alone]
title = "The companies' camp"
text = "The Crown's guard lies before the camp. The companies raise their mugs to those who came. Without Kord and without Varga you are alone with them, and no one knows who you will ride with next."
# --- gates ---

[gates.map]
title = "The Gates"
description = "Four standing stones in the March. Each has its guard or its rite: the diary says which gates are open."
won = "The last gate is shut or taken. The barrows have come closer."

[gates.building.gate_n]
name = "Raven's Gate"
description = "Stones on a bare hill. The carvings are melted, as if burned from inside."

[gates.building.gate_e]
name = "Dawn Gate"
description = "The eastern stones stand in ash. At night a white fire burns on them."

[gates.building.gate_s]
name = "Reed Gate"
description = "Stones at the bog's edge. The warden takes a toll for passing, as at the ford."

[gates.building.gate_w]
name = "Ash Gate"
description = "Stones in a thin wood. Oaths were sworn here once."

[gates.building.reedmere]
name = "Reedmere"
description = "A village on a dry island. They remember who rode past."

[gates.army.guard_n]
name = "Ravens' Wraiths"

[gates.army.guard_e]
name = "Dawn's Dead"

[gates.army.guard_s]
name = "Reed Bandits"

[gates.army.guard_w]
name = "Crown Deserters"

[gates.army.barrow_reserve]
name = "The Barrow Host"

[gates.army.wraith_messenger]
name = "The Wraith Messenger"

[gates.army.sealed_host]
name = "The Sleeping Host"

[gates.gt_arrive_order]
title = "The Order's Order"
text = "The Order's inquisitors wait by the ford. Brother Ilm says nothing. They will follow you while you hold the March, and the Order will not say why."

[gates.gt_arrive_marsh]
title = "Tess's Paths"
text = "Tess waits at the edge of the bog with two hunters. \"You will cross the mire by our paths,\" she says. \"My people are faster than your horses. Keep up.\""

[gates.gt_arrive_companies]
title = "The Company's Contract"
text = "Kord meets you by the wagons. \"Thirty coins a week, officer, or my men leave. Gold first, words after.\""

[gates.gt_closed_e]
title = "The Dawn Gate"
text = "The stones of Dawn have gone dark. Bones in rusted mail lie between them, and white mist hangs over them. The gate is shut: a rite opens it, or the guard falling."
rite = "Brother Ilm reads the rite"
walk = "Step back"

[gates.gt_closed_s]
title = "The Reed Gate"
text = "The warden in a wet cloak raises his hand. \"The gate is open to those who pay. A hundred coins, and the stones are yours. Or go and speak to my men.\""
pay = "Pay a hundred coins"
varga = "Varga stays at the gate: her halberd holds the leaf"
walk = "Step back"

[gates.gt_closed_w]
title = "The Ash Gate"
text = "The stones in the wood are silent. Ash lies under them, and on the ash are footprints that lead nowhere. The gate does not answer."
charm = "Show the bog charm"
tess = "Tess leads by her path"
walk = "Step back"

[gates.gt_stone_n]
title = "The Raven's Gate"
text = "The stones of Raven burn blue. From here you can step to any open gate. Every crossing lays cold on your shoulders: taint +1."
to_e = "Step to the Dawn Gate"
to_s = "Step to the Reed Gate"
to_w = "Step to the Ash Gate"
stay = "Stay"

[gates.gt_stone_e]
title = "The Dawn Gate"
text = "White fire rises between the stones. The gate is open, and the dead know it."
to_n = "Step to the Raven's Gate"
to_s = "Step to the Reed Gate"
to_w = "Step to the Ash Gate"
stay = "Stay"

[gates.gt_stone_s]
title = "The Reed Gate"
text = "The stones at the bog draw water up from your boots. The way is open."
to_n = "Step to the Raven's Gate"
to_e = "Step to the Dawn Gate"
to_w = "Step to the Ash Gate"
stay = "Stay"

[gates.gt_stone_w]
title = "The Ash Gate"
text = "The ash on the stones is still warm. The gate is open."
to_n = "Step to the Raven's Gate"
to_e = "Step to the Dawn Gate"
to_s = "Step to the Reed Gate"
stay = "Stay"

[gates.gt_opened]
title = "A gate opens"
text = "The stones wake, and the carvings on them glow. The gate is open, and the dead are already stirring behind it."

[gates.gt_surge]
title = "Out of the gate"
text = "The dead come out of the stones. They march in rank, and no one leads them."

[gates.gt_betrayed]
title = "The company is not paid"
text = "Kord turns his men against you. \"The contract is over, officer. Money runs out first.\""

[gates.gt_messenger]
title = "A ghost by the stones"
text = "A grey man with no face stands by the road. He knows Brother Ilm's name and names the terms of the Barrow King. \"This is not slavery but a bargain. A pact that will outlive the March.\""
listen = "Hear him out"
away = "Send him off"

[gates.gt_last]
title = "The last gate"
text = "The fourth gate is open. The stones wait: they can be sealed or taken. Whatever you choose, the barrows will hear of it."
close = "Seal the gates: let the dead wait"
claim = "Take the gates: let the stones serve the March"

# --- barrows ---

[barrows.map]
title = "The Barrows"
description = "The Barrow King's country: fields, the river Pepelka and its ford, the dead hills, and a palace on a stony hill under the snow."
won = "The Barrow King is dead, and the March sleeps. Or does not."

# --- barrows bridges ---

[barrows.bridge.barrow]
name = "The barrow ford"

[barrows.building.throne]
name = "The Barrow King's Palace"
description = "A stone palace on a hill. Its windows glow without fire."

[barrows.building.ford_fort]
name = "The Ford Fort"
description = "The Crown's garrison holds the southern bank."

[barrows.building.watch_keep]
name = "The Watch Keep"
description = "A tower over the bogs. Its lights burn all night."

[barrows.building.chapel]
name = "The Order's Chapel"
description = "The bell rings without wind."

[barrows.building.marsh_village]
name = "Reedmere"
description = "A village on a dry island. Tess knows where to find it."

[barrows.building.camp]
name = "The Free Companies' Camp"
description = "Tents, wagons and barrels. Everything is sold here except forgiveness."

[barrows.army.barrow_king]
name = "The Barrow King"

[barrows.army.sealed_host]
name = "The Sleeping Host"

[barrows.bw_arrive]
title = "The barrows call"
text = "The barrows are silent no longer. Mist rises from under the hills, and the wind carries the voices of those buried here. The King waits in the north, in his palace. He wants you to come yourself."

[barrows.bw_rises]
title = "The Barrow King"
text = "A host rises from the hill in the north. Death knights come in an even rank. The King did not send them to buy the March. He sent them to take it."

[barrows.bw_allies]
title = "The allies march"
text = "Your allies show on the road to the barrows. They march north, to the palace, and do not look back. The dead see them too."

[barrows.bw_curse]
title = "A curse"
text = "A cold wave runs through the host. Banners go dark, horses shy. The curse settles on the garrisons and on your host, and it seems it will not leave."

[barrows.bw_remedy]
title = "Cleansing"
text = "There is a way to wash the taint here. Choose before the curse takes root deeper."
rite = "The Order's rite (Brother Ilm)"
herbs = "Bog herbs"
buy = "Pay the company for a brew (60 coins)"
none = "Do not cleanse"

[barrows.bw_fate_varga]
title = "Varga"
text = "Varga stands on the hill with her halberd. \"I will walk to the palace,\" she says. \"Or I will stay here, if that is what is needed.\""
walk = "Walk together"
leave = "Leave her to hold the gate"

[barrows.bw_fate_tess]
title = "Tess"
text = "Tess sits on a stone in the mire. \"I know the path through the barrows,\" she says. \"No dead there, only water. But I will not go back.\""

[barrows.bw_fate_ilm_inq]
title = "Brother Ilm"
text = "Ilm unrolls a scroll. \"The Order will not forgive your mistake, but it will not forgive the dead either. I give you my word, not your fate.\""

[barrows.bw_fate_ilm_heresy]
title = "Brother Ilm"
text = "Ilm looks at you without fear. \"The grey man waits by the palace. You know what he offers. Decide for yourself, and I will be the witness.\""

[barrows.bw_fate_kord]
title = "Kord"
text = "Kord stands by the wagons. \"The company wants its pay, officer. Give what you promised, or we leave and take what you have not paid for.\""
pay = "Pay fifty coins"
shake = "Shake his hand"

[barrows.bw_throne]
title = "The throne"
text = "The palace is empty, and the throne stands in the middle of the hall. Cold reaches from it to your shoulders. The Barrow King waits behind the door."

[barrows.bw_grey_throne]
title = "The Grey Bargain"
text = "A grey ghost waits by the throne. \"Kneel, and the dead will lower their swords. The March will not be yours, but it will not be a grave either.\""
kneel = "Kneel before the throne"
stand = "Stand and fight"

[barrows.bw_king_slain]
title = "The King is dead"
text = "The Barrow King lies at the foot of the throne. His host crumbles to dust. The March still breathes, and someone must decide what becomes of it."
next = "Next"

[barrows.bw_sum_roads]
title = "Empty roads"
text = "The caravans never reached the March. The price of salt and bread has doubled, and the farmers count which merchants are to blame."
next = "Next"

[barrows.bw_sum_fire]
title = "Ash of the villages"
text = "The villages are burned, and no house stands in the fields. The farmers look at you as they looked at the barrows."
next = "Next"

[barrows.bw_council]
title = "The March's council"
text = "The barrows are silent. Choose what the March will be: the one that holds to the Crown and the Order, or the one that lives by the companies and the bog. If it holds to neither, there is only ash."
iron = "The Iron Peace: the Crown and the Order"
free = "The Free March: the companies and the marsh folk"
fall = "The fall of the March"

# --- campaign ---

[campaign.end_iron]
title = "The Iron Peace"
text = "The March becomes a quiet province of the Crown. The Order raises chapels on the barrows, and blue banners hang on the towers. The March is safe, but not free."

[campaign.end_free]
title = "The Free March"
text = "The March belongs to the companies and the bog. The roads are open to whoever pays, and nobody asks where the gold came from. The barrows still stir, but no longer at a king's word."

[campaign.end_grey]
title = "The Grey Bargain"
text = "You knelt before the throne, and the dead lowered their swords. Your name is whispered in the barrows now. The March did not burn and is not free: it became a home for those who did not die all the way."

[campaign.end_fall]
title = "Ash at the ford"
text = "The barrows came to the ford. You died at the water, and the March fell with you. No one will call it the Ash March again: nothing is left of it."

# --- named characters of the later chapters (the chapter that brings each one first) ---
[marka.named]
ilm = "Brother Ilm"

[salt.named]
tess = "Tess"

[camp.named]
kord = "Kord"

[siegetest.map]
title = "Siege test"
description = "A short field battle for the siege script."
won = "The dead are beaten."

[siegetest.army.dead]
name = "The dead"

[marka.arrival]
title = "The Crown's surgeon"
text = "You ride into Ashford with a sword in your hand and blood on your boots. The Crown's surgeon patches you at the gate and speaks plainly: \"Three powers want the March here. The Crown sits in this town, but has few men. The Order holds the abbey and its shrines. The Free Companies camp to the south-east and sell themselves for gold. The marsh folk want one thing: to be left alive. You need an ally. The council will meet when you have helped at least two.\""
take = "Drink the draught"

[marka.item.crown_draught]
name = "Crown's draught"
description = "A brown potion of the Crown's surgeon. It closes the worst of a wound."

[marka.item.order_balm]
name = "Order's balm"
description = "A green balm of the Order's monks. It closes a wound and gives back strength."

[marka.item.marsh_herbs]
name = "Marsh herbs"
description = "Bitter herbs of the marsh folk, dried over a smoky fire. They stop bleeding."

[marka.item.company_draught]
name = "Company draught"
description = "A strong draught from the Companies' camp, drunk from a tin cup. It mends a wound."

# --- gates: the diary (chapter 4) ---
[quest.gates]
title = "The gates"
start = "Four stones stand in the March, and the dead walk through them. Open the gates: each guard or rite opens one. Open stones carry you from stone to stone, but every crossing leaves cold on your shoulders: Fear and taint +1."

[quest.gate_n]
title = "Raven's Gate (north)"
text = "The guard at the stone: the dead and the ghosts. Beat them and the gate opens."

[quest.gate_e]
title = "Dawn Gate (east)"
text = "The stone stands in ash. Brother Ilm knows the rite, or beat the guard."

[quest.gate_s]
title = "Reed Gate (south)"
text = "The warden takes a hundred coins, or Varga holds the leaf with her halberd, or beat the guard."

[quest.gate_w]
title = "Ash Gate (west)"
text = "A bog charm or Tess's path. Or beat the guard."

# --- barrows: the diary (chapter 5) ---
[quest.barrows]
title = "The barrows"
start = "The whole March marches on the barrows. The Crown and the Order behind you: the Iron Peace. The Companies or the marsh folk behind you: the Free March. Brother Ilm heard the dead's messenger: the Grey Bargain on the throne. With none of these, the March falls."
warn = "Fear: 3 of 5. The barrows stir, and the first host of the dead is on its way."

# --- marka: the diary (chapter 2) ---
[quest.find_ally]
title = "Find an ally"
start = "The March cannot be held by one hand. Help two of the three powers and the council will meet. The Crown and the Order sit at Ashford and the abbey, the companies at their camp, the marsh folk at Grey Willows. Choose whom to trust."

[quest.power_crown]
title = "The Crown"
text = "The garrison's captain at Ashford. Serve the Crown or go your own way."

[quest.power_order]
title = "The Order of Ash"
text = "The monk at the shrine asks you to cleanse the altar, and to take its guards."

[quest.power_marsh]
title = "The marsh folk"
text = "Tess asks you to find the ghosts' lair in the bog and burn it out."

[quest.power_companies]
title = "The Free Companies"
text = "Kord sells his company by the camp for gold. The price: forty coins."
