description = "Рыночный городок у среднего брода. Гарнизон Короны ещё держит ворота, но капитан смотрит на тебя без доверия."

[marka.building.millspring]
name = "Мельничный Ключ"
description = "Деревня к северу от Брода. Колесо мельницы ещё крутится, но ворота заперты."

[marka.building.greyreed]
name = "Серые Ивы"
description = "Деревня на сухом островке в солончаках. Здесь живёт болотный люд."

[marka.building.abbey]
name = "Разрушенное аббатство"
description = "Стены аббатства черны от огня. Орден держит колокольню и требует, чтобы его не трогали."

[marka.building.shrine]
name = "Святилище Пепла"
description = "Алтарь у старой дороги. От него тянет сырой землёй и чем-то сладким."

[marka.building.barrow]
name = "Курганы"
description = "Холмы над стоячими камнями. Земля здесь тёплая и гудит."

[marka.building.camp]
name = "Лагерь рот"
description = "Частокол, костры и знамя без герба. Здесь торгуют тем, что можно продать."

[marka.army.caravan]
name = "Обоз Короны"

[marka.army.patrol_w]
name = "Патруль Короны (запад)"

[marka.army.patrol_n]
name = "Патруль Короны (север)"

[marka.army.raiders]
name = "Разбойники на дороге"

[marka.army.kord_band]
name = "Рота Корда"

[marka.army.wraiths]
name = "Призраки топи"

[marka.unit.ash_knight]
name = "Пепельный рыцарь"
description = "Рыцарь, поднятый из кургана. Доспех прожжён насквозь."

[marka.item.ash_seal]
name = "Печать Пепла"
description = "Медная печать Ордена с выжженным кругом. Открывает стоячие врата, если помнишь, как."

[marka.item.company_token]
name = "Знак роты"
description = "Жетон Вольных рот. В любой лагерь пускают без вопросов."

[marka.captain]
title = "Капитан гарнизона"
text = "Капитан не встаёт из-за стола. «Ты тот, кого прислали без войска и без денег. Короне нужны офицеры, а не ссыльные. Что скажешь?»"
serve = "Служу Короне"
alone = "Я сам по себе"
gold = "Просить золото на гарнизон"

[marka.shrine_offer]
title = "Святилище"
text = "Монах Ордена ждёт у старой дороги. «Алтарь осквернён: по ночам из него сочится тьма. Очисти его, и Орден запомнит». Внутри, говорят, стоят мертвецы."
accept = "Очищу"
refuse = "Не моё дело"

[marka.shrine_inside]
title = "Внутри святилища"
text = "Алтарь треснул, на нём лежит ржавый обруч с чужими рунами. Послушник в рясе, брат Ильм, молится и не смотрит на тебя. «Очистить по обряду, — говорит он, — или взять чёрную силу, пока её не взяли мертвецы?»"
cleanse = "Очистить по обряду (Орден)"
take = "Взять силу проклятия (ересь)"

[marka.ritual_offer]
title = "Врата"
text = "Стоячий камень звенит под рукой. Брат Ильм ждёт у подножия: «Печать Пепла откроет врата. Одна дорога, одна ночь, и войско мертвецов потеряет путь к броду»."
open = "Открыть врата печатью"
walk = "Не сейчас"

[marka.marsh_offer]
title = "Болотный люд"
text = "Тэсс, охотница с дальнего края топи, стоит у ворот Серых Ив. «Призраки выходят из-под воды. Найди их логово и выжги его. Тогда я пойду с тобой»."
accept = "Пойду в топь"
later = "Потом"

[marka.tess_join]
title = "Тэсс"
text = "Призраки рассыпались туманом. Тэсс обтирает нож о траву: «Долг заплачен. Иду с тобой, пока не скажу иначе»."

[marka.kord_offer]
title = "Корд"
text = "Корд, капитан Вольных рот, сидит на бочке с элем. «Моя рота стоит дёшево, но бьётся дорого. Сорок монет, и она твоя. Или ты предпочтёшь выдать меня Короне за награду?»"
hire = "Нанять роту: сорок монет"
betray = "Выдать Корда Короне"
walk = "Уйти"

[marka.council]
title = "Совет Марки"
text = "Два дела из трёх сделаны. Марка ждёт, кому ты присягнёшь. Выбирать можно только тех, кто тебе доверяет."
order = "Орден Пепла"
marsh = "Болотный люд"
companies = "Вольные роты"
later = "Ещё не время"

[marka.raid_warning]
title = "Разбойники"
text = "Из Пепельного Брода вышел обоз с солью и мукой. Кто-то из разбойников знает его путь. За обозом пошли трое с копьями."

[marka.caravan_lost]
title = "Обоз пропал"
text = "Обоз не дошёл до лагеря. Пустую телегу нашли у дороги, возчиков не нашли. Цены на соль и муку в Пепельном Броде выросли за ночь."

[marka.caravan_safe]
title = "Обоз дошёл"
text = "Обоз дошёл до лагеря Вольных рот. Казна Короны заплатила проводникам, и тебе отсыпали свою долю."

[marka.mill_fell]
title = "Мельничный Ключ пал"
text = "Курганные дружинники вошли в деревню на рассвете. Мельница горит, колокол молчит: звонарь ушёл к мёртвым. Страх в Марке растёт."

[marka.marsh_fell]
title = "Серые Ивы пали"
text = "Солончаки вспыхнули ночью. Серые Ивы сгорели дотла, болотный люд ушёл за трясину. Тэсс не пришла на сбор."

[marka.host_stir]
title = "Курганы открываются"
text = "Холмы на северо-востоке шевелятся. Из-под земли встают рыцари в ржавых латах и твари на четырёх лапах. Они идут к деревне, и никто их не ведёт."

[marka.siege]
title = "Осада"
text = "Мёртвые стоят у околицы. Жители заперлись в домах, по крышам ходят тени. Ещё одна ночь, и деревни не будет."

[marka.host_beaten]
title = "Дружина легла"
text = "Рыцари легли у околицы и больше не встали. Крестьяне выходят из домов и благодарят. Корона заплатила за отчёт."

[marka.ilm_abbey]
title = "Аббатство"
text = "Брат Ильм ходит среди обломков, касаясь стен. «Здесь был архив, — шепчет он. — Наверное, в нём записано, как закрыть врата»."

[marka.sign_plague]
title = "Мор"
text = "Новолуние. У колодцев лежат птицы с раскрытыми клювами. Люди говорят, что это дыхание курганов."

[marka.sign_deserters]
title = "Дезертиры"
text = "У старого тракта появилась шайка дезертиров. Они бежали от Короны, и теперь их ведёт тот, кто платит. Торговцы обходят их стороной."

[marka.sign_merchant]
title = "Купеческий князь"
text = "Купец в шёлковом плаще проехал через Марку ночью и оставил кошель у порога: «За то, что держишь дорогу открытой»."

[marka.taint_week]
title = "Скверна"
text = "Проклятие в крови не спит. Ночью тебе слышится колокольный звон из-под земли, и Страх растёт вместе с ним."

[marka.revisit_abbey]
title = "Знамя Ордена"
text = "Над аббатством подняли чёрно-белое знамя. Орден прислал в Брод своего священника, и гарнизон уступил ему ворота. Капитан молчит."

[marka.revisit_salt]
title = "Серые Ивы возвращены"
text = "Болотный люд вернулся в деревню и принёс рыбу и соль. Дома отстроены, ворота открыты. Серые Ивы теперь твои, и люди просят об одном: не продавай их."

[marka.revisit_camp]
title = "Лагерь разросся"
text = "Вольные роты привели в лагерь ещё людей и оружия. Частокол выше, костров больше. Здесь ждут твоего слова."

[marka.stones_note]
title = "Надпись на камне"
text = "Стоячий камень исписан древним письмом. Брат Ильм читает вслух: «Кто ходит по камню, тот не касается земли». Больше камень ничего не говорит."
# --- abbey ---
[abbey.map]
title = "Аббатство"
description = "Разрушенное аббатство на каменном холме. С востока идут курганы, с севера инквизиция."
won = "Аббатство устояло. Орден записал твоё имя в книгу."

[abbey.building.abbey]
name = "Аббатство святого Ансельма"
description = "Стены в трещинах, колокол снят. Монахи держат ворота, пока могут."

[abbey.building.watch]
name = "Дозорная башня Короны"
description = "Гарнизон Короны не пустил сюда Орден. Теперь здесь тихо."

[abbey.building.alder]
name = "Ольховка"
description = "Деревня у болота. Ночью тут слышно, как кто-то поёт по-мёртвому."

[abbey.army.inquisitors]
name = "Инквизиция Ордена"

[abbey.army.dead_wave]
name = "Дружина курганов"

[abbey.army.unmarked]
name = "Старый караул"

[item.abbey_scripture]
name = "Книга Ильма"
description = "Устав Ордена, переписанный от руки. На полях мелким почерком записаны имена могил."

[item.abbey_water]
name = "Святая вода Ордена"
description = "Вода из колодца под аббатством. От мёртвых помогает, пока не кончится."

[abbey.arrival]
title = "Приказ Ордена"
text = "Ты дал Ордену слово на совете в Марке, и аббатство святого Ансельма теперь на тебе: его стены, его монахи и его долг. Корона запретила вмешиваться. Инквизиторы выступили с севера. С востока, из холода, идут курганы. Держи аббатство, пока инквизиторы не войдут в ворота."

[abbey.inquisitors]
title = "Инквизиторы"
text = "Инквизиторы въехали в ворота, не поднимая забрал. Старший называет цель: Ольховка, деревня у болота. Там прячут семью, которую задела скверна. «Орден велит сжечь деревню вместе с домами. Так очищают землю. Орден запомнит каждого, кто стоял у стен, и каждого, кто стоял в стороне»."

[abbey.blight]
title = "Холод"
text = "Трава тут серая и хрустит под копытами. Холод въедается в кости: каждый шаг под курганным ветром проклинает отряд. Снять скверну может только обряд в аббатстве (30 монет). Дальше идти — значит ехать под проклятием."

[abbey.walls]
title = "Проклятие на стенах"
text = "Мертвецы дошли до стен. Там, где они ударили, камень почернел, а монахи падают на молитве. Гарнизон аббатства проклят."

[abbey.siege]
title = "Курганы идут"
text = "Дружина курганов поднимается по склону и встаёт у южных ворот аббатства. Она ждёт, и никто не ведёт её, кроме старого приказа."

wall_falls = "Стена у ворот трескается и рушится: мёртвые хлынули в проём."
courtyard_warning = "Мёртвые стоят во дворе. Удержите их, или аббатство падёт."

[abbey.trial]
title = "Ольховка"
text = "Ольховка у болота. Все здоровы и все шепчутся. Ильм смотрит на крыши: «Здесь семья, которую задел мертвец, и мальчик, который уже не спит ночами. Сжечь значит: дома вместе с людьми, двадцать человек, и дети среди них. Пощадить значит взять их грех на себя. Решай сам»."
burn = "Сжечь деревню вместе с людьми (Орден +2, Корона −1)"
spare = "Пощадить: пусть уходят в топь (Орден −2, Ильм станет еретиком)"
ride = "Проехать мимо: ни суда, ни пощады"

[abbey.heresy]
title = "Шёпот Ильма"
text = "Ночью Ильм приходит один. «Орден сжигает, потому что боится. Есть и другой путь: принять то, что приходит от мёртвых, и не сгореть. Хочешь знать как?»"
accept = "Выслушать и принять дар"
refuse = "Отказаться и уйти"

[abbey.rite]
title = "Обряд очищения"
text = "Монахи готовы снять проклятие. Обряд стоит денег: свечи, святая вода, молитва на всю ночь."
rite = "Пройти обряд (30 монет)"
decline = "Не нужно, справлюсь сам"

[abbey.inquisition]
title = "Приговор"
text = "Инквизиторы опускают знамёна. «Ты осквернён, и ты пришёл сюда, — говорит старший. — Тогда закончим здесь». Они бросаются в бой."

[abbey.end_inquisitor]
title = "Огонь и порядок"
text = "Мертвецы легли у стен аббатства. Ильм стоит над сожжённой Ольховкой и не отводит глаз. Орден записывает: «Очищено». Марка запомнит костры."

[abbey.end_heretic]
title = "Серый свет"
text = "Мертвецы легли у стен, но Ильм смотрит не на них, а на тебя. Орден не простит ереси, но сейчас он нуждается в тебе, и Ильм это знает."

[abbey.end_plain]
title = "Аббатство устояло"
text = "Курганная дружина легла у стен. Монахи поют над мёртвыми, а ты выходишь из ворот без спутника и без обещаний. Марка знает теперь, что ты пришёл."

[abbey.pilgrims]
title = "Паломники"
text = "Обоз паломников стоит у развилки. Корона не пускает их к аббатству: «Приказано не пропускать». Женщина прижимает ребёнка и спрашивает, правда ли, что монахи ещё кормят всех у ворот. Ответить ей можно только дорогой."

[abbey.cross]
title = "Крест у дороги"
text = "У дороги крест, а на нём прибит указ Ордена: «Кто стоит в стороне, тот выбрал Корону». Дозорная башня Короны видна на востоке, и её гарнизон следит за дорогой."

[abbey.tithe]
title = "Амбар десятины"
text = "Амбар, где Орден собирал десятину, сгорел дотла. На воротах мелом выведено «Ольховка» и нарисован дом с чёрной крышей. Кто-то показывает путь."

[abbey.messenger]
title = "Гонец"
text = "Монах бежит навстречу, ноги в грязи. «Холод на востоке, за гребнем! Мёртвые собираются там каждую ночь. Если пойдёшь туда, бери людей и не снимай кольчугу». Он суёт тебе обрывок карты с отметкой холода."

[abbey.ilm_home]
title = "Возвращение Ильма"
text = "Монахи у ворот узнают Ильма. Один крестится, другой отворачивается. «Ты вернулся с тем, кто ходит с мертвецами?» Ильм молчит, потом говорит тихо: «Я вернулся, потому что здесь моё место. Я только не знаю, какое»."

# --- salt ---
[salt.map]
title = "Солончаки"
description = "Болото с белой солью, гать через топь и Соляные Ворота Короны на востоке."
won = "Соляные Ворота взяты. Марка помнит, кто открыл дорогу."

[salt.building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Здесь знают тропы сквозь трясину."

[salt.building.witch]
name = "Хижина ведьмы"
description = "Пучки трав над дверью и кости на верёвке. Мать Тэсс не спрашивает, зачем пришли."

[salt.building.saltgate]
name = "Соляные Ворота"
description = "Гарнизон Короны стережёт соль. Через эти ворота идёт всё, что продают в Марке."

[salt.building.watch]
name = "Сторожевой пост"
description = "Два десятка копий и сухой колодец на северном конце гати."

[salt.building.den]
name = "Разбойничье логово"
description = "Старые сваи и костёр, который горит всю зиму."

[salt.army.smugglers]
name = "Соляной обоз"

[salt.army.patrol_north]
name = "Патруль Короны"

[salt.army.bounty]
name = "Охотники за головами"

[salt.army.bog_ghosts]
name = "Призраки трясины"

[salt.army.unmarked]
name = "Старый дозор"

[item.salt_bow]
name = "Лук Тэсс"
description = "Охотничий лук из тиса. Тэсс вырезала на нём метку своей тропы."

[item.salt_salve]
name = "Болотная мазь"
description = "Густая мазь из трав болотного люда. Пахнет дымом и хмелем."

[salt.arrival]
title = "Солончаки"
text = "Тэсс передала весть от ведьмы: Соляные Ворота на востоке вешают болотный люд за контрабанду соли. Соль — единственная монета Топи. Возьми ворота, и болото будет доверять тебе. Обоз Короны уже вышел из трясины: налоговый, с солью для гарнизона. Его можно перехватить, но Корона запомнит."

[salt.reedmere]
title = "Тростниковая Топь"
text = "Болотный люд встречает тебя копьями, но не стреляет. Впереди стоит Тэсс, дочь ведьмы. «Корона ищет тебя на дорогах. Поедешь как разбойник, и в наших плащах тебя пустят к воротам за контрабандиста. Или поедешь открыто, и тогда поглядим». Топь отдаёт тебе свой тайный солевой склад: двести монет."
disguise = "Переодеться в разбойника (до ворот)"
openly = "Ехать открыто (Корона пойдёт за тобой)"

[salt.caught]
title = "Ворота"
text = "У ворот тебя узнали. Плащ контрабандиста открыл дверь, но не спрятал выправку: «Разбойник с офицерской выправкой. Ждите, пока придут люди»."
draw = "Обнажить клинок"

[salt.witch]
title = "Хижина ведьмы"
text = "Мать Тэсс смотрит на твой отряд, потом на то, что в нём сидит. «Проклятие липнет к тебе, как болотная грязь. Я сниму его, если заплатишь травами или золотом. А если в твоей книге есть страница Ордена, сожгу её при тебе»."
cure = "Снять проклятие"
blessing = "Заказать благословение (20 монет)"
page = "Сжечь страницу из книги"

[salt.bog]
title = "Трясина"
text = "Туман стелется по воде. Призраки смотрят пустыми глазами, и на коже остаётся холод. Ведьма на краю трясины снимет это, если попросишь."

[salt.tess]
title = "Тэсс"
text = "Тэсс опускает глаза. «Мать говорит, что я знаю тропы, но не дорогу назад. Я знаю тропу через топь, которой нет на карте. Если поеду с тобой, будь честен с болотом». Она протягивает руку."
take = "Взять Тэсс в отряд"
leave = "Не сейчас"

[salt.trail]
title = "Тропа"
text = "Тэсс ведёт отряд через трясину по тропе, которой нет на карте. Вода держит, пока идёт она. Через час вы выходите к восточным холмам, на белую соль."

[salt.end_marsh]
title = "Соль и болото"
text = "Ворота открыты. Тэсс первой входит в соляной склад, и болотный люд приходит за своей долей. Марка знает теперь, что соль принадлежит тем, кто её добывает."

[salt.end_alone]
title = "Соляные Ворота"
text = "Ворота взяты, и стража уходит на юг. Болотный люд смотрит издали и не решается подойти. Ты один в городе, который держал Корону. Удержишь ли его?"

[salt.flats]
title = "Соляная корка"
text = "Соляная корка хрустит под сапогами. На белом камне висит контрабандист, на груди доска: «Продавал соль мимо Короны». Болото платит за соль жизнью, а Корона — за каждую пригоршню."

[salt.chapel]
title = "Затопленная часовня"
text = "Вода стоит по самые окна часовни. Колокол лежит на дне, а на алтаре вместо свечей горят комки соли. Кто-то молился здесь, пока вода не пришла."

[salt.cart]
title = "Соляная телега"
text = "Телега застряла в трясине по ступицы. Соль в мешках промокла, и на мешках печать Короны. Болотный люд вывозит соль тайно, а Корона берёт десятину и ещё хочет больше."

[salt.lights]
title = "Болотные огни"
text = "Над тропой горят огни: зелёные, ровные, как фонари. Тэсс не смотрит на них: «Они зовут. Кто пошёл на зов, тот остался в топи». Ведьма говорит то же, но тише."

[salt.den_scene]
title = "Логово"
text = "Старое логово на сваях: костёр горит, котёл пуст, у огня спят двое. Один открывает глаз: «Соль? Мы её не видели. Иди прямо, и не оглядывайся на огонь»."

[salt.bones]
title = "Кости на жердях"
text = "На жердях у тропы висят кости, обвязанные тряпками. Тэсс говорит, что так болото отдаёт долги. Дальше тропа ведёт к Тростниковой Топи."

# --- camp ---
[camp.map]
title = "Лагерь рот"
description = "Лагерь вольных рот в низине посреди Марки. Дорога Короны идёт мимо, и ей нужна охрана."
won = "Лагерь рот держится. Роты помнят, кто пришёл к ним первым."

[camp.building.waygate]
name = "Камни лагеря"
description = "Стоячий камень у костра роты. Старые рунические метки ещё можно прочесть."

[camp.building.post]
name = "Застава рот"
description = "Частокол и десяток наёмников. Рота платит своим из пошлин на дороге."

[camp.building.hall]
name = "Трактир «Пустая кружка»"
description = "Здесь роты пьют, играют в кости и решают, кому служить."

[camp.building.oakford]
name = "Окфорд"
description = "Торговый город на дороге. Гарнизон Короны держит ворота, но стены низкие."

[camp.army.red_company]
name = "Красные плащи"

[camp.army.supply]
name = "Обоз Короны"

[camp.army.duel_captain]
name = "Гвардия капитана"

[camp.army.unmarked]
name = "Старый дозор"

[camp.captain]
name = "Капитан гвардии Короны"

[item.camp_axe]
name = "Секира капитана"
description = "Тяжёлая секира гвардии Короны. Варга сказала, что возьмёт её, если выиграет."

[camp.red]
title = "Красные плащи"
text = "Вторая рота, в выцветших красных плащах, ставит палатки у края лагеря. Их капитан говорит, что служит тому, кто платит больше всех, и не верит в Корону."
buy = "Купить роту (100 монет)"
leave = "Не сейчас"

[camp.duel]
title = "Вызов"
text = "Капитан гвардии Короны стоит в арене и смотрит на твою алебардщицу. «Варга, — говорит он. — Говорят, ты трусиха, которая продала Корону за кусок хлеба. Выйди, если не боишься»."
accept = "Пусть Варга выйдет на поединок"
refuse = "Не давать ей драться"

[camp.duel_won]
title = "Поединок"
text = "Капитан лежит в арене. Варга стоит над ним, опустив алебарду, и вытирает лицо. Она берёт его секиру и не благодарит никого."

[camp.duel_lost]
title = "Варга"
text = "Арена пуста. Варги нет в строю: её унесли или она сама упала и не встала. Роты молчат, и никто не говорит её имени."

[camp.relief]
title = "Подмога Короны"
text = "С северо-востока идут гвардейцы Короны. Их знамя ещё новое, и они идут к лагерю, как на парад."

[camp.trust]
title = "Капитан роты"
text = "Роты собираются у костра и поднимают кружки. Твоё имя слышат все. Золото идёт по рукам, и никто не спрашивает, откуда оно."

[camp.end_friend]
title = "Вольная рота"
text = "Гвардия Короны легла у лагеря. Корд сидит рядом и смотрит на огонь. «Ты держал слово, и мы держим твоё. Пусть Корона ищет другого»."

[camp.end_hired]
title = "Наёмник"
text = "Гвардия Короны легла у лагеря. Корд получает плату и уходит к следующему нанимателю. Ты больше не в долгу перед ним, и он больше не в долгу перед тобой."

[camp.end_betrayed]
title = "Предательство"
text = "Гвардия Короны легла у лагеря, но рота Корда ушла в степь с добычей. Корд обещал вернуться, и роты помнят, кто первым отказался делиться."

[camp.end_alone]
title = "Лагерь рот"
text = "Гвардия Короны легла у лагеря. Роты поднимают кружки за тех, кто пришёл. Без Корда и без Варги ты остался один с ними, и никто не знает, с кем ты пойдёшь дальше."
[camp.arrival]
title = "Роты"
text = "Вольные роты стоят в низине между Короной и курганами. Корд, которого ты нанял в Ашфорде, машет кружкой на костёр. «Гвардия придёт, это точно. Вопрос — когда. Если ничего не трогать, у нас три недели. Если ударить по обозу Короны и купить красных, придёт раньше. Корона не любит, когда её торопят». Кружка стучит по столу, и он смеётся."

[camp.loot]
title = "Добыча"
text = "Корд делит добычу. «Моим людям положена доля, — говорит он. — Раздели честно, и мы будем братьями. Оставь себе всё, и я вспомню это»."
split = "Раздать поровну: Корд станет другом"
keep = "Оставить себе: Корд уйдёт и ударит"

[camp.raid]
title = "Обоз Короны"
text = "Обоз Короны идёт по дороге с мешками зерна и бочками соли. Охрана в пыли и не ждёт засады. Можно ударить из-за камней или пропустить."
hit = "Ударить из-за камней (бой)"
pass = "Пропустить обоз: Корона +1"

[camp.gate]
title = "Стоячий камень"
text = "У камня старый караульный показывает на метки. «Ночью он светится, если зажечь огонь с четырёх сторон. Так говорят. Попробовать? Что он откроет, узнаешь позже»."
light = "Зажечь огонь: откроются врата"
leave = "Оставить камень в темноте"

[camp.quest.hold]
title = "Удержать лагерь"
text = "Корона пришлёт гвардию к залу, но не раньше чем через три недели. Раньше, если ударить по обозу Короны и купить красных плащей. Предупреждение придёт за день."
warned = "Гвардия Короны выступила с северо-востока. Завтра она будет у зала. Встреть её там."
here = "Гвардия Короны стоит у зала. Разбей её, и лагерь устоит."

[camp.quest.supply]
title = "Обоз Короны"
text = "Обоз идёт по дороге к повороту у южного рва. Ударить из-за камней или пропустить?"

[camp.quest.red]
title = "Красные плащи"
text = "Вторая рота у края лагеря. Купить её за сто монет или не связываться?"

[camp.quest.duel]
title = "Поединок"
text = "Капитан гвардии вызывает Варгу на арену. Выйдет ли она?"

[camp.quest.gate]
title = "Стоячий камень"
text = "Камень у костра. Зажечь ли его: что он откроет, решит глава четвёртая."

[camp.relief_warn]
title = "Гвардия выступила"
text = "Дозорный на сигнальной башне кричит с холма: синие плащи идут с северо-востока, по дороге к лагерю. Завтра утром они будут у зала. Корд ухмыляется: «Ну вот, теперь весело». Роты поправляют оружие."

[camp.ledger]
title = "Учётная доска"
text = "Доска у дороги, исписанная мелом. Роты записали пошлины: «обоз Короны — сорок на брата, караван Марки — десять, беглецов не брать». Внизу приписка другой рукой: «Корона платит вдвое, если мы не лезем в её дела. Не лезем»."

[camp.gibbet]
title = "Виселица"
text = "На перекрёстке висит человек в сюртуке писаря. На груди табличка: «Считал налоги мёртвым». Ворона уже выклевала ему глаза. Роты здесь не шутят."

[camp.sign]
title = "Развилка"
text = "Столб указывает на север, к холмам и сигнальным башням Короны, и на юг, в лагерь. Кто-то выжег на нём углём: «Гвардия придёт на третьей неделе. Или раньше, если разозлить»."

[camp.herd]
title = "Стадо роты"
text = "Коровы и мулы пасутся без присмотра у дороги. Пастушок лет десяти смотрит исподлобья: «Корона отняла наших коров. Роты забрали их обратно. Теперь всё по-честному». Монет он не просит."

[camp.carts]
title = "Телеги Короны"
text = "Пустые телеги Короны стоят в ряд. Колёса сняты, бочки выбиты. Роты поделили всё, кроме колёс, а колёса никому не нужны."

[camp.hall]
title = "Пустая кружка"
text = "В трактире шумно. Корд сидит у окна и играет в кости с двумя бандитами. «Долги ты уже раздал, — говорит он, не поднимая глаз. — Теперь раздай себя». Кости падают: шесть."

[camp.fence]
title = "Ворота лагеря"
text = "Ворота заперты. Стражник называет пароль, которого ты не знаешь, и всё равно открывает: «Корд сказал, что ты наш». Слово Корда здесь стоит дороже монеты."

[camp.west_road]
title = "Дорога Короны"
text = "Каменная дорога Короны уходит на запад. Верстовой столб ушёл в землю наполовину, и на нём видно: «Окфорд, тридцать миль»."

[camp.guardsman]
title = "Мёртвый гвардеец"
text = "Гвардеец лежит лицом в траве. Кошель пуст, печать казначейства сорвана. Следов, кроме следов роты, нет. Роты, похоже, оставили ему на память только лицо."

[camp.kord_fire]
title = "Старый костёр"
text = "Потухший костёр, а на камне вырезан знак Корда: кружка с мечом. Здесь стояла его рота, пока её не позвали к Ашфорду. Корд молчит о том, почему ушёл."

[camp.farm]
title = "Ферма у Окфорда"
text = "Ферма у дороги. Дверь выбита, в колодце что-то, о чём не хочется думать. Окфорд не пускает беженцев: ворота закрыты, на стенах гвардия Короны."

[camp.crows]
title = "Вороны над дорогой"
text = "Над дорогой кружат вороны. В канаве лежит телега без возницы, а на её борту мелом написано: «Не ходить к Окфорду». Кто-то уже не послушался."

[camp.oakford_walls]
title = "Стены Окфорда"
text = "Низкие стены Окфорда. Гвардейцы на башне считают роты и кричат: «Вольные, уходите, или будем стрелять». Стрел пока нет. Корд: «Они стреляют, только когда им скажут»."

[camp.arena]
title = "Арена"
text = "Круг, вытоптанный в грязи, колья и щиты. Гвардия Короны тренируется здесь каждый день. Капитан смотрит на тебя из-за ограды, и видно, что ему скучно."

[camp.stakes]
title = "Колья"
text = "Колья у дороги, заострённые и обожжённые. Роты поставили их, чтобы конница не прошла. Одна лошадь всё ещё привязана к колу, и никто не пришёл её забрать."

[camp.ditch]
title = "Ров"
text = "Ров с мёртвыми лошадьми. Роты воткнули кол: «Сюда не ходить, там холод». Тяжёлый запах тянется над дорогой, и руки мёрзнут без причины."

[camp.track]
title = "След обоза"
text = "Тропа вдоль рва выходит на дорогу. В грязи видны колёса: обоз прошёл здесь вчера и пройдёт снова. Ждать недолго."

[camp.watchtower]
title = "Смотровая башня"
text = "Башня Короны пуста, но с неё видна дорога на северо-восток. По ней идёт пыль: кто-то уже движется к лагерю. Пока далеко."

[camp.stones]
title = "Камни на холмах"
text = "Камни стоят в старом порядке, и ветер в них поёт низко, как трубы. Роты говорят, что это гвардия. Пастухи говорят, что это курганы. Сейчас здесь только ветер."

[camp.hill]
title = "Вешки на холме"
text = "Дорога поднимается между камней. По обочинам воткнуты вешки с лентами: роты отмечают, где можно пройти, а где уже прошла гвардия. Лент много, и самые свежие ещё не выцвели."

[camp.banner]
title = "Знамя"
text = "На вершине холма воткнуто знамя Короны. Кто-то срезал с него герб. Внизу, на дороге, идут маленькие фигурки в синем: гвардия, и её много."

# --- gates ---

[gates.map]
title = "Врата"
description = "Четыре стоячих камня в Марке. У каждого свой страж или свой обряд: дневник говорит, какие врата открыты."
won = "Последние врата закрыты или заняты. Курганы подошли ближе."

[gates.building.gate_n]
name = "Врата Ворона"
description = "Камни на голом холме. Надписи оплавлены, будто их жгли изнутри."

[gates.building.gate_e]
name = "Врата Зари"
description = "Восточные камни стоят в золе. По ночам на них горит белый огонь."

[gates.building.gate_s]
name = "Врата Камыша"
description = "Камни у болота. Сторож берёт плату за проход, как у брода."

[gates.building.gate_w]
name = "Врата Пепла"
description = "Камни в редком лесу. Здесь когда-то давали клятвы."

[gates.building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Там помнят, кто проехал мимо."

[gates.army.guard_n]
name = "Призраки Ворона"

[gates.army.guard_e]
name = "Мёртвые Зари"

[gates.army.guard_s]
name = "Разбойники Камыша"

[gates.army.guard_w]
name = "Беглые солдаты Короны"

[gates.army.barrow_reserve]
name = "Курганная дружина"

[gates.army.wraith_messenger]
name = "Призрачный посланник"

[gates.army.sealed_host]
name = "Спящая дружина"

[gates.gt_arrive_order]
title = "Приказ Ордена"
text = "Инквизиторы Ордена ждут у брода. Брат Ильм молчит. Они пойдут за тобой, пока ты удерживаешь Марку, и Орден не скажет зачем."

[gates.gt_arrive_marsh]
title = "Тропы Тэсс"
text = "Тэсс ждёт на краю болота с двумя охотниками. «Через топь пройдёшь по нашим тропам, — говорит она. — Мои люди быстрее ваших коней. Не отставайте»."

[gates.gt_arrive_companies]
title = "Контракт роты"
text = "Корд встречает тебя у фургонов. «Тридцать монет за неделю, офицер, или мои люди уйдут. Золото сначала, слова потом»."

[gates.gt_closed_e]
title = "Восточные врата"
text = "Камни Зари погасли. Между ними лежат кости в ржавой броне, над ними стоит белый туман. Врата закрыты: их открывает обряд или падение стражи."
rite = "Брат Ильм читает обряд"
walk = "Отойти"

[gates.gt_closed_s]
title = "Врата Камыша"
text = "Сторож в мокром плаще поднимает руку. «Врата открыты для тех, кто платит. Сто монет, и камни твои. Или подходи к моим людям»."
pay = "Заплатить сто монет"
varga = "Варга остаётся у врат: её алебарда держит створку"
walk = "Отойти"

[gates.gt_closed_w]
title = "Врата Пепла"
text = "Камни в лесу молчат. Под ними пепел, а на нём следы, которые никуда не ведут. Врата не отзываются."
charm = "Показать болотный оберег"
tess = "Тэсс ведёт тропой"
walk = "Отойти"

[gates.gt_stone_n]
title = "Врата Ворона"
text = "Камни Ворона горят синим. Отсюда можно шагнуть к любым открытым вратам. Каждый проход ложится холодом на плечи: скверна +1."
to_e = "Шагнуть к Вратам Зари"
to_s = "Шагнуть к Вратам Камыша"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_e]
title = "Врата Зари"
text = "Белый огонь поднимается между камнями. Врата открыты, и мёртвые это знают."
to_n = "Шагнуть к Вратам Ворона"
to_s = "Шагнуть к Вратам Камыша"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_s]
title = "Врата Камыша"
text = "Камни у болота тянут воду из сапог. Путь открыт."
to_n = "Шагнуть к Вратам Ворона"
to_e = "Шагнуть к Вратам Зари"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_w]
title = "Врата Пепла"
text = "Пепел на камнях ещё тёплый. Врата открыты."
to_n = "Шагнуть к Вратам Ворона"
to_e = "Шагнуть к Вратам Зари"
to_s = "Шагнуть к Вратам Камыша"
stay = "Остаться"

[gates.gt_opened]
title = "Врата открыты"
text = "Камни ожили, и узор на них светится. Врата открыты, и за ними уже шевелятся мёртвые."

[gates.gt_surge]
title = "Из врат"
text = "Из камней выходят мёртвые. Они идут строем, и их никто не ведёт."

[gates.gt_betrayed]
title = "Роту не заплатили"
text = "Корд ставит людей против тебя. «Контракт кончился, офицер. Деньги кончаются первыми»."

[gates.gt_messenger]
title = "Призрак у камней"
text = "Серый человек без лица стоит у дороги. Он знает имя брата Ильма и называет условия Курганного короля. «Это не рабство, а сделка. Договор, который переживёт Марку»."
listen = "Выслушать"
away = "Прогнать"

[gates.gt_last]
title = "Последние врата"
text = "Четвёртые врата открыты. Камни ждут: их можно запечатать или занять. Что бы ты ни выбрал, курганы это услышат."
close = "Запечатать врата: пусть мёртвые ждут"
claim = "Занять врата: пусть камни служат Марке"

