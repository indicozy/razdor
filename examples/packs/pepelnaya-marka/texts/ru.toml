description = "Каменный дворец на холме. Окна светятся без огня."

[barrows.building.ford_fort]
name = "Крепость у брода"
description = "Гарнизон Короны держит южный берег."

[barrows.building.watch_keep]
name = "Сторожевой замок"
description = "Башня над болотами. Огни на ней горят всю ночь."

[barrows.building.chapel]
name = "Часовня Ордена"
description = "Колокол звонит без ветра."

[barrows.building.marsh_village]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Тэсс знает, где её найти."

[barrows.building.camp]
name = "Лагерь вольных рот"
description = "Палатки, фургоны и бочки. Здесь торгуют всем, кроме прощения."

[barrows.army.barrow_king]
name = "Курганный король"

[barrows.army.sealed_host]
name = "Спящая дружина"

[barrows.bw_arrive]
title = "Курганы зовут"
text = "Весь край идёт к курганам. Корона и Орден за тебя? Тогда Железный мир. Роты или болото за тебя? Тогда Вольная Марка. Ильм слышал посланника мёртвых? Тогда Серая сделка на троне. Без одного из этих трёх Марка падёт. Король ждёт на севере, на ступени под дворцом. Он хочет, чтобы ты пришёл сам, и он знает, какой ценой ты пришёл."

[barrows.bw_rises]
title = "Курганный король"
text = "Из-под холма на севере встаёт дружина. Рыцари смерти идут ровным строем. Король послал их не выкупить Марку, а взять."

[barrows.bw_allies]
title = "Союзники идут"
text = "На дороге к курганам показались твои союзники. Они идут на север, к дворцу, и не оглядываются. Мёртвые тоже их видят."

[barrows.bw_curse]
title = "Проклятие"
text = "По войску проходит холодная волна. Знамёна гаснут, кони храпят. Проклятие ложится на гарнизоны и на твою дружину, и кажется, что оно не уйдёт."

[barrows.bw_remedy]
title = "Очищение"
text = "Здесь есть, чем смыть скверну. Выбирай, пока проклятие не пустило корни глубже."
rite = "Обряд Ордена (брат Ильм)"
herbs = "Травы топи"
buy = "Заплатить роте за отвар (60 монет)"
none = "Не лечиться"

[barrows.bw_fate_varga]
title = "Варга"
text = "Варга стоит на холме с алебардой. «Я дойду до дворца, — говорит она. — Или останусь здесь, если так нужно»."
walk = "Идти вместе"
leave = "Оставить её держать ворота"

[barrows.bw_fate_tess]
title = "Тэсс"
text = "Тэсс сидит на камне в топи. «Я знаю тропу через курганы, — говорит она. — Там нет мёртвых, только вода. Но назад я не пойду»."
stay = "Оставить её в отряде: +40 опыта Тэсс"
go = "Отпустить Тэсс в болото: Тэсс уходит, болотный люд +1"

[barrows.bw_fate_ilm_inq]
title = "Брат Ильм"
text = "Ильм разворачивает свиток. «Орден не простит тебе ошибку, но и мёртвых он не простит. Я даю тебе слово, а не судьбу»."
rebuke = "Одёрнуть его: пусть помнит, кто он"
pray = "Помолиться вместе: +40 опыта Ильму"

[barrows.bw_fate_ilm_heresy]
title = "Брат Ильм"
text = "Ильм смотрит на тебя без страха. «Серый человек ждёт у дворца. Ты знаешь, что он предлагает. Решай сам, а я буду свидетелем»."
hear = "Выслушать его молча"
send = "Отослать его: скверна -1"

[barrows.bw_fate_kord]
title = "Корд"
text = "Корд стоит у фургонов. «Рота хочет расчёта, офицер. Или ты отдашь, что обещал, или мы уйдём и заберём всё, что не заплачено»."
pay = "Заплатить пятьдесят монет"
shake = "Пожать руку"

[barrows.bw_throne]
title = "Трон"
text = "Дворец пуст, и трон стоит в центре зала. Холод тянется от него к плечам. Курганный король ждёт за дверью."

[barrows.bw_grey_throne]
title = "Серая сделка"
text = "Серый призрак стоит у трона и ждёт. «Преклони колено, и мёртвые опустят мечи. Марка не станет твоей, но и могилой не станет»."
kneel = "Преклонить колено перед троном"
stand = "Встать и идти в бой"

[barrows.bw_king_slain]
title = "Король мёртв"
text = "Курганный король лежит у подножия трона. Его дружина рассыпается прахом. Марка ещё дышит, и кому-то надо решить, что с ней будет."
next = "Дальше"

[barrows.bw_sum_roads]
title = "Пустые дороги"
text = "Караваны не дошли до Марки. Цена соли и хлеба выросла вдвое, и крестьяне считают, кто из купцов в этом виноват."
next = "Дальше"

[barrows.bw_sum_fire]
title = "Пепел деревень"
text = "Деревни сожжены, на полях нет ни одного дома. Крестьяне смотрят на тебя так же, как смотрели на курганы."
next = "Дальше"

[barrows.bw_council]
title = "Совет Марки"
text = "Курганы молчат. Решай, какой будет Марка: та, что держится короны и ордена, или та, что живёт ротами и болотом. Если не держится ни то ни другое, остаётся пепел."
iron = "Железный мир: Корона и Орден"
free = "Вольная Марка: роты и болотный люд"
fall = "Падение Марки"

# --- campaign ---

[campaign.end_iron]
title = "Железный мир"
text = "Марка стала тихой провинцией Короны. Орден ставит часовни на курганах, а на башнях висят синие знамёна. Марка в безопасности, но не свободна."

[campaign.end_free]
title = "Вольная Марка"
text = "Марка принадлежит ротам и болоту. Дороги открыты для тех, кто платит, и никто не спрашивает, откуда золото. Курганы ещё шевелятся, но уже не по приказу короля."

[campaign.end_grey]
title = "Серая сделка"
text = "Ты опустился на колено у трона, и мёртвые опустили мечи. Теперь твоё имя шепчут в курганах. Марка не сгорела и не свободна: она стала домом для тех, кто не умер до конца."

[campaign.end_fall]
title = "Пепел брода"
text = "Курганы пришли к броду. Ты умер у воды, и вместе с тобой пала Марка. Больше никто не назовёт её Пепельной: там ничего не осталось."

# --- named characters of the later chapters (the chapter that brings each one first) ---
[marka.named]
ilm = "Брат Ильм"

[salt.named]
tess = "Тэсс"

[camp.named]
kord = "Корд"

[siegetest.map]
title = "Проверка осады"
description = "Короткий полевой бой для скрипта осады."
won = "Мёртвые разбиты."

[siegetest.army.dead]
name = "Мёртвые"

[marka.arrival]
title = "Лекарь Короны"
text = "Ты въехал в Пепельный Брод с мечом в руке и кровью на сапогах. Лекарь Короны латает тебя у ворот и говорит без лишних слов: «Здесь три силы, и все хотят Марку. Корона сидит в этом городе, но солдат у неё мало. Орден держит аббатство и святыни. Вольные роты стоят в лагере на юго-востоке и продаются за золото. Болотный люд хочет одного: чтобы его оставили в живых. Тебе нужен союзник. Совет соберётся, когда ты поможешь хотя бы двоим»."
take = "Выпить настой"

[marka.item.crown_draught]
name = "Настой Короны"
description = "Бурый настой лекаря Короны. Затягивает самые тяжёлые раны."

[marka.item.order_balm]
name = "Бальзам Ордена"
description = "Зелёный бальзам монахов Ордена. Затягивает рану и возвращает силы."

[marka.item.marsh_herbs]
name = "Болотные травы"
description = "Горькие травы болотного люда, сушёные над дымным огнём. Останавливают кровь."

[marka.item.company_draught]
name = "Питьё рот"
description = "Крепкое питьё из лагеря рот, пьют из жестяной кружки. Залечивает рану."

# --- gates: the diary (chapter 4) ---
[quest.gates]
title = "Врата"
start = "Четыре камня стоят в Марке, и мёртвые ходят через них. Открой врата: каждый страж или обряд откроет один. Открытые камни переносят тебя от камня к камню, но каждый проход оставляет холод на плечах: скверна +1."

[quest.gate_n]
title = "Врата Ворона (север)"
text = "Стража у камня: мертвецы и призраки. Одолей их, и врата откроются."

[quest.gate_e]
title = "Врата Зари (восток)"
text = "Камень стоит в пепле. Брат Ильм знает обряд, или одолей стражу."

[quest.gate_s]
title = "Врата Камыша (юг)"
text = "Сторож берёт сто монет, или Варга держит створку алебардой, или одолей стражу."

[quest.gate_w]
title = "Врата Пепла (запад)"
text = "Знак болотного люда или тропа Тэсс. Или одолей стражу."

# --- barrows: the diary (chapter 5) ---
[quest.barrows]
title = "Курганы"
start = "Весь край идёт к курганам. Корона и Орден за тебя: Железный мир. Роты или болото за тебя: Вольная Марка. Ильм слышал посланника мёртвых: Серая сделка на троне. Без этого Марка падёт."
warn = "Страх: 3 из 5. Курганы просыпаются, и первое войско мёртвых уже в пути."

# --- marka: the diary (chapter 2) ---
[quest.find_ally]
title = "Найти союзника"
start = "Марку не удержать одной рукой. Помоги двоим из трёх сил, и совет соберётся. Корона и Орден сидят в Ашфорде и в аббатстве, роты в лагере, болото у Серых Ив. Выбирай, кому доверять."

[quest.power_crown]
title = "Корона"
text = "Капитан гарнизона в Ашфорде. Служба Короне или своя дорога."

[quest.power_order]
title = "Орден Пепла"
text = "Монах у святилища зовёт очистить алтарь. Очисти его и сними стражу."

[quest.power_marsh]
title = "Болотный люд"
text = "Тэсс просит найти логово призраков у болота и выжечь его."

[quest.power_companies]
title = "Вольные роты"
text = "Корд у лагеря продаёт свою роту за золото. Цена: сорок монет."

# --- barrows: the finale's roads, the herald and the King's words (chapter 5) ---
[barrows.bw_road_1]
title = "Телега беженцев"
text = "Телега с припасами опрокинута у дороги. Мешок с сухарями цел, а хозяева ушли в сторону холмов, оставив детские башмаки на краю колеи."
take = "Взять сухари: +15 золота"
leave = "Оставить"

[barrows.bw_road_2]
title = "Полевой госпиталь"
text = "Палатки госпиталя Короны и Ордена стоят рядом: раненые лежат на соломе, монахи держат свечи. Здесь можно перевести дух, но ни мази, ни бинтов не хватает. Мёртвые ходят ближе к палаткам каждую ночь."

[barrows.bw_road_3]
title = "Ребёнок у колеи"
text = "Девочка сидит на камне и считает камни на дороге. Она не боится тебя. «Дядя с курганов сказал, что сосчитает нас всех, — говорит она. — А я считаю быстрее»."

[barrows.bw_road_4]
title = "Брешь в стене"
text = "Стена из камня разрушена: здесь прошла когда-то армия, а теперь проход заперт костями. Место, где ты входишь в земли курганов."

[barrows.bw_road_5]
title = "Поле могил"
text = "Могилы выходят из-под травы, одна за другой. Крест на каждой нарисован кровью, а последняя могила ещё влажная."

[barrows.bw_herald]
title = "Глашатай Короля"
text = "Иссохший глашатай в ржавом плаще стоит у дороги с пергаментом. «Король предлагает тебе мир, — читает он. — Тебе, и никому больше: отдай ему меч, и мёртвые отступят от твоих земель. Твой ответ, живой»."
refuse = "Отказаться и идти дальше"
listen = "Выслушать условия: Страх +1, скверна +1"

[barrows.bw_road_6]
title = "Курган у дороги"
text = "Низкий курган, раскрытый кем-то. Внутри пусто, только шёлковые ленты, которые здесь носили в день свадьбы много веков назад."

[barrows.bw_road_7]
title = "Костёр из посохов"
text = "Костёр из посохов и обломков щитов горит без дыма. У огня сидит старик и смотрит на тебя. «Кто идёт к королю, тот не возвращается прежним, — говорит он. — Или не возвращается вовсе»."

[barrows.bw_road_8]
title = "Сторожевая башня"
text = "Старая башня Короны на холме. Флаг снят, дверь заколочена, а на стене кто-то написал: «Здесь мы держали ворота. Теперь ворота держат нас»."

[barrows.bw_road_9]
title = "Тропа на ступень"
text = "Тропа круто поднимается к дворцу. По обочинам стоят стражи в доспехах, которые ещё помнят службу. Они не поднимают мечей, но и не уходят."

[barrows.bw_king_words]
title = "Слова короля"
text = "Король поднимается со ступени: высокий, в ржавом венце, с голосом, который идёт из-под земли. «Ты не сжёг деревню под Варном. Ты отказался и потерял своё знамя. Посмотрим, что ты сожжёшь сейчас»."

# --- marka: the roads' beats (chapter 2) ---
[marka.poi_barn]
title = "Сожжённый амбар"
text = "Амбар Ордена сгорел дотла. Пепел, обгорелые колосья, а на двери прибита табличка с десятиной: монахи считали зерно Марки и жгли его, когда его не хватало."
take = "Взять несгоревшее зерно: +10 золота, Орден недоволен"
leave = "Уйти"

[marka.poi_pilgrim]
title = "Мёртвый паломник"
text = "Паломник лежит лицом в грязь, молитвенник в его руке раскрыт на псалме о мёртвых. Ни ран, ни следов. Просто встал и пошёл умирать к святилищу."
pray = "Прочесть псалом над ним: +20 опыта"
bury = "Оставить как есть"

[marka.poi_milestone]
title = "Придорожный столб"
text = "На столбе солевой дороги нацарапано: «Серые Ивы — три дня. В болоте, за Ивами, логово призраков. Кто ходит ночью к воде, не возвращается». Камень старый, а надпись свежая."

[marka.poi_horse]
title = "Умирающая лошадь"
text = "Лошадь лежит у канавы и дышит тяжело. Ни упряжи, ни хозяина. Кто-то бросил её, когда уходил к болоту."
end = "Прекратить её муки"
ride = "Ехать дальше"

[marka.poi_caravan]
title = "Старший обоза"
text = "Старший обоза слезает с телеги. «С весны на этой дороге грабят. Проводи нас до лагеря, и Корона заплатит за охрану. Или хотя бы скажи слово, что ты с нами»."
promise = "Пообещать проводить: Корона запомнит"
ride = "Ехать своей дорогой"

[marka.poi_toll]
title = "Заброшенная застава"
text = "Старый шлагбаум сломан. На столбе выжжен знак Корда: кружка и меч. Ниже кто-то дописал: «Корд берёт сорок и держит слово — пока ему платят»."
[quest.abbey_hold]
title = "Удержать аббатство"
start = "Инквизиторы придут с севера, курганы идут с востока. Держи аббатство, пока не придёт помощь."
gather = "Курганы собираются на гряде к востоку. Скоро они пойдут на аббатство."
warn = "Мёртвые идут к аббатству. Будь внутри стен, когда они придут."
siege = "Курганная дружина у южных ворот. Удержи стены."

[quest.abbey_inquisitors]
title = "Встретить инквизиторов"
text = "Инквизиторы едут с севера. Их старший требует суда над Ольховкой."

# --- gates: the framing and the roads' beats (chapter 4) ---
[gates.gt_frame]
title = "Четыре камня"
text = "Четыре стоячих камня стоят там, где мёртвые проходили в древние времена, и теперь снова проходят. Говорят, их старый путь ведёт к курганам. Корона прислала тебе четыре вопроса вместо приказа: эти врата надо открыть, запечатать или занять до того, как Страх поднимется выше. Союзники пойдут с тобой, если они у тебя есть. Дневник помнит, какой камень ждёт какого стража."
go = "Идти к камням"

[gates.gt_road1]
title = "Старые следы"
text = "Следы мертвецов ведут на северо-восток, ровные, как у марширующих. Ни одного отпечатка сапога между ними."

[gates.gt_cairn]
title = "Костяная груда"
text = "Кучка костей, сложенная у дороги, свежая. Каждую неделю рядом прибавляется одна. Кто-то считает, сколько мёртвых уже в пути."

[gates.gt_courier]
title = "Курьер Короны"
text = "Курьер Короны лежит у коня: его гнали к Вратам без передышки. Письмо в сумке: «Корона не даст людей на камни. Держи их, и Корона вспомнит»."
promise = "Пообещать держать камни: Корона запомнит"
ride = "Ехать дальше"

[gates.gt_road2]
title = "Развилка у камней"
text = "Дорога раздваивается. Одна ветка заросла ивняком и ведёт к воде, другая идёт по гребню. Ни на одной нет людей."

[gates.gt_sign]
title = "Знак на камне"
text = "На валуне выжжена стрела из тростника, болотный знак. Тропинка за ним уходит в ивняк."

[gates.gt_voice]
title = "Голос в тумане"
text = "Из тумана раздаётся голос, тихий, знакомый. Он зовёт брата Ильма по имени и обещает, что его слова дойдут до курганов."

[gates.gt_wind]
title = "Ветер в камнях"
text = "Ветер гудит в стоячих камнях, будто кто-то считает их вслух. Тишина после него тяжёлая."

[gates.gt_road3]
title = "Тропа у болота"
text = "Тропа под водой держит ровно, если идти по её белым камням. Кто-то положил эти камни здесь нарочно."

[gates.gt_road4]
title = "Пепел на тропе"
text = "Пепел лежит полосой поперёк дороги, и на нём отпечатки, которые никуда не ведут."

[gates.gt_cairn2]
title = "Кресты из ивы"
text = "Кресты из ивняка торчат у дороги. Их ставили здесь те, кто бежал от камней, и не вернулся."

[gates.gt_road5]
title = "Полынь у дороги"
text = "Полынь растёт густо, а на её верхушках дождь ещё не высох. Отряд прошёл здесь ночью."

[gates.gt_road6]
title = "Старая стоянка"
text = "Угли кострища ещё тёплые под золой. Здесь кто-то ждал, пока мертвецы пройдут мимо."

[gates.gt_road7]
title = "Сухой ров"
text = "Ров у дороги выкопан и забит крестами из ивы. Земля в нём ещё не осела, а сверху лежат свежие венки из болотной травы."

[marka.poi_bog]
title = "Потонувшая лодка"
text = "Лодка притоплена у края топи, сеть в ней ещё мокрая. Вода тянет к себе, и кажется, что под водой кто-то считает шаги."

[gates.gt_road8]
title = "Развалины часовни"
text = "Часовня у дороги разрушена, но колокол висит на верёвке. Его качает ветер, и он звенит сам по себе."

[gates.gt_road9]
title = "Брошенный обоз"
text = "Обоз брошен поперёк дороги: колёса сняты, мешки разорваны. Кто-то унёс только соль."

[barrows.bw_road_10]
title = "Знак короля"
text = "Камень у прохода выбит знаком короля: венец над курганом. Вокруг него лежат сломанные мечи, острыми концами к северу."

[barrows.bw_road_11]
title = "Тропа через поле"
text = "Тропа идёт через мокрое поле, и по обеим сторонам из земли торчат руки. Они шевелятся, когда ты проходишь мимо."

[marka.poi_ford]
title = "Указ у брода"
text = "У моста Ашфорда прибит указ Короны о мостовом сборе: десятая часть всего, что идёт через брод. Подпись стёрта дождём."

[barrows.bw_road_12]
title = "Кости у прохода"
text = "У прохода в стене сложены кости воинов, по четыре в ряд. Среди них лежит шлем с гербом Марки, и его никто не тронул."

[gates.gt_stakes]
title = "Колья с воронами"
text = "Колья вбиты в землю у дороги, на каждом по вороне. Они не улетают, когда ты подходишь, и смотрят в ту сторону, где камни."

[marka.poi_wagon]
title = "Брошенная телега"
text = "Телега стоит без лошади, колесо сломано, а в кузове лежит пустой мешок с печатью Короны. Кто-то бросил её в спешке."

[marka.poi_reeds]
title = "Тростник у тропы"
text = "Тростник примят в ряд, будто по нему прошли гуськом. Из воды торчит болотный флаг с выжженной стрелой, та же, что на камнях Врат."

[marka.poi_bridge]
title = "Шёпот на мосту"
text = "Торговцы у моста Ашфорда шепчутся: курганы шумят по ночам, соль подорожала втрое, а в лагере роты ждут денег. Никто не говорит вслух, кого из трёх сил он выберет."
[quest.abbey_alder]
title = "Ольховка"
text = "Инквизиторы хотят сжечь деревню у болота. Поезжай и реши сам."

[quest.abbey_cold]
title = "Разведать холод"
text = "Мёртвые собираются в холоде к востоку от аббатства. Загляни туда, если хватит духу."

[quest.salt_gate]
title = "Взять Соляные Ворота"
start = "Гарнизон Короны стережёт соль у восточных ворот. Болото будет доверять тому, кто их возьмёт."
delivered = "Обоз дошёл до ворот. Гарнизон получил соль и стал сильнее."

[quest.salt_wagon]
title = "Перехватить обоз"
text = "Налоговый обоз Короны идёт через гать. Перехватить: Корона −1, +30 золота. Пропустить: соль уйдёт в ворота."

[quest.salt_reedmere]
title = "Тростниковая Топь"
text = "Ведьма прислала весть через Тэсс. Найди болотный люд на сухом островке."
