# Русские тексты главы 1 «Брод». Ключи — те же, что в texts/en.toml.

[story]
title = "Пепельная Марка"
description = "Первая глава: выжженные поля, река Пепелка и три брода."

[map]
title = "Брод"
description = "Выжженные поля, река Пепелка и три брода. Один из них держат разбойники."
won = "Брод удержан. Курганы помнят, кто стоял у воды."

[item.marsh_charm]
name = "Болотный оберег"
description = "Костяная пластинка с выжженным именем. Болотный люд вешает такие на порог."

[named]
varga = "Варга"

[building.mill]
name = "Сожжённая мельница"
description = "Колесо стоит в ручье. Говорят, под мельницей лежит золото."

[building.tower]
name = "Сторожевая башня"
description = "Каменная башня над бродом. Гарнизон Короны ушёл, когда пришли мёртвые."

[building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке в болоте."

[army.toll]
name = "Разбойники у брода"

[army.wraiths]
name = "Призраки топи"

[army.barrow_host]
name = "Курганная дружина"

[arrival]
title = "Новое назначение"
text = "Тебя отправили удерживать Марку с горсткой солдат и пустой казной. Никто не спросил, хочешь ли ты. За рекой курганы больше не молчат."

[varga_meet]
title = "Алебардщица"
text = "Среди обугленных стен сидит алебардщица в рваной кирасе. Она ждёт не Орден и не мертвецов. «Корона прислала тебя, значит, долго ты не задержишься, — говорит она. — Выбирай»."
join = "Идти со мной"
refuse = "Пусть идёт своей дорогой"
burn = "Сжечь развалины: под ними золото"

[toll]
title = "Брод"
text = "У брода стоит шайка с копьями. Главарь ухмыляется: «Переправа одна, и она наша. Плати, офицер, или дерись»."
pay = "Заплатить двадцать монет"
fight = "Драться"
talk = "Говорить: пусть уходят за обещание"

[marsh_plea]
title = "Болотный люд"
text = "Старуха с мокрым подолом держит тебя за стремя. Призраки выходят из трясины каждую ночь, а её сын не вернулся с последней. «Помоги или проезжай, — говорит она. — Но запомни, кто проехал»."
help = "Помочь ей"
ride_on = "Проехать мимо"

[marsh_thanks]
title = "Благодарность топи"
text = "Болотный люд кланяется и называет имя: Тэсс, дочь ведьмы с дальнего края топи. «Она знает тропы сквозь трясину, — говорит старуха. — Придёт, когда позовёт болото»."

[host_rises]
title = "Курганы"
text = "Земля у брода гудит. Из-под обугленных полей встают мёртвые: рыцари в ржавых латах и твари, что ползают на четырёх. Они идут к броду, и их никто не ведёт."

[stones]
title = "Башня и камни"
text = "С башни видны стоячие камни на холме над курганами. Надписи на них ещё можно прочесть. Говорят, когда-то через эти камни ходили, не касаясь земли. Пока это только слова."

[omen]
title = "Новолуние"
text = "Новолуние. В камышах кто-то смеётся. Утром на пороге лежит то, что тебе оставили: дурной знак или подарок."

[end_fire]
title = "Дым над Маркой"
text = "Мёртвые легли у брода. Над сожжённой мельницей ещё стоит дым, и оставшиеся крестьяне смотрят на тебя, как смотрят на пожар. Марка жива, но твоё имя записано среди поджигателей."

[end_mercy]
title = "Брод устоял"
text = "Мёртвые легли у брода. Мельница стоит, и поле за ней зеленеет первой травой. Марка не забудет, кто её защитил, и не простит, если защитник уйдёт."

# --- abbey ---
[abbey.map]
title = "Аббатство"
description = "Разрушенное аббатство на каменном холме. С востока идут курганы, с севера инквизиция."
won = "Аббатство устояло. Орден записал твоё имя в книгу."

[abbey.building.abbey]
name = "Аббатство святого Ансельма"
description = "Стены в трещинах, колокол снят. Монахи держат ворота, пока могут."

[abbey.building.watch]
name = "Дозорная башня Короны"
description = "Гарнизон Короны не пустил сюда Орден. Теперь здесь тихо."

[abbey.building.alder]
name = "Ольховка"
description = "Деревня у болота. Ночью тут слышно, как кто-то поёт по-мёртвому."

[abbey.army.inquisitors]
name = "Инквизиция Ордена"

[abbey.army.dead_wave]
name = "Дружина курганов"

[abbey.army.unmarked]
name = "Старый караул"

[item.abbey_scripture]
name = "Книга Ильма"
description = "Устав Ордена, переписанный от руки. На полях мелким почерком записаны имена могил."

[item.abbey_water]
name = "Святая вода Ордена"
description = "Вода из колодца под аббатством. От мёртвых помогает, пока не кончится."

[abbey.arrival]
title = "Приказ Ордена"
text = "Аббатство святого Ансельма осаждено. Орден просит помощи, Корона велит не вмешиваться. Тебе велено выбрать сторону, и выбор уже не отменить. Инквизиторы выступили с севера."

[abbey.inquisitors]
title = "Инквизиторы"
text = "Инквизиторы въехали в ворота, не поднимая забрал. Старший говорит, что Орден запомнит каждого, кто стоял у стен, и каждого, кто стоял в стороне."

[abbey.ilm_meet]
title = "Послушник"
text = "У ворот сидит послушник с чужим мечом на коленях. Его зовут Ильм. Он говорит, что умеет читать могилы: «Возьми меня, и я покажу, какие из них ещё люди»."
take = "Взять в отряд"
leave = "Отослать в аббатство"

[abbey.blight]
title = "Холод"
text = "Трава тут серая и хрустит под копытами. Солдаты мёрзнут даже в латах. Дальше идти значит ехать под проклятием."

[abbey.walls]
title = "Проклятие на стенах"
text = "Мертвецы дошли до стен. Там, где они ударили, камень почернел, а монахи падают на молитве. Гарнизон аббатства проклят."

[abbey.siege]
title = "Курганы идут"
text = "Дружина курганов поднимается по склону и не останавливается. Они идут на аббатство, и никто не ведёт их, кроме старого приказа."

[abbey.trial]
title = "Ольховка"
text = "В деревне все здоровы и все шепчутся. Ильм смотрит на дома: «Здесь скверна. Орден велит сжигать. Или пощадить, если ты уверен»."
burn = "Сжечь деревню: так велит Орден"
spare = "Пощадить людей: пусть уходят"
ride = "Проехать мимо, не вмешиваясь"

[abbey.heresy]
title = "Шёпот Ильма"
text = "Ночью Ильм приходит один. «Орден сжигает, потому что боится. Есть и другой путь: принять то, что приходит от мёртвых, и не сгореть. Хочешь знать как?»"
accept = "Выслушать и принять дар"
refuse = "Отказаться и уйти"

[abbey.rite]
title = "Обряд очищения"
text = "Монахи готовы снять проклятие. Обряд стоит денег: свечи, святая вода, молитва на всю ночь."
rite = "Пройти обряд (30 монет)"
decline = "Не нужно, справлюсь сам"

[abbey.inquisition]
title = "Приговор"
text = "Инквизиторы опускают знамёна. «Ты осквернён, и ты пришёл сюда, — говорит старший. — Тогда закончим здесь». Они бросаются в бой."

[abbey.end_inquisitor]
title = "Огонь и порядок"
text = "Мертвецы легли у стен аббатства. Ильм стоит над сожжённой Ольховкой и не отводит глаз. Орден записывает: «Очищено». Марка запомнит костры."

[abbey.end_heretic]
title = "Серый свет"
text = "Мертвецы легли у стен, но Ильм смотрит не на них, а на тебя. Орден не простит ереси, но сейчас он нуждается в тебе, и Ильм это знает."

[abbey.end_plain]
title = "Аббатство устояло"
text = "Курганная дружина легла у стен. Монахи поют над мёртвыми, а ты выходишь из ворот без спутника и без обещаний. Марка знает теперь, что ты пришёл."

# --- salt ---
[salt.map]
title = "Солончаки"
description = "Болото с белой солью, гать через топь и Соляные Ворота Короны на востоке."
won = "Соляные Ворота взяты. Марка помнит, кто открыл дорогу."

[salt.building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Здесь знают тропы сквозь трясину."

[salt.building.witch]
name = "Хижина ведьмы"
description = "Пучки трав над дверью и кости на верёвке. Мать Тэсс не спрашивает, зачем пришли."

[salt.building.saltgate]
name = "Соляные Ворота"
description = "Гарнизон Короны стережёт соль. Через эти ворота идёт всё, что продают в Марке."

[salt.building.watch]
name = "Сторожевой пост"
description = "Два десятка копий и сухой колодец на северном конце гати."

[salt.building.den]
name = "Разбойничье логово"
description = "Старые сваи и костёр, который горит всю зиму."

[salt.army.smugglers]
name = "Соляной обоз"

[salt.army.patrol_north]
name = "Патруль Короны"

[salt.army.bounty]
name = "Охотники за головами"

[salt.army.bog_ghosts]
name = "Призраки трясины"

[salt.army.unmarked]
name = "Старый дозор"

[item.salt_bow]
name = "Лук Тэсс"
description = "Охотничий лук из тиса. Тэсс вырезала на нём метку своей тропы."

[item.salt_salve]
name = "Болотная мазь"
description = "Густая мазь из трав болотного люда. Пахнет дымом и хмелем."

[salt.arrival]
title = "Солончаки"
text = "Гать через топь ведёт к Соляным Воротам. Корона платит за соль, а Марка платит за Корону. Обоз уже вышел из болота. Если он доберётся до ворот, Корона будет сыта, а Марка голодна."

[salt.reedmere]
title = "Тростниковая Топь"
text = "Болотный люд встречает тебя копьями, но не стреляет. Впереди стоит Тэсс, дочь ведьмы. «Корона ищет тебя на дорогах, — говорит она. — Поедешь как разбойник, никто не тронет. Или поедешь как офицер, и тогда поглядим»."
disguise = "Переодеться в разбойника"
openly = "Ехать открыто"

[salt.caught]
title = "Ворота"
text = "У ворот тебя узнали. Стражник опускает копьё: «Разбойник с офицерской выправкой. Ждите, пока придут люди»."
draw = "Обнажить клинок"

[salt.witch]
title = "Хижина ведьмы"
text = "Мать Тэсс смотрит на твой отряд, потом на то, что в нём сидит. «Проклятие липнет к тебе, как болотная грязь. Я сниму его, если заплатишь травами или золотом. А если в твоей книге есть страница Ордена, сожгу её при тебе»."
cure = "Снять проклятие"
blessing = "Заказать благословение (20 монет)"
page = "Сжечь страницу из книги"

[salt.bog]
title = "Трясина"
text = "Туман стелется по воде. Призраки смотрят пустыми глазами, и на коже остаётся холод. Это только начало."

[salt.tess]
title = "Тэсс"
text = "Тэсс опускает глаза. «Мать говорит, что я знаю тропы, но не дорогу назад. Если поеду с тобой, будь честен с болотом». Она протягивает руку."
take = "Взять Тэсс в отряд"
leave = "Не сейчас"

[salt.trail]
title = "Тропа"
text = "Тэсс ведёт отряд через трясину по тропе, которой нет на карте. Вода держит, пока идёт она. Через час вы выходите к восточным холмам, на белую соль."

[salt.end_marsh]
title = "Соль и болото"
text = "Ворота открыты. Тэсс первой входит в соляной склад, и болотный люд приходит за своей долей. Марка знает теперь, что соль принадлежит тем, кто её добывает."

[salt.end_alone]
title = "Соляные Ворота"
text = "Ворота взяты, и стража уходит на юг. Болотный люд смотрит издали и не решается подойти. Ты один в городе, который держал Корону. Удержишь ли его?"

# --- camp ---
[camp.map]
title = "Лагерь рот"
description = "Лагерь вольных рот в низине посреди Марки. Дорога Короны идёт мимо, и ей нужна охрана."
won = "Лагерь рот держится. Роты помнят, кто пришёл к ним первым."

[camp.building.waygate]
name = "Камни лагеря"
description = "Стоячий камень у костра роты. Старые рунические метки ещё можно прочесть."

[camp.building.hall]
name = "Трактир «Пустая кружка»"
description = "Здесь роты пьют, играют в кости и решают, кому служить."

[camp.building.oakford]
name = "Окфорд"
description = "Торговый город на дороге. Гарнизон Короны держит ворота, но стены низкие."

[camp.army.kord_band]
name = "Рота Корда"

[camp.army.red_company]
name = "Красные плащи"

[camp.army.supply]
name = "Обоз Короны"

[camp.army.duel_captain]
name = "Гвардия капитана"

[camp.army.unmarked]
name = "Старый дозор"

[camp.captain]
name = "Капитан гвардии Короны"

[item.camp_axe]
name = "Секира капитана"
description = "Тяжёлая секира гвардии Короны. Варга сказала, что возьмёт её, если выиграет."

[camp.arrival]
title = "Роты"
text = "Вольные роты стоят в низине, между Короной и курганами. Они не ждут тебя и не любят Корону. Говорят, что здесь каждый продаётся, а кто не продаётся, тот уже мёртв. У дороги стоит обоз, идущий в Короне."

[camp.kord]
title = "Корд"
text = "Капитан роты в кожаном плаще поднимает кружку. «Я Корд. Мои люди идут за тем, кто платит, и держат слово, пока платят. Шестьдесят монет — и мы с тобой. Или уходи»."
hire = "Нанять роту (60 монет)"
turn = "Отказаться"

[camp.red]
title = "Красные плащи"
text = "Вторая рота, в выцветших красных плащах, ставит палатки у края лагеря. Их капитан говорит, что служит тому, кто платит больше всех, и не верит в Корону."
buy = "Купить роту (100 монет)"
leave = "Не сейчас"

[camp.duel]
title = "Вызов"
text = "Капитан гвардии Короны стоит в арене и смотрит на твою алебардщицу. «Варга, — говорит он. — Говорят, ты трусиха, которая продала Корону за кусок хлеба. Выйди, если не боишься»."
accept = "Пусть Варга выйдет на поединок"
refuse = "Не давать ей драться"

[camp.duel_won]
title = "Поединок"
text = "Капитан лежит в арене. Варга стоит над ним, опустив алебарду, и вытирает лицо. Она берёт его секиру и не благодарит никого."

[camp.duel_lost]
title = "Варга"
text = "Арена пуста. Варги нет в строю: её унесли или она сама упала и не встала. Роты молчат, и никто не говорит её имени."

[camp.raid]
title = "Обоз Короны"
text = "Обоз Короны идёт по дороге с мешками зерна и бочками соли. Охрана в пыли и не ждёт засады. Можно ударить из-за камней или пропустить."
hit = "Ударить роты из лагеря"
pass = "Пропустить обоз"

[camp.loot]
title = "Добыча"
text = "Корд делит добычу. «Моим людям положена доля, — говорит он. — Раздели честно, и мы будем братьями. Оставь себе всё, и я вспомню это»."
split = "Раздать поровну"
keep = "Оставить добычу себе"

[camp.gate]
title = "Стоячий камень"
text = "У камня старый караульный показывает на метки. «Ночью он светится, если зажечь огонь с четырёх сторон. Так говорят. Попробовать?»"
light = "Зажечь огонь"
leave = "Оставить камень в темноте"

[camp.relief]
title = "Подмога Короны"
text = "С северо-востока идут гвардейцы Короны. Их знамя ещё новое, и они идут к лагерю, как на парад."

[camp.trust]
title = "Капитан роты"
text = "Роты собираются у костра и поднимают кружки. Твоё имя слышат все. Золото идёт по рукам, и никто не спрашивает, откуда оно."

[camp.end_friend]
title = "Вольная рота"
text = "Гвардия Короны легла у лагеря. Корд сидит рядом и смотрит на огонь. «Ты держал слово, и мы держим твоё. Пусть Корона ищет другого»."

[camp.end_hired]
title = "Наёмник"
text = "Гвардия Короны легла у лагеря. Корд получает плату и уходит к следующему нанимателю. Ты больше не в долгу перед ним, и он больше не в долгу перед тобой."

[camp.end_betrayed]
title = "Предательство"
text = "Гвардия Короны легла у лагеря, но рота Корда ушла в степь с добычей. Корд обещал вернуться, и роты помнят, кто первым отказался делиться."

[camp.end_alone]
title = "Лагерь рот"
text = "Гвардия Короны легла у лагеря. Роты поднимают кружки за тех, кто пришёл. Без Корда и без Варги ты остался один с ними, и никто не знает, с кем ты пойдёшь дальше."
