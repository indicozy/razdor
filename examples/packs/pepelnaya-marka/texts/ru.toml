# Русские тексты главы 1 «Брод». Ключи — те же, что в texts/en.toml.

[story]
title = "Пепельная Марка"
description = "Первая глава: выжженные поля, река Пепелка и три брода."

[map]
title = "Брод"
description = "Выжженные поля, река Пепелка и три брода. Один из них держат разбойники."
won = "Брод удержан. Курганы помнят, кто стоял у воды."

[item.marsh_charm]
name = "Болотный оберег"
description = "Костяная пластинка с выжженным именем. Болотный люд вешает такие на порог."

[named]
varga = "Варга"

[building.mill]
name = "Сожжённая мельница"
description = "Колесо стоит в ручье. Говорят, под мельницей лежит золото."

[building.tower]
name = "Сторожевая башня"
description = "Каменная башня над бродом. Гарнизон Короны ушёл, когда пришли мёртвые."

[building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке в болоте."

[army.toll]
name = "Разбойники у брода"

[army.wraiths]
name = "Призраки топи"

[army.barrow_host]
name = "Курганная дружина"

[arrival]
title = "Новое назначение"
text = "Тебя отправили удерживать Марку с горсткой солдат и пустой казной. Никто не спросил, хочешь ли ты. За рекой курганы больше не молчат."

[varga_meet]
title = "Алебардщица"
text = "Среди обугленных стен сидит алебардщица в рваной кирасе. Она ждёт не Орден и не мертвецов. «Корона прислала тебя, значит, долго ты не задержишься, — говорит она. — Выбирай»."
join = "Идти со мной"
refuse = "Пусть идёт своей дорогой"
burn = "Сжечь развалины: под ними золото"

[toll]
title = "Брод"
text = "У брода стоит шайка с копьями. Главарь ухмыляется: «Переправа одна, и она наша. Плати, офицер, или дерись»."
pay = "Заплатить двадцать монет"
fight = "Драться"
talk = "Говорить: пусть уходят за обещание"

[marsh_plea]
title = "Болотный люд"
text = "Старуха с мокрым подолом держит тебя за стремя. Призраки выходят из трясины каждую ночь, а её сын не вернулся с последней. «Помоги или проезжай, — говорит она. — Но запомни, кто проехал»."
help = "Помочь ей"
ride_on = "Проехать мимо"

[marsh_thanks]
title = "Благодарность топи"
text = "Болотный люд кланяется и называет имя: Тэсс, дочь ведьмы с дальнего края топи. «Она знает тропы сквозь трясину, — говорит старуха. — Придёт, когда позовёт болото»."

[host_rises]
title = "Курганы"
text = "Земля у брода гудит. Из-под обугленных полей встают мёртвые: рыцари в ржавых латах и твари, что ползают на четырёх. Они идут к броду, и их никто не ведёт."

[stones]
title = "Башня и камни"
text = "С башни видны стоячие камни на холме над курганами. Надписи на них ещё можно прочесть. Говорят, когда-то через эти камни ходили, не касаясь земли. Пока это только слова."

[omen]
title = "Новолуние"
text = "Новолуние. В камышах кто-то смеётся. Утром на пороге лежит то, что тебе оставили: дурной знак или подарок."

[end_fire]
title = "Дым над Маркой"
text = "Мёртвые легли у брода. Над сожжённой мельницей ещё стоит дым, и оставшиеся крестьяне смотрят на тебя, как смотрят на пожар. Марка жива, но твоё имя записано среди поджигателей."

[end_mercy]
title = "Брод устоял"
text = "Мёртвые легли у брода. Мельница стоит, и поле за ней зеленеет первой травой. Марка не забудет, кто её защитил, и не простит, если защитник уйдёт."
