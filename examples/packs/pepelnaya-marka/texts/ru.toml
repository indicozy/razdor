# Русские тексты главы 1 «Брод». Ключи — те же, что в texts/en.toml.

[story]
title = "Пепельная Марка"
description = "Первая глава: выжженные поля, река Пепелка и три брода."

[map]
title = "Брод"
description = "Выжженные поля, река Пепелка и три брода. Один из них держат разбойники."
won = "Брод удержан. Курганы помнят, кто стоял у воды."

[item.marsh_charm]
name = "Болотный оберег"
description = "Костяная пластинка с выжженным именем. Болотный люд вешает такие на порог."

[named]
varga = "Варга"

[building.mill]
name = "Сожжённая мельница"
description = "Колесо стоит в ручье. Говорят, под мельницей лежит золото."

[building.tower]
name = "Сторожевая башня"
description = "Каменная башня над бродом. Гарнизон Короны ушёл, когда пришли мёртвые."

[building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке в болоте."

[army.toll]
name = "Разбойники у брода"

[army.wraiths]
name = "Призраки топи"

[army.barrow_host]
name = "Курганная дружина"

[arrival]
title = "Новое назначение"
text = "Тебя отправили удерживать Марку с горсткой солдат и пустой казной. Никто не спросил, хочешь ли ты. За рекой курганы больше не молчат."

[varga_meet]
title = "Алебардщица"
text = "Среди обугленных стен сидит алебардщица в рваной кирасе. Она ждёт не Орден и не мертвецов. «Корона прислала тебя, значит, долго ты не задержишься, — говорит она. — Выбирай»."
join = "Идти со мной"
refuse = "Пусть идёт своей дорогой"
burn = "Сжечь развалины: под ними золото"

[toll]
title = "Брод"
text = "У брода стоит шайка с копьями. Главарь ухмыляется: «Переправа одна, и она наша. Плати, офицер, или дерись»."
pay = "Заплатить двадцать монет"
fight = "Драться"
talk = "Говорить: пусть уходят за обещание"

[marsh_plea]
title = "Болотный люд"
text = "Старуха с мокрым подолом держит тебя за стремя. Призраки выходят из трясины каждую ночь, а её сын не вернулся с последней. «Помоги или проезжай, — говорит она. — Но запомни, кто проехал»."
help = "Помочь ей"
ride_on = "Проехать мимо"

[marsh_thanks]
title = "Благодарность топи"
text = "Болотный люд кланяется и называет имя: Тэсс, дочь ведьмы с дальнего края топи. «Она знает тропы сквозь трясину, — говорит старуха. — Придёт, когда позовёт болото»."

[host_rises]
title = "Курганы"
text = "Земля у брода гудит. Из-под обугленных полей встают мёртвые: рыцари в ржавых латах и твари, что ползают на четырёх. Они идут к броду, и их никто не ведёт."

[stones]
title = "Башня и камни"
text = "С башни видны стоячие камни на холме над курганами. Надписи на них ещё можно прочесть. Говорят, когда-то через эти камни ходили, не касаясь земли. Пока это только слова."

[omen]
title = "Новолуние"
text = "Новолуние. В камышах кто-то смеётся. Утром на пороге лежит то, что тебе оставили: дурной знак или подарок."

[end_fire]
title = "Дым над Маркой"
text = "Мёртвые легли у брода. Над сожжённой мельницей ещё стоит дым, и оставшиеся крестьяне смотрят на тебя, как смотрят на пожар. Марка жива, но твоё имя записано среди поджигателей."

[end_mercy]
title = "Брод устоял"
text = "Мёртвые легли у брода. Мельница стоит, и поле за ней зеленеет первой травой. Марка не забудет, кто её защитил, и не простит, если защитник уйдёт."

# --- marka ---
[marka.map]
title = "Марка"
description = "Река Пепелка, три брода. Аббатство на северо-западе, солончаки на юго-западе, лагерь рот на юго-востоке, курганы на северо-востоке."
won = "Марка выбрала сторону. Дороги ведут дальше."

[marka.building.ashford]
name = "Пепельный Брод"
description = "Рыночный городок у среднего брода. Гарнизон Короны ещё держит ворота, но капитан смотрит на тебя без доверия."

[marka.building.millspring]
name = "Мельничный Ключ"
description = "Деревня к северу от Брода. Колесо мельницы ещё крутится, но ворота заперты."

[marka.building.greyreed]
name = "Серые Ивы"
description = "Деревня на сухом островке в солончаках. Здесь живёт болотный люд."

[marka.building.abbey]
name = "Разрушенное аббатство"
description = "Стены аббатства черны от огня. Орден держит колокольню и требует, чтобы его не трогали."

[marka.building.shrine]
name = "Святилище Пепла"
description = "Алтарь у старой дороги. От него тянет сырой землёй и чем-то сладким."

[marka.building.barrow]
name = "Курганы"
description = "Холмы над стоячими камнями. Земля здесь тёплая и гудит."

[marka.building.camp]
name = "Лагерь рот"
description = "Частокол, костры и знамя без герба. Здесь торгуют тем, что можно продать."

[marka.army.caravan]
name = "Обоз Короны"

[marka.army.patrol_w]
name = "Патруль Короны (запад)"

[marka.army.patrol_n]
name = "Патруль Короны (север)"

[marka.army.raiders]
name = "Разбойники на дороге"

[marka.army.kord_band]
name = "Рота Корда"

[marka.army.wraiths]
name = "Призраки топи"

[marka.unit.ash_knight]
name = "Пепельный рыцарь"
description = "Рыцарь, поднятый из кургана. Доспех прожжён насквозь."

[marka.item.ash_seal]
name = "Печать Пепла"
description = "Медная печать Ордена с выжженным кругом. Открывает стоячие врата, если помнишь, как."

[marka.item.company_token]
name = "Знак роты"
description = "Жетон Вольных рот. В любой лагерь пускают без вопросов."

[marka.captain]
title = "Капитан гарнизона"
text = "Капитан не встаёт из-за стола. «Ты тот, кого прислали без войска и без денег. Короне нужны офицеры, а не ссыльные. Что скажешь?»"
serve = "Служу Короне"
alone = "Я сам по себе"
gold = "Просить золото на гарнизон"

[marka.shrine_offer]
title = "Святилище"
text = "Монах Ордена ждёт у старой дороги. «Алтарь осквернён: по ночам из него сочится тьма. Очисти его, и Орден запомнит». Внутри, говорят, стоят мертвецы."
accept = "Очищу"
refuse = "Не моё дело"

[marka.shrine_inside]
title = "Внутри святилища"
text = "Алтарь треснул, на нём лежит ржавый обруч с чужими рунами. Послушник в рясе, брат Ильм, молится и не смотрит на тебя. «Очистить по обряду, — говорит он, — или взять чёрную силу, пока её не взяли мертвецы?»"
cleanse = "Очистить по обряду (Орден)"
take = "Взять силу проклятия (ересь)"

[marka.ritual_offer]
title = "Врата"
text = "Стоячий камень звенит под рукой. Брат Ильм ждёт у подножия: «Печать Пепла откроет врата. Одна дорога, одна ночь, и войско мертвецов потеряет путь к броду»."
open = "Открыть врата печатью"
walk = "Не сейчас"

[marka.marsh_offer]
title = "Болотный люд"
text = "Тэсс, охотница с дальнего края топи, стоит у ворот Серых Ив. «Призраки выходят из-под воды. Найди их логово и выжги его. Тогда я пойду с тобой»."
accept = "Пойду в топь"
later = "Потом"

[marka.tess_join]
title = "Тэсс"
text = "Призраки рассыпались туманом. Тэсс обтирает нож о траву: «Долг заплачен. Иду с тобой, пока не скажу иначе»."

[marka.kord_offer]
title = "Корд"
text = "Корд, капитан Вольных рот, сидит на бочке с элем. «Моя рота стоит дёшево, но бьётся дорого. Сорок монет, и она твоя. Или ты предпочтёшь выдать меня Короне за награду?»"
hire = "Нанять роту: сорок монет"
betray = "Выдать Корда Короне"
walk = "Уйти"

[marka.council]
title = "Совет Марки"
text = "Два дела из трёх сделаны. Марка ждёт, кому ты присягнёшь. Выбирать можно только тех, кто тебе доверяет."
order = "Орден Пепла"
marsh = "Болотный люд"
companies = "Вольные роты"
later = "Ещё не время"

[marka.raid_warning]
title = "Разбойники"
text = "Из Пепельного Брода вышел обоз с солью и мукой. Кто-то из разбойников знает его путь. За обозом пошли трое с копьями."

[marka.caravan_lost]
title = "Обоз пропал"
text = "Обоз не дошёл до лагеря. Пустую телегу нашли у дороги, возчиков не нашли. Цены на соль и муку в Пепельном Броде выросли за ночь."

[marka.caravan_safe]
title = "Обоз дошёл"
text = "Обоз дошёл до лагеря Вольных рот. Казна Короны заплатила проводникам, и тебе отсыпали свою долю."

[marka.mill_fell]
title = "Мельничный Ключ пал"
text = "Курганные дружинники вошли в деревню на рассвете. Мельница горит, колокол молчит: звонарь ушёл к мёртвым. Страх в Марке растёт."

[marka.marsh_fell]
title = "Серые Ивы пали"
text = "Солончаки вспыхнули ночью. Серые Ивы сгорели дотла, болотный люд ушёл за трясину. Тэсс не пришла на сбор."

[marka.host_stir]
title = "Курганы открываются"
text = "Холмы на северо-востоке шевелятся. Из-под земли встают рыцари в ржавых латах и твари на четырёх лапах. Они идут к деревне, и никто их не ведёт."

[marka.siege]
title = "Осада"
text = "Мёртвые стоят у околицы. Жители заперлись в домах, по крышам ходят тени. Ещё одна ночь, и деревни не будет."

[marka.host_beaten]
title = "Дружина легла"
text = "Рыцари легли у околицы и больше не встали. Крестьяне выходят из домов и благодарят. Корона заплатила за отчёт."

[marka.ilm_abbey]
title = "Аббатство"
text = "Брат Ильм ходит среди обломков, касаясь стен. «Здесь был архив, — шепчет он. — Наверное, в нём записано, как закрыть врата»."

[marka.sign_plague]
title = "Мор"
text = "Новолуние. У колодцев лежат птицы с раскрытыми клювами. Люди говорят, что это дыхание курганов."

[marka.sign_deserters]
title = "Дезертиры"
text = "У старого тракта появилась шайка дезертиров. Они бежали от Короны, и теперь их ведёт тот, кто платит. Торговцы обходят их стороной."

[marka.sign_merchant]
title = "Купеческий князь"
text = "Купец в шёлковом плаще проехал через Марку ночью и оставил кошель у порога: «За то, что держишь дорогу открытой»."

[marka.taint_week]
title = "Скверна"
text = "Проклятие в крови не спит. Ночью тебе слышится колокольный звон из-под земли, и Страх растёт вместе с ним."

[marka.revisit_abbey]
title = "Знамя Ордена"
text = "Над аббатством подняли чёрно-белое знамя. Орден прислал в Брод своего священника, и гарнизон уступил ему ворота. Капитан молчит."

[marka.revisit_salt]
title = "Серые Ивы возвращены"
text = "Болотный люд вернулся в деревню и принёс рыбу и соль. Дома отстроены, ворота открыты. Серые Ивы теперь твои, и люди просят об одном: не продавай их."

[marka.revisit_camp]
title = "Лагерь разросся"
text = "Вольные роты привели в лагерь ещё людей и оружия. Частокол выше, костров больше. Здесь ждут твоего слова."

[marka.stones_note]
title = "Надпись на камне"
text = "Стоячий камень исписан древним письмом. Брат Ильм читает вслух: «Кто ходит по камню, тот не касается земли». Больше камень ничего не говорит."
# --- abbey ---
[abbey.map]
title = "Аббатство"
description = "Разрушенное аббатство на каменном холме. С востока идут курганы, с севера инквизиция."
won = "Аббатство устояло. Орден записал твоё имя в книгу."

[abbey.building.abbey]
name = "Аббатство святого Ансельма"
description = "Стены в трещинах, колокол снят. Монахи держат ворота, пока могут."

[abbey.building.watch]
name = "Дозорная башня Короны"
description = "Гарнизон Короны не пустил сюда Орден. Теперь здесь тихо."

[abbey.building.alder]
name = "Ольховка"
description = "Деревня у болота. Ночью тут слышно, как кто-то поёт по-мёртвому."

[abbey.army.inquisitors]
name = "Инквизиция Ордена"

[abbey.army.dead_wave]
name = "Дружина курганов"

[abbey.army.unmarked]
name = "Старый караул"

[item.abbey_scripture]
name = "Книга Ильма"
description = "Устав Ордена, переписанный от руки. На полях мелким почерком записаны имена могил."

[item.abbey_water]
name = "Святая вода Ордена"
description = "Вода из колодца под аббатством. От мёртвых помогает, пока не кончится."

[abbey.arrival]
title = "Приказ Ордена"
text = "Аббатство святого Ансельма осаждено. Орден просит помощи, Корона велит не вмешиваться. Тебе велено выбрать сторону, и выбор уже не отменить. Инквизиторы выступили с севера."

[abbey.inquisitors]
title = "Инквизиторы"
text = "Инквизиторы въехали в ворота, не поднимая забрал. Старший говорит, что Орден запомнит каждого, кто стоял у стен, и каждого, кто стоял в стороне."

[abbey.ilm_meet]
title = "Послушник"
text = "У ворот сидит послушник с чужим мечом на коленях. Его зовут Ильм. Он говорит, что умеет читать могилы: «Возьми меня, и я покажу, какие из них ещё люди»."
take = "Взять в отряд"
leave = "Отослать в аббатство"

[abbey.blight]
title = "Холод"
text = "Трава тут серая и хрустит под копытами. Солдаты мёрзнут даже в латах. Дальше идти значит ехать под проклятием."

[abbey.walls]
title = "Проклятие на стенах"
text = "Мертвецы дошли до стен. Там, где они ударили, камень почернел, а монахи падают на молитве. Гарнизон аббатства проклят."

[abbey.siege]
title = "Курганы идут"
text = "Дружина курганов поднимается по склону и не останавливается. Они идут на аббатство, и никто не ведёт их, кроме старого приказа."

[abbey.trial]
title = "Ольховка"
text = "В деревне все здоровы и все шепчутся. Ильм смотрит на дома: «Здесь скверна. Орден велит сжигать. Или пощадить, если ты уверен»."
burn = "Сжечь деревню: так велит Орден"
spare = "Пощадить людей: пусть уходят"
ride = "Проехать мимо, не вмешиваясь"

[abbey.heresy]
title = "Шёпот Ильма"
text = "Ночью Ильм приходит один. «Орден сжигает, потому что боится. Есть и другой путь: принять то, что приходит от мёртвых, и не сгореть. Хочешь знать как?»"
accept = "Выслушать и принять дар"
refuse = "Отказаться и уйти"

[abbey.rite]
title = "Обряд очищения"
text = "Монахи готовы снять проклятие. Обряд стоит денег: свечи, святая вода, молитва на всю ночь."
rite = "Пройти обряд (30 монет)"
decline = "Не нужно, справлюсь сам"

[abbey.inquisition]
title = "Приговор"
text = "Инквизиторы опускают знамёна. «Ты осквернён, и ты пришёл сюда, — говорит старший. — Тогда закончим здесь». Они бросаются в бой."

[abbey.end_inquisitor]
title = "Огонь и порядок"
text = "Мертвецы легли у стен аббатства. Ильм стоит над сожжённой Ольховкой и не отводит глаз. Орден записывает: «Очищено». Марка запомнит костры."

[abbey.end_heretic]
title = "Серый свет"
text = "Мертвецы легли у стен, но Ильм смотрит не на них, а на тебя. Орден не простит ереси, но сейчас он нуждается в тебе, и Ильм это знает."

[abbey.end_plain]
title = "Аббатство устояло"
text = "Курганная дружина легла у стен. Монахи поют над мёртвыми, а ты выходишь из ворот без спутника и без обещаний. Марка знает теперь, что ты пришёл."

# --- salt ---
[salt.map]
title = "Солончаки"
description = "Болото с белой солью, гать через топь и Соляные Ворота Короны на востоке."
won = "Соляные Ворота взяты. Марка помнит, кто открыл дорогу."

[salt.building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Здесь знают тропы сквозь трясину."

[salt.building.witch]
name = "Хижина ведьмы"
description = "Пучки трав над дверью и кости на верёвке. Мать Тэсс не спрашивает, зачем пришли."

[salt.building.saltgate]
name = "Соляные Ворота"
description = "Гарнизон Короны стережёт соль. Через эти ворота идёт всё, что продают в Марке."

[salt.building.watch]
name = "Сторожевой пост"
description = "Два десятка копий и сухой колодец на северном конце гати."

[salt.building.den]
name = "Разбойничье логово"
description = "Старые сваи и костёр, который горит всю зиму."

[salt.army.smugglers]
name = "Соляной обоз"

[salt.army.patrol_north]
name = "Патруль Короны"

[salt.army.bounty]
name = "Охотники за головами"

[salt.army.bog_ghosts]
name = "Призраки трясины"

[salt.army.unmarked]
name = "Старый дозор"

[item.salt_bow]
name = "Лук Тэсс"
description = "Охотничий лук из тиса. Тэсс вырезала на нём метку своей тропы."

[item.salt_salve]
name = "Болотная мазь"
description = "Густая мазь из трав болотного люда. Пахнет дымом и хмелем."

[salt.arrival]
title = "Солончаки"
text = "Гать через топь ведёт к Соляным Воротам. Корона платит за соль, а Марка платит за Корону. Обоз уже вышел из болота. Если он доберётся до ворот, Корона будет сыта, а Марка голодна."

[salt.reedmere]
title = "Тростниковая Топь"
text = "Болотный люд встречает тебя копьями, но не стреляет. Впереди стоит Тэсс, дочь ведьмы. «Корона ищет тебя на дорогах, — говорит она. — Поедешь как разбойник, никто не тронет. Или поедешь как офицер, и тогда поглядим»."
disguise = "Переодеться в разбойника"
openly = "Ехать открыто"

[salt.caught]
title = "Ворота"
text = "У ворот тебя узнали. Стражник опускает копьё: «Разбойник с офицерской выправкой. Ждите, пока придут люди»."
draw = "Обнажить клинок"

[salt.witch]
title = "Хижина ведьмы"
text = "Мать Тэсс смотрит на твой отряд, потом на то, что в нём сидит. «Проклятие липнет к тебе, как болотная грязь. Я сниму его, если заплатишь травами или золотом. А если в твоей книге есть страница Ордена, сожгу её при тебе»."
cure = "Снять проклятие"
blessing = "Заказать благословение (20 монет)"
page = "Сжечь страницу из книги"

[salt.bog]
title = "Трясина"
text = "Туман стелется по воде. Призраки смотрят пустыми глазами, и на коже остаётся холод. Это только начало."

[salt.tess]
title = "Тэсс"
text = "Тэсс опускает глаза. «Мать говорит, что я знаю тропы, но не дорогу назад. Если поеду с тобой, будь честен с болотом». Она протягивает руку."
take = "Взять Тэсс в отряд"
leave = "Не сейчас"

[salt.trail]
title = "Тропа"
text = "Тэсс ведёт отряд через трясину по тропе, которой нет на карте. Вода держит, пока идёт она. Через час вы выходите к восточным холмам, на белую соль."

[salt.end_marsh]
title = "Соль и болото"
text = "Ворота открыты. Тэсс первой входит в соляной склад, и болотный люд приходит за своей долей. Марка знает теперь, что соль принадлежит тем, кто её добывает."

[salt.end_alone]
title = "Соляные Ворота"
text = "Ворота взяты, и стража уходит на юг. Болотный люд смотрит издали и не решается подойти. Ты один в городе, который держал Корону. Удержишь ли его?"

# --- camp ---
[camp.map]
title = "Лагерь рот"
description = "Лагерь вольных рот в низине посреди Марки. Дорога Короны идёт мимо, и ей нужна охрана."
won = "Лагерь рот держится. Роты помнят, кто пришёл к ним первым."

[camp.building.waygate]
name = "Камни лагеря"
description = "Стоячий камень у костра роты. Старые рунические метки ещё можно прочесть."

[camp.building.hall]
name = "Трактир «Пустая кружка»"
description = "Здесь роты пьют, играют в кости и решают, кому служить."

[camp.building.oakford]
name = "Окфорд"
description = "Торговый город на дороге. Гарнизон Короны держит ворота, но стены низкие."

[camp.army.kord_band]
name = "Рота Корда"

[camp.army.red_company]
name = "Красные плащи"

[camp.army.supply]
name = "Обоз Короны"

[camp.army.duel_captain]
name = "Гвардия капитана"

[camp.army.unmarked]
name = "Старый дозор"

[camp.captain]
name = "Капитан гвардии Короны"

[item.camp_axe]
name = "Секира капитана"
description = "Тяжёлая секира гвардии Короны. Варга сказала, что возьмёт её, если выиграет."

[camp.arrival]
title = "Роты"
text = "Вольные роты стоят в низине, между Короной и курганами. Они не ждут тебя и не любят Корону. Говорят, что здесь каждый продаётся, а кто не продаётся, тот уже мёртв. У дороги стоит обоз, идущий в Короне."

[camp.kord]
title = "Корд"
text = "Капитан роты в кожаном плаще поднимает кружку. «Я Корд. Мои люди идут за тем, кто платит, и держат слово, пока платят. Шестьдесят монет — и мы с тобой. Или уходи»."
hire = "Нанять роту (60 монет)"
turn = "Отказаться"

[camp.red]
title = "Красные плащи"
text = "Вторая рота, в выцветших красных плащах, ставит палатки у края лагеря. Их капитан говорит, что служит тому, кто платит больше всех, и не верит в Корону."
buy = "Купить роту (100 монет)"
leave = "Не сейчас"

[camp.duel]
title = "Вызов"
text = "Капитан гвардии Короны стоит в арене и смотрит на твою алебардщицу. «Варга, — говорит он. — Говорят, ты трусиха, которая продала Корону за кусок хлеба. Выйди, если не боишься»."
accept = "Пусть Варга выйдет на поединок"
refuse = "Не давать ей драться"

[camp.duel_won]
title = "Поединок"
text = "Капитан лежит в арене. Варга стоит над ним, опустив алебарду, и вытирает лицо. Она берёт его секиру и не благодарит никого."

[camp.duel_lost]
title = "Варга"
text = "Арена пуста. Варги нет в строю: её унесли или она сама упала и не встала. Роты молчат, и никто не говорит её имени."

[camp.raid]
title = "Обоз Короны"
text = "Обоз Короны идёт по дороге с мешками зерна и бочками соли. Охрана в пыли и не ждёт засады. Можно ударить из-за камней или пропустить."
hit = "Ударить роты из лагеря"
pass = "Пропустить обоз"

[camp.loot]
title = "Добыча"
text = "Корд делит добычу. «Моим людям положена доля, — говорит он. — Раздели честно, и мы будем братьями. Оставь себе всё, и я вспомню это»."
split = "Раздать поровну"
keep = "Оставить добычу себе"

[camp.gate]
title = "Стоячий камень"
text = "У камня старый караульный показывает на метки. «Ночью он светится, если зажечь огонь с четырёх сторон. Так говорят. Попробовать?»"
light = "Зажечь огонь"
leave = "Оставить камень в темноте"

[camp.relief]
title = "Подмога Короны"
text = "С северо-востока идут гвардейцы Короны. Их знамя ещё новое, и они идут к лагерю, как на парад."

[camp.trust]
title = "Капитан роты"
text = "Роты собираются у костра и поднимают кружки. Твоё имя слышат все. Золото идёт по рукам, и никто не спрашивает, откуда оно."

[camp.end_friend]
title = "Вольная рота"
text = "Гвардия Короны легла у лагеря. Корд сидит рядом и смотрит на огонь. «Ты держал слово, и мы держим твоё. Пусть Корона ищет другого»."

[camp.end_hired]
title = "Наёмник"
text = "Гвардия Короны легла у лагеря. Корд получает плату и уходит к следующему нанимателю. Ты больше не в долгу перед ним, и он больше не в долгу перед тобой."

[camp.end_betrayed]
title = "Предательство"
text = "Гвардия Короны легла у лагеря, но рота Корда ушла в степь с добычей. Корд обещал вернуться, и роты помнят, кто первым отказался делиться."

[camp.end_alone]
title = "Лагерь рот"
text = "Гвардия Короны легла у лагеря. Роты поднимают кружки за тех, кто пришёл. Без Корда и без Варги ты остался один с ними, и никто не знает, с кем ты пойдёшь дальше."
# --- gates ---

[gates.map]
title = "Врата"
description = "Четыре стоячих камня в Марке. Два из них ещё ждут обряда."
won = "Последние врата закрыты или заняты. Курганы подошли ближе."

[gates.building.gate_n]
name = "Врата Ворона"
description = "Камни на голом холме. Надписи оплавлены, будто их жгли изнутри."

[gates.building.gate_e]
name = "Врата Зари"
description = "Восточные камни стоят в золе. По ночам на них горит белый огонь."

[gates.building.gate_s]
name = "Врата Камыша"
description = "Камни у болота. Сторож берёт плату за проход, как у брода."

[gates.building.gate_w]
name = "Врата Пепла"
description = "Камни в редком лесу. Здесь когда-то давали клятвы."

[gates.building.reedmere]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Там помнят, кто проехал мимо."

[gates.army.guard_n]
name = "Призраки Ворона"

[gates.army.guard_e]
name = "Мёртвые Зари"

[gates.army.guard_s]
name = "Разбойники Камыша"

[gates.army.guard_w]
name = "Беглые солдаты Короны"

[gates.army.barrow_reserve]
name = "Курганная дружина"

[gates.army.wraith_messenger]
name = "Призрачный посланник"

[gates.army.sealed_host]
name = "Спящая дружина"

[gates.gt_arrive_order]
title = "Приказ Ордена"
text = "Инквизиторы Ордена ждут у брода. Брат Ильм молчит. Они пойдут за тобой, пока ты удерживаешь Марку, и Орден не скажет зачем."

[gates.gt_arrive_marsh]
title = "Тропы Тэсс"
text = "Тэсс ждёт на краю болота с двумя охотниками. «Через топь пройдёшь по нашим тропам, — говорит она. — Мои люди быстрее ваших коней. Не отставайте»."

[gates.gt_arrive_companies]
title = "Контракт роты"
text = "Корд встречает тебя у фургонов. «Сто монет за неделю, офицер, или мои люди уйдут. Золото сначала, слова потом»."

[gates.gt_closed_e]
title = "Восточные врата"
text = "Камни Зари погасли. Между ними лежат кости в ржавой броне, над ними стоит белый туман. Врата закрыты: их открывает обряд или падение стражи."
rite = "Брат Ильм читает обряд"
walk = "Отойти"

[gates.gt_closed_s]
title = "Врата Камыша"
text = "Сторож в мокром плаще поднимает руку. «Врата открыты для тех, кто платит. Сто монет, и камни твои. Или подходи к моим людям»."
pay = "Заплатить сто монет"
walk = "Отойти"

[gates.gt_closed_w]
title = "Врата Пепла"
text = "Камни в лесу молчат. Под ними пепел, а на нём следы, которые никуда не ведут. Врата не отзываются."
charm = "Показать болотный оберег"
tess = "Тэсс ведёт тропой"
walk = "Отойти"

[gates.gt_stone_n]
title = "Врата Ворона"
text = "Камни Ворона горят синим. Отсюда можно шагнуть к любым открытым вратам. Каждый шаг ложится холодом на плечи."
to_e = "Шагнуть к Вратам Зари"
to_s = "Шагнуть к Вратам Камыша"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_e]
title = "Врата Зари"
text = "Белый огонь поднимается между камнями. Врата открыты, и мёртвые это знают."
to_n = "Шагнуть к Вратам Ворона"
to_s = "Шагнуть к Вратам Камыша"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_s]
title = "Врата Камыша"
text = "Камни у болота тянут воду из сапог. Путь открыт."
to_n = "Шагнуть к Вратам Ворона"
to_e = "Шагнуть к Вратам Зари"
to_w = "Шагнуть к Вратам Пепла"
stay = "Остаться"

[gates.gt_stone_w]
title = "Врата Пепла"
text = "Пепел на камнях ещё тёплый. Врата открыты."
to_n = "Шагнуть к Вратам Ворона"
to_e = "Шагнуть к Вратам Зари"
to_s = "Шагнуть к Вратам Камыша"
stay = "Остаться"

[gates.gt_opened]
title = "Врата открыты"
text = "Камни ожили, и узор на них светится. Врата открыты, и за ними уже шевелятся мёртвые."

[gates.gt_surge]
title = "Из врат"
text = "Из камней выходят мёртвые. Они идут строем, и их никто не ведёт."

[gates.gt_betrayed]
title = "Роту не заплатили"
text = "Корд ставит людей против тебя. «Контракт кончился, офицер. Деньги кончаются первыми»."

[gates.gt_messenger]
title = "Призрак у камней"
text = "Серый человек без лица стоит у дороги. Он знает имя брата Ильма и называет условия Курганного короля. «Это не рабство, а сделка. Договор, который переживёт Марку»."
listen = "Выслушать"
away = "Прогнать"

[gates.gt_last]
title = "Последние врата"
text = "Четвёртые врата открыты. Камни ждут: их можно запечатать или занять. Что бы ты ни выбрал, курганы это услышат."
close = "Запечатать врата: пусть мёртвые ждут"
claim = "Занять врата: пусть камни служат Марке"

# --- barrows ---

[barrows.map]
title = "Курганы"
description = "Царство Курганного короля: поля, река Пепелка с бродом, мёртвые холмы и дворец на каменном холме под снегом."
won = "Курганный король мёртв, а Марка спит. Или не спит."

[barrows.building.throne]
name = "Дворец Курганного короля"
description = "Каменный дворец на холме. Окна светятся без огня."

[barrows.building.ford_fort]
name = "Крепость у брода"
description = "Гарнизон Короны держит южный берег."

[barrows.building.watch_keep]
name = "Сторожевой замок"
description = "Башня над болотами. Огни на ней горят всю ночь."

[barrows.building.chapel]
name = "Часовня Ордена"
description = "Колокол звонит без ветра."

[barrows.building.marsh_village]
name = "Тростниковая Топь"
description = "Деревня на сухом островке. Тэсс знает, где её найти."

[barrows.building.camp]
name = "Лагерь вольных рот"
description = "Палатки, фургоны и бочки. Здесь торгуют всем, кроме прощения."

[barrows.army.barrow_king]
name = "Курганный король"

[barrows.army.sealed_host]
name = "Спящая дружина"

[barrows.bw_arrive]
title = "Курганы зовут"
text = "Курганы больше не молчат. Из-под холмов поднимается туман, и ветер несёт голоса тех, кого здесь похоронили. Король ждёт на севере, в своём дворце. Он хочет, чтобы ты пришёл сам."

[barrows.bw_rises]
title = "Курганный король"
text = "Из-под холма на севере встаёт дружина. Рыцари смерти идут ровным строем. Король послал их не выкупить Марку, а взять."

[barrows.bw_allies]
title = "Союзники идут"
text = "На дороге к курганам показались твои союзники. Они идут на север, к дворцу, и не оглядываются. Мёртвые тоже их видят."

[barrows.bw_curse]
title = "Проклятие"
text = "По войску проходит холодная волна. Знамёна гаснут, кони храпят. Проклятие ложится на гарнизоны и на твою дружину, и кажется, что оно не уйдёт."

[barrows.bw_remedy]
title = "Очищение"
text = "Здесь есть, чем смыть скверну. Выбирай, пока проклятие не пустило корни глубже."
rite = "Обряд Ордена (брат Ильм)"
herbs = "Травы топи"
buy = "Заплатить роте за отвар (60 монет)"
none = "Не лечиться"

[barrows.bw_fate_varga]
title = "Варга"
text = "Варга стоит на холме с алебардой. «Я дойду до дворца, — говорит она. — Или останусь здесь, если так нужно»."
walk = "Идти вместе"
leave = "Оставить её держать ворота"

[barrows.bw_fate_tess]
title = "Тэсс"
text = "Тэсс сидит на камне в топи. «Я знаю тропу через курганы, — говорит она. — Там нет мёртвых, только вода. Но назад я не пойду»."

[barrows.bw_fate_ilm_inq]
title = "Брат Ильм"
text = "Ильм разворачивает свиток. «Орден не простит тебе ошибку, но и мёртвых он не простит. Я даю тебе слово, а не судьбу»."

[barrows.bw_fate_ilm_heresy]
title = "Брат Ильм"
text = "Ильм смотрит на тебя без страха. «Серый человек ждёт у дворца. Ты знаешь, что он предлагает. Решай сам, а я буду свидетелем»."

[barrows.bw_fate_kord]
title = "Корд"
text = "Корд стоит у фургонов. «Рота хочет расчёта, офицер. Или ты отдашь, что обещал, или мы уйдём и заберём всё, что не заплачено»."
pay = "Заплатить пятьдесят монет"
shake = "Пожать руку"

[barrows.bw_throne]
title = "Трон"
text = "Дворец пуст, и трон стоит в центре зала. Холод тянется от него к плечам. Курганный король ждёт за дверью."

[barrows.bw_grey_throne]
title = "Серая сделка"
text = "Серый призрак стоит у трона и ждёт. «Преклони колено, и мёртвые опустят мечи. Марка не станет твоей, но и могилой не станет»."
kneel = "Преклонить колено перед троном"
stand = "Встать и идти в бой"

[barrows.bw_king_slain]
title = "Король мёртв"
text = "Курганный король лежит у подножия трона. Его дружина рассыпается прахом. Марка ещё дышит, и кому-то надо решить, что с ней будет."
next = "Дальше"

[barrows.bw_sum_roads]
title = "Пустые дороги"
text = "Караваны не дошли до Марки. Цена соли и хлеба выросла вдвое, и крестьяне считают, кто из купцов в этом виноват."
next = "Дальше"

[barrows.bw_sum_fire]
title = "Пепел деревень"
text = "Деревни сожжены, на полях нет ни одного дома. Крестьяне смотрят на тебя так же, как смотрели на курганы."
next = "Дальше"

[barrows.bw_council]
title = "Совет Марки"
text = "Курганы молчат. Решай, какой будет Марка: та, что держится короны и ордена, или та, что живёт ротами и болотом. Если не держится ни то ни другое, остаётся пепел."
iron = "Железный мир: Корона и Орден"
free = "Вольная Марка: роты и болотный люд"
fall = "Падение Марки"

# --- campaign ---

[campaign.end_iron]
title = "Железный мир"
text = "Марка стала тихой провинцией Короны. Орден ставит часовни на курганах, а на башнях висят синие знамёна. Марка в безопасности, но не свободна."

[campaign.end_free]
title = "Вольная Марка"
text = "Марка принадлежит ротам и болоту. Дороги открыты для тех, кто платит, и никто не спрашивает, откуда золото. Курганы ещё шевелятся, но уже не по приказу короля."

[campaign.end_grey]
title = "Серая сделка"
text = "Ты опустился на колено у трона, и мёртвые опустили мечи. Теперь твоё имя шепчут в курганах. Марка не сгорела и не свободна: она стала домом для тех, кто не умер до конца."

[campaign.end_fall]
title = "Пепел брода"
text = "Курганы пришли к броду. Ты умер у воды, и вместе с тобой пала Марка. Больше никто не назовёт её Пепельной: там ничего не осталось."
