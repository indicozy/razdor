[building.tower]
name = "Сторожевая башня"
description = "Каменная башня над бродом. Гарнизон Короны ушёл, когда пришли мёртвые. Здесь можно набрать людей и залечить раны за плату."

# --- chapter 1: the frame, the beats, the diary (docs/ideas/pepelnaya-marka-narrative.md §5) ---
[arrival]
title = "Указ Короны"
text = "Курьер не слезает с седла. Он бросает свиток с печатью и говорит, не глядя на тебя: «Хранитель Марки. Корона дарует тебе провинцию и ни одного солдата. Гарнизон башни бежал неделю назад. Курганы на северо-востоке шумят по ночам. Если мёртвые перейдут Пепелку, Марку не удержит никто». Он уезжает, не дожидаясь ответа."

[farm]
title = "Сожжённый хутор"
text = "Хутор сгорел дотла. В золе лежит тряпичная кукла с одним глазом. В печи нашлись монеты, которые никто не успел забрать. Следы ведут на юго-запад, к болоту: семья ушла."

[north_bridge]
title = "Северный брод"
text = "Дорога спускается к северному броду. Три бревна легли поперёк реки, и доски на них выломаны. Кто-то пытался перейти здесь ночью и ушёл назад. На перилах висит шапка, мокрая насквозь."

[mill_wheel]
title = "Колесо мельницы"
text = "Колесо мельницы стоит в ручье, обугленное по краям. Под ним в тине что-то блестит. Пока это только блеск."

[cairn]
title = "Знак на дороге"
text = "Камни у обочины сложены в стрелку, указывающую к болоту. Кто-то торопился туда и не стал ждать, пока его поймут."

[bog_edge]
title = "Край топи"
text = "Камыш у воды усеян костями птиц и мелкими косточками. На кочке сидит тряпичная кукла. Из тумана на миг выглядывает бледное лицо и тут же прячется."

[ruts]
title = "Колея"
text = "Колея на дороге глубокая: по ней ушло много телег, гружённых всем, что влезло. Следы идут на юг, к Ашфорду. Назад не вернулась ни одна."

[milestone]
title = "Межевой столб"
text = "У северной дороги стоит столб с гербом Короны, наполовину сбитым. Ниже чья-то рука углём написала: «Ашфорд три дня. Дорога пуста»."

[grave_marker]
title = "Вешка"
text = "Три камня у обочины и ленточка от детского платка. Под камнями никого нет. На одном из них выцарапано: «Ивор не дошёл до Топи. Мы пошли дальше»."

[ferry]
title = "Затонувшая лодка"
text = "У берега затонула лодка, весло торчит из ила. Перевозчика не видно: или его забрали курганы, или он сам ушёл. Мост у мельницы остался один."

[tower_log]
title = "Журнал караула"
text = "Башня пуста, в камине холодная зола. На столе лежит журнал караула. Последняя запись пятидневной давности: «...третью ночь земля у курганов тёплая. Капитан велел уходить». Ниже другим почерком: «Кто остался, тот сам выбрал»."

[stones]
title = "Башня и камни"
text = "С башни видны стоячие камни на холме над курганами. Надписи на них ещё можно прочесть. Говорят, когда-то через эти камни ходили, не касаясь земли. Курганы слышат, что в башне снова люди: Страх растёт."

[varga_meet]
title = "Алебардщица"
text = "За обугленными стенами ряд свежих могил, без крестов. Над ними сидит алебардщица в рваной кирасе. «Гарнизон сбежал, а хоронить кто-то должен, — говорит она. — Я похоронила. Корона прислала тебя, значит, долго ты не задержишься. Выбирай»."
join = "Идти со мной"
refuse = "Пусть идёт своей дорогой"
burn = "Сжечь развалины: под ними золото (+40, Страх +2)"

[scout]
title = "Письмо разведчика"
text = "У дороги лицом вниз лежит мертвец в мундире разведчика. В кулаке клочок пергамента, строка размазана кровью: «Сорок мертвецов и одного в короне. Он смотрит на Брод и ждёт». Подписи нет."

[toll]
title = "Брод"
text = "У брода стоит шайка с копьями. Главарь ухмыляется, но глаза у него бегают. «Переправа одна, и она наша. Мёртвые пойдут через этот брод, и мы уйдём на юг. А ты останешься стоять тут? Тогда плати или дерись»."
pay = "Заплатить двадцать монет"
fight = "Драться"
talk = "Пусть уходят: обещание за проход"

[deserter_note]
title = "Повешенный"
text = "На перекрёстке висит человек в солдатской куртке. На груди записка, выведенная углём: «Нас было шестеро. Мы не хотели воевать с мертвецами. Нас пятеро, и мы в лесу у северного брода». Крови нет: его не били, он сам не выдержал."

[refugees]
title = "Перевёрнутая телега"
text = "Телега лежит на боку, колесо сломано, мешки с мукой в грязи. Женщина с ребёнком на руках смотрит на тебя без страха. «Мы из хутора у дороги. Отведи нас в Тростниковую Топь, к болотному люду. Они нас примут, если мы назовёмся»."
take = "Отвести их в Топь"
leave = "Не мой путь"

[herb]
title = "Травница"
text = "Старуха сушит травы на жердях у болотной тропы. «Призраков не бьют железом, — говорит она. — Огонь и вера, вот что их гонит. А раны мажь вот этим, пока не загноились»."
buy = "Купить мазь: пятнадцать монет (зелье лечения)"
leave = "Уйти"

[marsh_plea]
title = "Болотный люд"
text = "Старуха с мокрым подолом держит тебя за стремя. Призраки выходят из трясины каждую ночь, и каждую ночь они забирают одного. Её сын не вернулся с последней. «Помоги или проезжай, — говорит она. — Но запомни, кто проехал»."
help = "Помочь ей"
ride_on = "Проехать мимо (Доверие −1)"

[marsh_thanks]
title = "Благодарность топи"
text = "Болотный люд кланяется и называет имя: Тэсс, дочь ведьмы с дальнего края топи. «Она знает тропы сквозь трясину, — говорит старуха. — Придёт, когда позовёт болото»."

[dread_1]
title = "Курганы"
text = "Земля под ногами гудит, будто кто-то считает твои шаги. Это и есть Страх: он растёт от огня, крови и шума. Когда он дойдёт до пяти, мертвецы встанут у брода. Следи за ним в дневнике."

[raid_sent_tower]
title = "Набег"
text = "Курганы шевельнулись сильнее. Из-под земли на северо-востоке вышел отряд мертвецов и пошёл на сторожевую башню. Если башня падёт, здесь будет некому набрать людей."

[raid_sent_village]
title = "Набег"
text = "Курганы шевельнулись сильнее. Из-под земли на северо-востоке вышел отряд мертвецов и пошёл на Тростниковую Топь. Деревня без стен: если они дойдут, болотный люд уйдёт или сгорит."

[raid_tower]
title = "Башня пала"
text = "Ночью из курганов вышел отряд мертвецов. Ворота башни не выдержали, гарнизон ушёл в темноту. Башня теперь их."

[raid_village]
title = "Тростниковая Топь горит"
text = "Отряд мертвецов прошёл через топь и поджёг деревню. Болотный люд стоит на пепелище и смотрит на тебя: ты не защитил их."

[raid_beaten]
title = "Мертвецы легли"
text = "Отряд, шедший на башню или на деревню, рассыпался у дороги. Ты обыскал тела: пятнадцать монет в костяной оправе. Кровь разбудила курганы: Страх растёт."

[host_warning]
title = "Огни в курганах"
text = "Ночью в курганах зажглись огни. К утру они будут у брода. Собери тех, кто ещё держит копьё, и иди к среднему броду."

[host_rises]
title = "Курганы"
text = "Земля у среднего брода гудит. Из-под обугленных полей встают мёртвые: рыцари в ржавых латах и твари, что ползают на четырёх. Они идут на тебя."

[barrow]
title = "Курган"
text = "Курган на северо-востоке: камни сложены в круг, в проломе видна тёмная лестница. Надпись велит не будить того, кто спит внутри. Курган можно разорить, пока мертвецы не выбрались, или запечатать обрядом."
break = "Разорить курган: тяжёлый бой"
seal = "Запечатать обрядом: сорок монет, Страх −1"
leave = "Уйти, не трогая его"

[barrow_broken]
title = "Курган разорен"
text = "Лестница обвалилась, и кости под камнями рассыпались в пыль. Из глубины доносится хрип. Дружина, что встанет у брода, будет слабее: одного из мертвецов уже нет."

[barrow_sealed]
title = "Курган запечатан"
text = "Обряд длится до ночи. Круг вспыхивает серым светом и гаснет. Курган спит, и Страх отступает хотя бы на шаг."

[refugees_thanks]
title = "Родня"
text = "В Тростниковой Топи их встречают у порога. Старуха молча кивает тебе и отдаёт пятнадцать монет, что нашлись на дне мешка. Болотный люд запоминает, кто возвращает своих."

[deserters]
title = "Беглецы Короны"
text = "В лесу у северного брода пятеро в обрывках мундиров. Старший выходит с копьём: «Мы бежали от Короны, она не платит. Возьми нас за тридцать монет или отдай Короне, за нас дадут награду»."
serve = "Нанять за тридцать монет (двое пойдут в отряд)"
hand = "Отдать Короне: Корона +1"
pass = "Пусть идут куда хотят"

[deserters_served]
title = "Беглецы в отряде"
text = "Двое беглецов сбрасывают мундиры и встают в строй. Остальные уходят в камыши. Жалованье они берут вперёд и считают, сколько осталось."

[deserters_handed]
title = "Награда Короны"
text = "Беглецов отвели к капитану. Корона благодарит письмом без подписи, и гарнизон Марки смотрит на тебя с большим уважением."

[omen]
title = "Новолуние"
text = "Новолуние. В камышах кто-то смеётся. Утром на пороге лежит то, что тебе оставили: дурной знак или подарок."

[end_fire]
title = "Дым над Маркой"
text = "Мёртвые легли у брода. Над сожжённой мельницей ещё стоит дым, и оставшиеся крестьяне смотрят на тебя, как смотрят на пожар. Марка жива, но твоё имя записано среди поджигателей."

[end_mercy]
title = "Брод устоял"
text = "Мёртвые легли у брода. Мельница стоит, и поле за ней зеленеет первой травой. Марка не забудет, кто её защитил, и не простит, если защитник уйдёт."

[rider]
title = "Гонец из Ашфорда"
text = "Всадник в запылённом плаще осаживает коня у брода. Он смотрит на реку, потом на тебя. «Марка видела, как ты держал брод. Совет в Пепельном Броде ждёт тебя. Не все там принесут хлеб, но все захотят знать, что ты сделал»."

[quest.hold_ford]
title = "Удержать брод"
start = "Мёртвые придут к среднему броду. Собери людей, пока есть время."
dread_1 = "Курганы слышат тебя. Страх: 1 из 5."
dread_2 = "Курганы шевелятся. Страх: 2 из 5. Набеги придут на башню или на топь."
dread_3 = "Страх: 3 из 5. Мёртвые собираются у курганов."
dread_4 = "Страх: 4 из 5. Ещё немного, и они встанут у брода."
warned = "Ночью в курганах зажглись огни. К утру они будут у среднего брода. Встреть их там."

[quest.tower]
title = "Занять сторожевую башню"
text = "Башня на холме к северу. Её гарнизон ушёл. Возьми её: там можно набрать людей и залечить раны."

[quest.barrow]
title = "Узнать, что творится в курганах"
text = "Курганы на северо-востоке. Что там?"
scout_title = "Курган"
scout_text = "Мертвец у дороги держал письмо: «Сорок мертвецов и один в короне». Курган на холме ждёт."

[quest.varga]
title = "Варга"
text = "Алебардщица у развалин. Идти ли с ней?"

[quest.toll]
title = "Переправа"
text = "Шайка у брода требует плату или бой."

[quest.deserters]
title = "Дезертиры"
text = "Пятеро беглецов в лесу у северного брода. Служить за плату или сдать Короне."

[quest.refugees]
title = "Беженцы"
text = "Семья из перевёрнутой телеги. Отвезти их в Тростниковую Топь?"
taken = "Отвезти семью в Тростниковую Топь."

[quest.marsh]
title = "Призраки топи"
text = "Старуха из Тростниковой Топи просит помощи: призраки забирают по одному каждую ночь."

[quest.raid_tower]
title = "Набег на башню"
text = "Отряд мертвецов идёт на сторожевую башню. Встреть его там."
lost = "Башня пала. Отряд остался в ней."

[quest.raid_village]
title = "Набег на Тростниковую Топь"
text = "Отряд мертвецов идёт на деревню в болоте. Загони его обратно."
lost = "Деревня сгорела."

# --- marka ---
[marka.map]
title = "Марка"
description = "Река Пепелка, три брода. Аббатство на северо-западе, солончаки на юго-западе, лагерь рот на юго-востоке, курганы на северо-востоке."
won = "Марка выбрала сторону. Дороги ведут дальше."

