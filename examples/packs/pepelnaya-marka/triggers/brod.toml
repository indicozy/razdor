# Chapter 1 «Брод»: the variables and the triggers of the map `brod`. Every trigger names its map
# (`map`), so the package's later maps can share this file. The moments are the game's: the start,
# the hero's steps, the buildings and armies, each day, each week and each new moon, and the dialogs' answers.
#
# Dread (Страх) grows from the hero's deeds: each main deed adds one (the watchtower, the toll settled,
# Varga's meeting, the wraiths beaten); burning the mill adds two. The week's +1 is only a slow backstop;
# the new moon's omens do not touch it (Dread is not the calendar).
# At 3 the host rises the next day at the middle ford. Until it does, the undead raid the hero's land
# every few days (`raid_day`): they walk on the watchtower if he holds it, else on Reedmere.

[vars]
dread = 0              # Страх: the deeds' +1 each (the mill +2), the week's +1 as a backstop; at 3 the host rises
omen = 0               # the new moon's roll: 1 is a bad sign (a line only: Dread is the deeds'), 3 a gift (+15 gold)
toll_settled = false   # the ford toll is paid, fought or talked away
toll_talked = false    # the bandits agreed to leave for a price later (chapter 3в)
mill_burned = false    # the ruined mill was burned for the gold under it
varga_joined = false   # Varga walks with the hero
varga_refused = false  # Varga was sent on her way
marsh_trust = 0        # the marsh folk's trust: helping them +2, riding past -1, a family taken home +1
marsh_hunt = false     # the hero took the marsh folk's quarrel on
tower_taken = false    # the watchtower is the hero's (false again when the undead take it)
host_up = false        # the barrow host has risen (its day is the last of the raids)
raid_day = 0           # the days since the start while the host sleeps: the raids come on days 4, 8 and 12
barrow_broken = false  # the barrow mound was broken: the host rises one unit weaker; chapter 5 sends one host fewer
barrow_sealed = false  # the barrow mound was sealed with a rite: chapter 5 sends one host fewer
refugees = false       # a family asked to be taken to Reedmere, and the hero said yes
refugees_done = false  # ... and was taken there
deserters = 0          # the Crown's deserters: 0 unmet, 1 served the hero, 2 handed to the Crown, 3 let go

# The arrival: the game starts with the officer's orders.
[[trigger]]
id = "arrival"
map = "brod"
when = { event = "game_start" }
then = [
    { dialog = "arrival" },
    { army_goal = "toll", go_to = [29, 23] },
    { army_goal = "wraiths", go_to = [6, 44] },
]

# The ruins by the road: Varga waits among the burned walls.
[[trigger]]
id = "varga_meet"
map = "brod"
when = { event = "hero_enters", at = [30, 15, 6, 5] }
if = [ { var = "varga_joined", value = false }, { var = "varga_refused", value = false } ]
then = [ { dialog = "varga_meet" } ]

# A deed: Varga's meeting resolved (joined or sent away; the burning of the ruins is the mill's own +2).
[[trigger]]
id = "varga_join"
map = "brod"
when = { event = "dialog_choice", dialog = "varga_meet", choice = "join" }
then = [ { set = "varga_joined", value = true }, { add = "dread", value = 1 } ]

[[trigger]]
id = "varga_refuse"
map = "brod"
when = { event = "dialog_choice", dialog = "varga_meet", choice = "refuse" }
then = [ { set = "varga_refused", value = true }, { add = "dread", value = 1 } ]

[[trigger]]
id = "varga_burn"
map = "brod"
when = { event = "dialog_choice", dialog = "varga_meet", choice = "burn" }
then = [ { set = "varga_refused", value = true } ]

# The ford toll: a bandit band on the road, once the hero comes near it and it still holds the road.
[[trigger]]
id = "toll_ford"
map = "brod"
when = { event = "hero_enters", at = [25, 20, 9, 8] }
if = [ { var = "toll_settled", value = false }, { army_at = "toll", at = [29, 23] } ]
then = [ { dialog = "toll" } ]

[[trigger]]
id = "toll_pay"
map = "brod"
when = { event = "dialog_choice", dialog = "toll", choice = "pay" }
then = [ { set = "toll_settled", value = true } ]

[[trigger]]
id = "toll_fight"
map = "brod"
when = { event = "dialog_choice", dialog = "toll", choice = "fight" }
then = [ { set = "toll_settled", value = true }, { start_battle = "toll", rules = "dt" } ]

[[trigger]]
id = "toll_talk"
map = "brod"
when = { event = "dialog_choice", dialog = "toll", choice = "talk" }
then = [ { set = "toll_talked", value = true }, { set = "toll_settled", value = true } ]

[[trigger]]
id = "toll_beaten"
map = "brod"
when = { event = "army_defeated", army = "toll" }
then = [ { give_gold = 25 }, { set = "toll_settled", value = true } ]

# A deed, however the toll was settled: once the flag turns, one Dread.
[[trigger]]
id = "toll_deed"
map = "brod"
when = { event = "var_changed", var = "toll_settled" }
if = [ { var = "toll_settled", value = true } ]
then = [ { add = "dread", value = 1 } ]

# The Dread's lines: one for each of the first two steps (the host's own dialog comes at three).
[[trigger]]
id = "dread_line_1"
map = "brod"
when = { event = "var_changed", var = "dread" }
if = [ { var = "dread", value = 1 } ]
then = [ { dialog = "dread_1" } ]

[[trigger]]
id = "dread_line_2"
map = "brod"
when = { event = "var_changed", var = "dread" }
if = [ { var = "dread", value = 2 } ]
then = [ { dialog = "dread_2" } ]

# The backstop: a week's +1 for a hero who dawdles. It is the only Dread that is not a deed.
[[trigger]]
id = "dread_week"
map = "brod"
when = { event = "week_start" }
once = false
then = [ { add = "dread", value = 1 } ]

# The host rises the day after Dread reaches 3, at the middle ford: once, and weaker if the mound was broken.
[[trigger]]
id = "host_rises"
map = "brod"
when = { event = "day_start" }
if = [ { var = "dread", op = ">=", value = 3 }, { var = "barrow_broken", value = false }, { var = "host_up", value = false } ]
then = [
    { set = "host_up", value = true },
    { spawn_army = "host", at = [28, 25], faction = "enemy", model = 10, troops = ["dt:ghoul", "dt:dead_warrior"] },
    { army_goal = "host", attack = "hero" },
    { dialog = "host_rises" },
]

[[trigger]]
id = "host_rises_weak"
map = "brod"
when = { event = "day_start" }
if = [ { var = "dread", op = ">=", value = 3 }, { var = "barrow_broken", value = true }, { var = "host_up", value = false } ]
then = [
    { set = "host_up", value = true },
    { spawn_army = "host", at = [28, 25], faction = "enemy", model = 10, troops = ["dt:ghoul"] },
    { army_goal = "host", attack = "hero" },
    { dialog = "host_rises" },
]

# The raids while the host sleeps: a day clock, and on days 4, 8 and 12 a small band of the dead comes
# out of the north-east barrows. It walks on the watchtower if the hero holds it, else on Reedmere.
[[trigger]]
id = "raid_clock"
map = "brod"
when = { event = "day_start" }
if = [ { var = "host_up", value = false } ]
once = false
then = [ { add = "raid_day", value = 1 } ]

[[trigger]]
id = "raid_1_tower"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 4 }, { var = "host_up", value = false }, { var = "tower_taken", value = true } ]
then = [
    { spawn_army = "raid_1", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:ghoul", "dt:deadman"] },
    { army_goal = "raid_1", go_to_building = "tower" },
]

[[trigger]]
id = "raid_1_village"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 4 }, { var = "host_up", value = false }, { var = "tower_taken", value = false } ]
then = [
    { spawn_army = "raid_1", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:ghoul", "dt:deadman"] },
    { army_goal = "raid_1", go_to_building = "reedmere" },
]

[[trigger]]
id = "raid_2_tower"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 8 }, { var = "host_up", value = false }, { var = "tower_taken", value = true } ]
then = [
    { spawn_army = "raid_2", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:ghoul", "dt:deadman"] },
    { army_goal = "raid_2", go_to_building = "tower" },
]

[[trigger]]
id = "raid_2_village"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 8 }, { var = "host_up", value = false }, { var = "tower_taken", value = false } ]
then = [
    { spawn_army = "raid_2", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:ghoul", "dt:deadman"] },
    { army_goal = "raid_2", go_to_building = "reedmere" },
]

[[trigger]]
id = "raid_3_tower"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 12 }, { var = "host_up", value = false }, { var = "tower_taken", value = true } ]
then = [
    { spawn_army = "raid_3", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:deadman", "dt:deadman"] },
    { army_goal = "raid_3", go_to_building = "tower" },
]

[[trigger]]
id = "raid_3_village"
map = "brod"
when = { event = "var_changed", var = "raid_day" }
if = [ { var = "raid_day", value = 12 }, { var = "host_up", value = false }, { var = "tower_taken", value = false } ]
then = [
    { spawn_army = "raid_3", at = [42, 2], faction = "enemy", model = 10, troops = ["dt:deadman", "dt:deadman"] },
    { army_goal = "raid_3", go_to_building = "reedmere" },
]

# A raid that arrives at the watchtower takes it (the AI's own building rules); the loss is noticed below.
[[trigger]]
id = "raid_1_takes_tower"
map = "brod"
when = { event = "army_arrives", army = "raid_1", building = "tower" }
then = [ { dialog = "raid_tower" } ]

[[trigger]]
id = "raid_2_takes_tower"
map = "brod"
when = { event = "army_arrives", army = "raid_2", building = "tower" }
then = [ { dialog = "raid_tower" } ]

[[trigger]]
id = "raid_3_takes_tower"
map = "brod"
when = { event = "army_arrives", army = "raid_3", building = "tower" }
then = [ { dialog = "raid_tower" } ]

[[trigger]]
id = "tower_lost"
map = "brod"
when = { event = "building_lost", building = "tower" }
then = [ { set = "tower_taken", value = false } ]

# A raid that reaches Reedmere burns it: the village's ash counts, and the marsh folk trust the hero less.
[[trigger]]
id = "raid_1_burns"
map = "brod"
when = { event = "army_arrives", army = "raid_1", building = "reedmere" }
then = [ { remove_army = "raid_1" }, { add = "villages_burned", value = 1 }, { add = "marsh_trust", value = -1, min = -5, max = 5 }, { dialog = "raid_village" } ]

[[trigger]]
id = "raid_2_burns"
map = "brod"
when = { event = "army_arrives", army = "raid_2", building = "reedmere" }
then = [ { remove_army = "raid_2" }, { add = "villages_burned", value = 1 }, { add = "marsh_trust", value = -1, min = -5, max = 5 }, { dialog = "raid_village" } ]

[[trigger]]
id = "raid_3_burns"
map = "brod"
when = { event = "army_arrives", army = "raid_3", building = "reedmere" }
then = [ { remove_army = "raid_3" }, { add = "villages_burned", value = 1 }, { add = "marsh_trust", value = -1, min = -5, max = 5 }, { dialog = "raid_village" } ]

# A raid the hero meets and beats: a little gold and a word of thanks.
[[trigger]]
id = "raid_1_beaten"
map = "brod"
when = { event = "army_defeated", army = "raid_1" }
then = [ { give_gold = 15 }, { dialog = "raid_beaten" } ]

[[trigger]]
id = "raid_2_beaten"
map = "brod"
when = { event = "army_defeated", army = "raid_2" }
then = [ { give_gold = 15 }, { dialog = "raid_beaten" } ]

[[trigger]]
id = "raid_3_beaten"
map = "brod"
when = { event = "army_defeated", army = "raid_3" }
then = [ { give_gold = 15 }, { dialog = "raid_beaten" } ]

# The watchtower taken, each time the hero takes it (the flag the raids read; a retaken tower is his again).
[[trigger]]
id = "tower_taken"
map = "brod"
when = { event = "building_captured", building = "tower" }
once = false
then = [ { set = "tower_taken", value = true } ]

# The watchtower's deed, once: the standing stones show on the hill (a tease for chapter 4's waygates).
[[trigger]]
id = "tower_deed"
map = "brod"
when = { event = "building_captured", building = "tower" }
then = [ { add = "dread", value = 1 }, { dialog = "stones" } ]

# The marsh folk's village: the wraiths trouble it, and its people ask for help.
[[trigger]]
id = "marsh_plea"
map = "brod"
when = { event = "hero_enters", at = [4, 34, 12, 12] }
if = [ { var = "marsh_hunt", value = false } ]
then = [ { dialog = "marsh_plea" } ]

[[trigger]]
id = "marsh_help"
map = "brod"
when = { event = "dialog_choice", dialog = "marsh_plea", choice = "help" }
then = [ { set = "marsh_hunt", value = true } ]

[[trigger]]
id = "marsh_ride_on"
map = "brod"
when = { event = "dialog_choice", dialog = "marsh_plea", choice = "ride_on" }
then = [ { add = "marsh_trust", value = -1, min = -5, max = 5 } ]

# The wraiths beaten: the charm goes to Varga when she fought beside him, else to his pack. A deed: one Dread.
[[trigger]]
id = "wraiths_helped"
map = "brod"
when = { event = "army_defeated", army = "wraiths" }
if = [ { has_named_unit = "varga", unit = "dt:halberdier" } ]
then = [
    { give_item = "marsh_charm", to = "named:varga" },
    { give_unit = "dt:hunter" },
    { give_unit = "dt:hunter" },
    { add = "marsh_trust", value = 2, min = -5, max = 5 },
    { add = "dread", value = 1 },
    { dialog = "marsh_thanks" },
]

[[trigger]]
id = "wraiths_helped_alone"
map = "brod"
when = { event = "army_defeated", army = "wraiths" }
if = [ { var = "varga_joined", value = false } ]
then = [
    { give_item = "marsh_charm" },
    { give_unit = "dt:hunter" },
    { give_unit = "dt:hunter" },
    { add = "marsh_trust", value = 2, min = -5, max = 5 },
    { add = "dread", value = 1 },
    { dialog = "marsh_thanks" },
]

[[trigger]]
id = "marsh_reward"
map = "brod"
when = { event = "var_changed", var = "marsh_trust" }
if = [ { var = "marsh_trust", op = ">=", value = 2 } ]
then = [ { give_gold = 20 } ]

# The refugees: a family on the road asks to be taken to Reedmere. Taken there, they thank the hero.
[[trigger]]
id = "refugees_plea"
map = "brod"
when = { event = "hero_enters", at = [10, 24, 3, 3] }
if = [ { var = "refugees", value = false }, { var = "refugees_done", value = false } ]
then = [ { dialog = "refugees" } ]

[[trigger]]
id = "refugees_take"
map = "brod"
when = { event = "dialog_choice", dialog = "refugees", choice = "take" }
then = [ { set = "refugees", value = true } ]

[[trigger]]
id = "refugees_arrive"
map = "brod"
when = { event = "hero_enters_building", building = "reedmere" }
if = [ { var = "refugees", value = true }, { var = "refugees_done", value = false } ]
then = [
    { set = "refugees_done", value = true },
    { add = "marsh_trust", value = 1, min = -5, max = 5 },
    { give_gold = 15 },
    { dialog = "refugees_thanks" },
]

# The barrow mound: a site on the north-east hill. Walking near it opens its offer, once.
[[trigger]]
id = "barrow_offer"
map = "brod"
when = { event = "hero_enters", at = [40, 4, 7, 7] }
if = [ { var = "barrow_broken", value = false }, { var = "barrow_sealed", value = false } ]
then = [ { dialog = "barrow" } ]

# Break the mound: a hard fight. A win is a deed-like gain: the host one unit weaker, chapter 5 one host fewer.
[[trigger]]
id = "barrow_break"
map = "brod"
when = { event = "dialog_choice", dialog = "barrow", choice = "break" }
then = [ { start_battle = "barrow_mound", rules = "dt" } ]

[[trigger]]
id = "barrow_beaten"
map = "brod"
when = { event = "army_defeated", army = "barrow_mound" }
then = [ { set = "barrow_broken", value = true }, { dialog = "barrow_broken" } ]

# Seal the mound with a rite: forty gold, and Dread falls by one now; chapter 5 sends one host fewer.
[[trigger]]
id = "barrow_seal"
map = "brod"
when = { event = "dialog_choice", dialog = "barrow", choice = "seal" }
then = [
    { give_gold = -40 },
    { set = "barrow_sealed", value = true },
    { add = "dread", value = -1, min = 0 },
    { dialog = "barrow_sealed" },
]

# The deserters: a band of the Crown's men on the road. They serve for thirty gold, or the hero hands them to the Crown.
[[trigger]]
id = "deserters_offer"
map = "brod"
when = { event = "hero_enters", at = [36, 22, 4, 3] }
if = [ { var = "deserters", value = 0 } ]
then = [ { dialog = "deserters" } ]

[[trigger]]
id = "deserters_serve"
map = "brod"
when = { event = "dialog_choice", dialog = "deserters", choice = "serve" }
then = [ { set = "deserters", value = 1 }, { give_gold = -30 }, { give_unit = "dt:swordsman" }, { give_unit = "dt:swordsman" }, { dialog = "deserters_served" } ]

[[trigger]]
id = "deserters_hand"
map = "brod"
when = { event = "dialog_choice", dialog = "deserters", choice = "hand" }
then = [ { set = "deserters", value = 2 }, { add = "crown", value = 1, min = -5, max = 5 }, { dialog = "deserters_handed" } ]

[[trigger]]
id = "deserters_pass"
map = "brod"
when = { event = "dialog_choice", dialog = "deserters", choice = "pass" }
then = [ { set = "deserters", value = 3 } ]

# The new moon: a roll that may bring a bad sign or a gift. Its moments repeat.
[[trigger]]
id = "omen_roll"
map = "brod"
when = { event = "new_moon" }
once = false
chance = 60
then = [ { random_var = "omen", min = 1, max = 3 } ]

[[trigger]]
id = "omen_bad"
map = "brod"
when = { event = "var_changed", var = "omen" }
if = [ { var = "omen", value = 1 } ]
once = false
then = [ { dialog = "omen" } ]

[[trigger]]
id = "omen_good"
map = "brod"
when = { event = "var_changed", var = "omen" }
if = [ { var = "omen", value = 3 } ]
once = false
then = [ { give_gold = 15 }, { dialog = "omen" } ]

# The host defeated at the ford ends the chapter: the victory's look follows what he did with the mill.
[[trigger]]
id = "won_fire"
map = "brod"
when = { event = "army_defeated", army = "host" }
if = [ { var = "mill_burned", value = true } ]
then = [ { dialog = "end_fire" }, { victory = true } ]

[[trigger]]
id = "won_mercy"
map = "brod"
when = { event = "army_defeated", army = "host" }
if = [ { var = "mill_burned", value = false } ]
then = [ { dialog = "end_mercy" }, { victory = true } ]
