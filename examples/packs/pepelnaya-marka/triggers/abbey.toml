# Chapter 3а «Аббатство» (the Order of the Ash, ally = 1): the variables and the triggers of the map
# `abbey`. Every trigger names its map. Triggers that share a moment run in file order, and each
# condition reads the state as the earlier ones left it, so the order below matters where noted.
#
# Taint: the dead's curse sticks to the hero's army (`cast_on_army`) in the blighted ground and to
# the abbey's garrison when the dead reach its walls; the Order's rite takes it off (`remove_spells`).
# The engine has no event for a lost battle, so "the dead win fights" is read as the dead reaching the
# abbey's gate (`army_arrives`) and the blight's own curse.
#
# Brother Ilm's crossroads: at Ольховка, a trial (burn the tainted village: ilm = 1) or mercy, which
# plants the heresy (ilm = 2) and a secret dialog on a later midnight. The trial is for a novice or an
# inquisitor (ilm 0 or 1); the heretic is one who spared the village.

[vars]
abbey_week = 0              # weeks since the chapter began
abbey_ilm_met = false       # Brother Ilm's offer has been answered
abbey_blight_seen = false   # the hero has been warned of the blight
abbey_siege = false         # the dead have been sent at the abbey
abbey_siege_fight = false   # the siege battle has begun (once)
abbey_alder = 0             # Ольховка: 0 not judged, 1 burned, 2 spared, 3 ridden past
abbey_siege_due = false     # the trial is judged: the dead march on the abbey the next midnight

# The story starts: the Order's letter, the inquisitors ride to the abbey, the dead walk their patrol.
[[trigger]]
id = "abbey_arrival"
map = "abbey"
when = { event = "game_start" }
then = [
    { restore_army = "player" },
    { dialog = "abbey_arrival" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.start" },
    { quest = "abbey_inquisitors", title = "quest.abbey_inquisitors.title", text = "quest.abbey_inquisitors.text" },
    { army_goal = "inquisitors", go_to_building = "abbey" },
    { army_goal = "dead_wave", patrol = [[84, 44], [90, 30], [78, 30]] },
]

# Each week counts (before the siege's check below, which reads it).
[[trigger]]
id = "abbey_week"
map = "abbey"
when = { event = "week_start" }
once = false
then = [ { add = "abbey_week", value = 1 } ]

[[trigger]]
id = "abbey_inquisitors_arrive"
map = "abbey"
when = { event = "army_arrives", army = "inquisitors", building = "abbey" }
then = [
    { dialog = "abbey_inquisitors" },
    { complete_quest = "abbey_inquisitors" },
    { quest = "abbey_alder", title = "quest.abbey_alder.title", text = "quest.abbey_alder.text" },
]

# The beats of the road north from the start (the main road, a beat every 8 cells): the pilgrims turned back,
# the wayside cross and the Order's edict, the tithe barn with its sign, the monk's warning and the cold.
[[trigger]]
id = "abbey_pilgrims"
map = "abbey"
when = { event = "hero_enters", at = [46, 82, 8, 4] }
then = [ { dialog = "abbey_pilgrims" } ]

[[trigger]]
id = "abbey_cross"
map = "abbey"
when = { event = "hero_enters", at = [46, 74, 8, 4] }
then = [ { dialog = "abbey_cross" } ]

[[trigger]]
id = "abbey_tithe"
map = "abbey"
when = { event = "hero_enters", at = [46, 66, 8, 4] }
then = [ { dialog = "abbey_tithe" } ]

[[trigger]]
id = "abbey_messenger"
map = "abbey"
when = { event = "hero_enters", at = [46, 57, 8, 4] }
then = [
    { dialog = "abbey_messenger" },
    { quest = "abbey_cold", title = "quest.abbey_cold.title", text = "quest.abbey_cold.text" },
]

# Brother Ilm at the south gate: a novice with a borrowed sword and a gift in his hands. He comes only
# to a hero who has no Ilm yet: the Order's shrine in Marka (`ilm` 1 or 2) gives him already, as a
# pilgrim, and then the crossroads below is decided.
[[trigger]]
id = "abbey_ilm_meet"
map = "abbey"
when = { event = "hero_enters", at = [46, 49, 8, 3] }
if = [ { var = "abbey_ilm_met", value = false }, { var = "ilm", value = 0 } ]
then = [ { dialog = "abbey_ilm_meet" } ]

# Brother Ilm walks home with the hero: the monks at the gate know him. Once.
[[trigger]]
id = "abbey_ilm_home"
map = "abbey"
when = { event = "hero_enters", at = [46, 49, 8, 3] }
if = [ { var = "ilm", op = ">=", value = 1 }, { has_named_unit = "ilm", unit = "dt:pilgrim" } ]
then = [ { dialog = "abbey_ilm_home" } ]

[[trigger]]
id = "abbey_ilm_take"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_ilm_meet", choice = "take" }
then = [ { set = "abbey_ilm_met", value = true }, { give_item = "abbey_scripture", to = "named:ilm" } ]

[[trigger]]
id = "abbey_ilm_leave"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_ilm_meet", choice = "leave" }
then = [ { set = "abbey_ilm_met", value = true }, { add = "order", value = 1, min = -5, max = 5 } ]

# The blight east of the abbey: the first step warns, every step curses the army (at most six taints).
[[trigger]]
id = "abbey_blight_warn"
map = "abbey"
when = { event = "hero_enters", at = [56, 28, 14, 14] }
if = [ { var = "abbey_blight_seen", value = false } ]
then = [ { set = "abbey_blight_seen", value = true }, { complete_quest = "abbey_cold" }, { dialog = "abbey_blight" } ]

[[trigger]]
id = "abbey_blight_curse"
map = "abbey"
when = { event = "hero_enters", at = [56, 28, 14, 14] }
once = false
if = [ { var = "taint", op = "<", value = 6 } ]
then = [ { cast_on_army = "dt:spell/terrible_curse", minutes = 480 }, { add = "taint", value = 1 } ]

# The Order's rite: the monks take the curse off the army for a price. Offered whenever the hero
# comes to the abbey tainted.
[[trigger]]
id = "abbey_rite_offer"
map = "abbey"
when = { event = "hero_enters_building", building = "abbey" }
once = false
if = [ { var = "taint", op = ">=", value = 1 } ]
then = [ { dialog = "abbey_rite" } ]

# The dead reach the abbey's walls: the garrison is cursed as they arrive (garrison target).
[[trigger]]
id = "abbey_walls_cursed"
map = "abbey"
when = { event = "army_arrives", army = "dead_wave", at = [52, 44] }
then = [
    { cast_on_army = "dt:spell/terrible_curse", garrison = "abbey", minutes = 600 },
    { dialog = "abbey_walls" },
]

# The siege: from the second week the dead march on the abbey and stop at its south gate, the cell
# (52, 44), four cells south of the abbey. This is the one big battle of the chapter: the dead army's
# `battle = "lua:siege"` (maps/abbey/map.toml) makes it a field battle on the abbey's wall
# (scripts/siege.lua). An AI army attacks only on the hero's step, so the battle is started by the
# story instead: when the dead stand at the gate and the hero is inside the abbey (the garrison
# joins him there, `hero_at` the abbey's footprint). The two triggers below cover either order.
# The first week's warning: the dead gather on the hill, and the diary says so.
[[trigger]]
id = "abbey_siege_warn"
map = "abbey"
when = { event = "week_start" }
if = [ { var = "abbey_week", op = ">=", value = 1 }, { var = "abbey_siege", value = false }, { army_alive = "dead_wave" } ]
then = [ { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.gather" } ]

# The siege starts the midnight after the trial is judged (the player's act, not the calendar), or in the
# second week if Ольховка was never reached. Both say the same: the dead march on the gate.
[[trigger]]
id = "abbey_siege_start"
map = "abbey"
when = { event = "day_start" }
if = [
    { var = "abbey_siege_due", value = true },
    { var = "abbey_siege", value = false },
    { army_alive = "dead_wave" },
]
then = [
    { set = "abbey_siege", value = true },
    { dialog = "abbey_siege" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.siege" },
    { army_goal = "dead_wave", go_to = [52, 44] },
]

[[trigger]]
id = "abbey_siege_week"
map = "abbey"
when = { event = "week_start" }
if = [
    { var = "abbey_week", op = ">=", value = 2 },
    { var = "abbey_siege", value = false },
    { army_alive = "dead_wave" },
]
then = [
    { set = "abbey_siege", value = true },
    { dialog = "abbey_siege" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.siege" },
    { army_goal = "dead_wave", go_to = [52, 44] },
]

# The dead at the gate while the hero stands in the abbey: the siege battle.
[[trigger]]
id = "abbey_siege_meet"
map = "abbey"
when = { event = "army_arrives", army = "dead_wave", at = [52, 44] }
if = [
    { var = "abbey_siege", value = true },
    { var = "abbey_siege_fight", value = false },
    { hero_at = [49, 39, 2, 2] },
]
then = [ { set = "abbey_siege_fight", value = true }, { start_battle = "dead_wave", rules = "lua:siege" } ]

# The hero walks into the abbey while the dead wait at the gate: the siege battle.
[[trigger]]
id = "abbey_siege_enter"
map = "abbey"
when = { event = "hero_enters_building", building = "abbey" }
if = [
    { var = "abbey_siege", value = true },
    { var = "abbey_siege_fight", value = false },
    { army_at = "dead_wave", at = [52, 44] },
]
then = [ { set = "abbey_siege_fight", value = true }, { start_battle = "dead_wave", rules = "lua:siege" } ]

[[trigger]]
id = "abbey_siege_won"
map = "abbey"
when = { event = "army_defeated", army = "dead_wave" }
if = [ { var = "abbey_siege", value = true } ]
then = [ { add = "order", value = 2, min = -5, max = 5 } ]

# The dead wave beaten (at the siege, or earlier on its patrol): the three endings read Ilm's path.
# Each sets abbey_done and ends the chapter. They run after abbey_siege_won, which only adds standing.
[[trigger]]
id = "abbey_end_inquisitor"
map = "abbey"
when = { event = "army_defeated", army = "dead_wave" }
if = [ { var = "ilm", value = 1 }, { var = "abbey_alder", value = 1 } ]
then = [ { set = "abbey_done", value = true }, { complete_quest = "abbey_hold" }, { dialog = "abbey_end_inquisitor" }, { victory = true } ]

[[trigger]]
id = "abbey_end_heretic"
map = "abbey"
when = { event = "army_defeated", army = "dead_wave" }
if = [ { var = "ilm", value = 2 } ]
then = [ { set = "abbey_done", value = true }, { complete_quest = "abbey_hold" }, { dialog = "abbey_end_heretic" }, { victory = true } ]

[[trigger]]
id = "abbey_end_plain"
map = "abbey"
when = { event = "army_defeated", army = "dead_wave" }
if = [ { var = "ilm", op = "!=", value = 2 }, { var = "abbey_alder", op = "!=", value = 1 } ]
then = [ { set = "abbey_done", value = true }, { complete_quest = "abbey_hold" }, { dialog = "abbey_end_plain" }, { victory = true } ]

# The Crown's watch taken: the Crown's standing falls.
[[trigger]]
id = "abbey_watch_taken"
map = "abbey"
when = { event = "building_captured", building = "watch" }
then = [ { add = "crown", value = -2, min = -5, max = 5 } ]

# Ольховка: the trial, once, with Brother Ilm at the hero's side (the named pilgrim). Ilm may be a novice
# (0) or the inquisitor the shrine's cleanse made (1): the inquisitor's crossroads is the way to the heresy,
# since the council's Order choice needs the cleanse's standing (the shrine's take closes it).
[[trigger]]
id = "abbey_trial"
map = "abbey"
when = { event = "hero_enters", at = [14, 58, 8, 8] }
if = [ { var = "ilm", op = "<=", value = 1 }, { has_named_unit = "ilm", unit = "dt:pilgrim" } ]
then = [ { dialog = "abbey_trial" } ]

[[trigger]]
id = "abbey_trial_burn"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_trial", choice = "burn" }
then = [
    { add = "villages_burned", value = 1 },
    { set = "ilm", value = 1 },
    { set = "abbey_alder", value = 1 },
    { set = "abbey_siege_due", value = true },
    { add = "order", value = 2, min = -5, max = 5 },
    { add = "crown", value = -1, min = -5, max = 5 },
    { complete_quest = "abbey_alder" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.warn" },
]

[[trigger]]
id = "abbey_trial_spare"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_trial", choice = "spare" }
then = [
    { set = "ilm", value = 2 },
    { set = "abbey_alder", value = 2 },
    { set = "abbey_siege_due", value = true },
    { add = "order", value = -2, min = -5, max = 5 },
    { complete_quest = "abbey_alder" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.warn" },
]

# Ride past: no judgement, no mercy. The dead still come, and the chapter's plain ending is this one.
[[trigger]]
id = "abbey_trial_ride"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_trial", choice = "ride" }
then = [
    { set = "abbey_alder", value = 3 },
    { set = "abbey_siege_due", value = true },
    { complete_quest = "abbey_alder" },
    { quest = "abbey_hold", title = "quest.abbey_hold.title", text = "quest.abbey_hold.warn" },
]

# The heresy's secret dialog: a midnight after the mercy, with Ilm still in the army. Once.
[[trigger]]
id = "abbey_heresy_offer"
map = "abbey"
when = { event = "day_start" }
if = [ { var = "ilm", value = 2 }, { has_named_unit = "ilm", unit = "dt:pilgrim" } ]
then = [ { dialog = "abbey_heresy" } ]

[[trigger]]
id = "abbey_heresy_accept"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_heresy", choice = "accept" }
then = [ { add = "taint", value = 1 } ]

# The heretic's path wears on the army: each week of it leaves a little taint.
[[trigger]]
id = "abbey_heretic_week"
map = "abbey"
when = { event = "week_start" }
once = false
if = [ { var = "ilm", value = 2 } ]
then = [ { add = "taint", value = 1 } ]

# Ilm's zeal on the inquisitor's path: the Order pays alms to the army each week.
[[trigger]]
id = "abbey_zeal_week"
map = "abbey"
when = { event = "week_start" }
once = false
if = [ { var = "ilm", value = 1 } ]
then = [ { give_gold = 10 } ]

# The Order's verdict: a tainted army in the Order's disfavour is judged at the abbey's gate.
[[trigger]]
id = "abbey_inquisition"
map = "abbey"
when = { event = "day_start" }
if = [ { var = "taint", op = ">=", value = 4 }, { var = "order", op = "<=", value = -2 } ]
then = [ { army_goal = "inquisitors", attack = "hero" }, { dialog = "abbey_inquisition" } ]

[[trigger]]
id = "abbey_inquisitors_fall"
map = "abbey"
when = { event = "army_defeated", army = "inquisitors" }
then = [ { add = "order", value = -3, min = -5, max = 5 } ]

# The Order's favour: at 3 standing the monks give gold, once.
[[trigger]]
id = "abbey_favour"
map = "abbey"
when = { event = "var_changed", var = "order" }
if = [ { var = "order", op = ">=", value = 3 } ]
then = [ { give_gold = 40 } ]

# The rite's gift: the monks hand over holy water when the curse is taken off (see the dialog).
[[trigger]]
id = "abbey_rite_done"
map = "abbey"
when = { event = "dialog_choice", dialog = "abbey_rite", choice = "rite" }
then = [ { give_item = "abbey_water", to = "pack" } ]

# A tainted army that goes unshriven for a week loses the Order's trust a little each week.
[[trigger]]
id = "abbey_taint_week"
map = "abbey"
when = { event = "week_start" }
once = false
if = [ { var = "taint", op = ">=", value = 3 } ]
then = [ { add = "order", value = -1, min = -5, max = 5 } ]

# Ольховка taken by force: it burns, and the Order counts it.
[[trigger]]
id = "abbey_alder_taken"
map = "abbey"
when = { event = "building_captured", building = "alder" }
then = [ { add = "villages_burned", value = 1 }, { add = "order", value = -1, min = -5, max = 5 } ]

# The abbey's gate in the Order's favour: the monks give alms, once.
[[trigger]]
id = "abbey_alms"
map = "abbey"
when = { event = "hero_enters_building", building = "abbey" }
if = [ { var = "order", op = ">=", value = 2 } ]
then = [ { give_gold = 15 } ]

# The dead take the Order's abbey (a garrison of the Order): the taint spreads through the army.
[[trigger]]
id = "abbey_lost"
map = "abbey"
when = { event = "building_lost", building = "abbey" }
then = [ { add = "taint", value = 1 } ]

# The sim's end of the chapter (`razdor-pack sim --auto-win-after`: the hero does not walk, so the
# chapter's own ending does not come). The flag is set as the real ending sets it; the game never
# raises sim_victory.
[[trigger]]
id = "abbey_sim_end"
map = "abbey"
when = { event = "sim_victory" }
then = [ { set = "abbey_done", value = true } ]
