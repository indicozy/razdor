# ---- trust and the camp's end ------------------------------------------------------------------------

# The companies name the hero their captain once they trust him: gold, once.
[[trigger]]
id = "camp_trust"
map = "camp"
when = { event = "var_changed", var = "companies" }
if = [ { var = "companies", op = ">=", value = 3 } ]
then = [ { give_gold = 30 }, { dialog = "camp_trust" } ]

# The relief beaten: the chapter ends by Kord's state. Four endings, the first that holds wins.
[[trigger]]
id = "camp_end_friend"
map = "camp"
when = { event = "army_defeated", army = "camp_relief" }
if = [ { var = "kord", value = 3 } ]
then = [ { set = "camp_done", value = true }, { complete_quest = "camp_hold" }, { dialog = "camp_end_friend" }, { victory = true } ]

[[trigger]]
id = "camp_end_hired"
map = "camp"
when = { event = "army_defeated", army = "camp_relief" }
if = [ { var = "kord", value = 1 } ]
then = [ { set = "camp_done", value = true }, { complete_quest = "camp_hold" }, { dialog = "camp_end_hired" }, { victory = true } ]

[[trigger]]
id = "camp_end_betrayed"
map = "camp"
when = { event = "army_defeated", army = "camp_relief" }
if = [ { var = "kord", value = 2 } ]
then = [ { set = "camp_done", value = true }, { complete_quest = "camp_hold" }, { dialog = "camp_end_betrayed" }, { victory = true } ]

# Kept as the fallback: no route enters the camp with Kord unmet (the hub's Companies need him hired).
[[trigger]]
id = "camp_end_alone"
map = "camp"
when = { event = "army_defeated", army = "camp_relief" }
if = [ { var = "kord", value = 0 } ]
then = [ { set = "camp_done", value = true }, { complete_quest = "camp_hold" }, { dialog = "camp_end_alone" }, { victory = true } ]

# Kord as a friend: his company shares its purse with the hero, once.
[[trigger]]
id = "camp_friend_gift"
map = "camp"
when = { event = "var_changed", var = "kord" }
if = [ { var = "kord", value = 3 } ]
then = [ { give_gold = 30 } ]

# Oakford taken: the Crown's town falls, and the Crown's standing with it.
[[trigger]]
id = "camp_oakford_taken"
map = "camp"
when = { event = "building_captured", building = "oakford" }
then = [ { add = "crown", value = -2, min = -5, max = 5 } ]

# The sim's end of the chapter (`razdor-pack sim --auto-win-after`: the hero does not walk, so the
# chapter's own ending does not come). The flag is set as the real ending sets it; the game never
# raises sim_victory.
[[trigger]]
id = "camp_sim_end"
map = "camp"
when = { event = "sim_victory" }
then = [ { set = "camp_done", value = true } ]
