# Chapter 3в «Лагерь рот» (the Free Companies, ally = 3): the variables and the triggers of the map
# `camp`. Every trigger names its map. Triggers that share a moment run in file order, and each
# condition reads the state the earlier ones left.
#
# The hub sends the hero here only once Kord is hired (kord 1 or 3): his men walk in the hero's squad from the
# hub on, so the camp has no Kord offer of its own. Kord's price is the loot of the Crown's column (`camp_loot_*`):
# split it and he is a friend (kord 3), keep it and he turns (kord 2) with his men against the hero.
#
# The relief: the Crown's guard is sighted when the hero has settled both big matters (the red company and the
# Crown's column: `camp_deeds` 2), or three weeks pass (the backstop). The sighting is a warning: the guard
# marches the day after, to the hall's yard. The diary says so at each step.
#
# The duel: Varga fights the captain of the Crown's guard. The engine has no test for "the named
# unit is gone", so the duel is read in two steps: the win (Varga is still with the hero) comes first
# in this file; a duel that ends with no Varga in the army sets varga_alive = false.

[vars]
camp_week = 0              # weeks since the chapter began
camp_duel = false          # Varga has accepted the duel with the captain
camp_deeds = 0             # the two acts: the Crown's column struck, the red company bought (2 sights the relief)
relief = 0                 # the Crown's relief: 0 not yet, 1 sighted (marches tomorrow), 2 marching or here

# The start: the companies patrol the lowland, the Crown's supply column comes to the ambush point. The hero
# is healed and the army's dead are raised: the camp starts with the squad he carries, whole.
[[trigger]]
id = "camp_arrival"
map = "camp"
when = { event = "game_start" }
then = [
    { restore_army = "player" },
    { quest = "camp_hold", title = "camp.quest.hold.title", text = "camp.quest.hold.text" },
    { quest = "supply", title = "camp.quest.supply.title", text = "camp.quest.supply.text" },
    { dialog = "camp_arrival" },
    { army_goal = "supply", go_to = [60, 71] },
]

# The companies' post: a player's garrison is his troops there (never paid), and an army takes a building
# with no garrison it can see (the red company walked in on day 2 of the camp). The post gets its men as
# a garrison the AI sees.
[[trigger]]
id = "camp_post_garrison"
map = "camp"
when = { event = "game_start" }
then = [ { add_units = "post", troops = ["dt:swordsman", "dt:crossbowman"], of = "building" } ]

[[trigger]]
id = "camp_week"
map = "camp"
when = { event = "week_start" }
once = false
then = [ { add = "camp_week", value = 1 } ]

# Kord's men are paid while they walk in the companies' ranks: ten gold each week.
[[trigger]]
id = "camp_upkeep"
map = "camp"
when = { event = "week_start" }
once = false
if = [ { var = "kord", op = ">=", value = 1 }, { var = "kord", op = "!=", value = 2 } ]
then = [ { give_gold = -10 } ]

# ---- the relief: sighted by the two acts (or the third week), marching the day after ----------------

# The day after the sighting: the guard comes to the hall's yard. Before the sighting trigger in file order, so
# the warning and the march never fall on the same day.
[[trigger]]
id = "camp_relief_march"
map = "camp"
when = { event = "day_start" }
once = false
if = [ { var = "relief", value = 1 } ]
then = [
    { set = "relief", value = 2 },
    { quest = "camp_hold", title = "camp.quest.hold.title", text = "camp.quest.hold.here" },
    {
        spawn_army = "camp_relief",
        at = [94, 8],
        faction = "enemy",
        model = 5,
        troops = ["dt:halberdier", "dt:mounted_sergeant", "dt:guardsman"],
    },
    # Up to the hall's yard, not into the tavern: an army sheltered in a tavern cannot be engaged, and the
    # chapter would never end (the relief waits in the open, beside the hall).
    { army_goal = "camp_relief", go_to = [60, 58] },
    { dialog = "camp_relief" },
]

# The sighting by the deeds: the column struck and the red company bought (`camp_deeds` 2). Letting the column
# pass or leaving the red company is no act.
[[trigger]]
id = "camp_relief_sighted"
map = "camp"
when = { event = "day_start" }
once = false
if = [ { var = "relief", value = 0 }, { var = "camp_deeds", op = ">=", value = 2 } ]
then = [
    { set = "relief", value = 1 },
    { quest = "camp_hold", title = "camp.quest.hold.title", text = "camp.quest.hold.warned" },
    { dialog = "camp_relief_warn" },
]

# The sighting by the clock: the third week, if the hero has not settled the matters.
[[trigger]]
id = "camp_relief_clock"
map = "camp"
when = { event = "week_start" }
once = false
if = [ { var = "relief", value = 0 }, { var = "camp_week", op = ">=", value = 3 } ]
then = [
    { set = "relief", value = 1 },
    { quest = "camp_hold", title = "camp.quest.hold.title", text = "camp.quest.hold.warned" },
    { dialog = "camp_relief_warn" },
]

# The Crown in bad standing sends a bounty company to the stony hills.
[[trigger]]
id = "camp_bounty"
map = "camp"
when = { event = "var_changed", var = "crown" }
if = [ { var = "crown", op = "<=", value = -3 } ]
then = [
    {
        spawn_army = "camp_bounty",
        at = [88, 14],
        faction = "enemy",
        model = 5,
        troops = ["dt:guardsman", "dt:guardsman", "dt:archer"],
    },
]

# ---- the red company: bought (100 gold) or left, it is one of the two big matters -------------------

# The red company's offer, at its camp by the east road.
[[trigger]]
id = "camp_red_offer"
map = "camp"
when = { event = "hero_enters", at = [72, 42, 8, 8] }
then = [ { quest = "red", title = "camp.quest.red.title", text = "camp.quest.red.text" }, { dialog = "camp_red" } ]

[[trigger]]
id = "camp_red_buy"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_red", choice = "buy" }
then = [
    { set_faction = "red_company", faction = "player" },
    { set_relation = "red_company", towards = "enemy", value = 3 },
    { add = "companies", value = 1, min = -5, max = 5 },
    { add = "camp_deeds", value = 1 },
    { complete_quest = "red" },
]

[[trigger]]
id = "camp_red_leave"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_red", choice = "leave" }
then = [ { complete_quest = "red" } ]

[[trigger]]
id = "camp_oakford_flip"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_red", choice = "buy" }
then = [
    { set_faction = "oakford", faction = "ally", of = "building" },
    { set_relation = "oakford", towards = "enemy", value = 3, of = "building" },
]

# ---- the duel: Varga, halberdier of the hero's army, against the captain in the arena ---------------

[[trigger]]
id = "camp_duel_offer"
map = "camp"
when = { event = "hero_enters", at = [80, 80, 8, 8] }
if = [
    { var = "camp_duel", value = false },
    { var = "varga_alive", value = true },
    { has_named_unit = "varga", unit = "dt:halberdier" },
]
then = [ { quest = "duel", title = "camp.quest.duel.title", text = "camp.quest.duel.text" }, { dialog = "camp_duel" } ]

[[trigger]]
id = "camp_duel_accept"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_duel", choice = "accept" }
then = [ { set = "camp_duel", value = true }, { army_goal = "duel_captain", attack = "hero" } ]

[[trigger]]
id = "camp_duel_refuse"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_duel", choice = "refuse" }
then = [ { complete_quest = "duel" } ]

# The win: Varga is still in the army. Her axe is the captain's, and the Companies talk of her.
[[trigger]]
id = "camp_duel_won"
map = "camp"
when = { event = "army_defeated", army = "duel_captain" }
if = [ { var = "camp_duel", value = true }, { has_named_unit = "varga", unit = "dt:halberdier" } ]
then = [
    { set = "camp_duel", value = false },
    { give_item = "camp_axe", to = "named:varga" },
    { add = "companies", value = 1, min = -5, max = 5 },
    { complete_quest = "duel" },
    { dialog = "camp_duel_won" },
]

# The loss: the duel's captain is beaten, and Varga is not in the army any more. She has fallen.
[[trigger]]
id = "camp_duel_lost"
map = "camp"
when = { event = "army_defeated", army = "duel_captain" }
if = [ { var = "camp_duel", value = true }, { has_named_unit = "varga", unit = "dt:halberdier", value = false } ]
then = [
    { set = "camp_duel", value = false },
    { set = "varga_alive", value = false },
    { complete_quest = "duel" },
    { dialog = "camp_duel_lost" },
]

# ---- the Crown's column: the hit or the pass is the second big matter -------------------------------

# The Crown's supply column reaches the ambush point: the hit, or the column goes on.
[[trigger]]
id = "camp_raid_open"
map = "camp"
when = { event = "army_arrives", army = "supply", at = [60, 71] }
then = [ { dialog = "camp_raid" } ]

# The hit: the companies come out of the camp's waygate and fall on the column. Kord's men are in the hero's
# squad, so the hit is the hero's fight: the column is sent at him, and it is beaten by the squad or the hero
# loses as in any battle.
[[trigger]]
id = "camp_raid_hit"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_raid", choice = "hit" }
then = [ { army_goal = "supply", attack = "hero" }, { add = "camp_deeds", value = 1 }, { complete_quest = "supply" } ]

[[trigger]]
id = "camp_raid_pass"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_raid", choice = "pass" }
then = [
    { add = "crown", value = 1, min = -5, max = 5 },
    { army_goal = "supply", clear = true },
    { complete_quest = "supply" },
]

# The column beaten: a caravan lost to the Crown, the companies gain, the Crown loses.
[[trigger]]
id = "camp_raid_won"
map = "camp"
when = { event = "army_defeated", army = "supply" }
then = [
    { add = "crown", value = -1, min = -5, max = 5 },
    { add = "caravans_lost", value = 1 },
    { add = "companies", value = 1, min = -5, max = 5 },
    { give_gold = 40 },
]

# Kord's price: with his company hired, he asks his share of the column's loot. Split it (friend), or keep
# it and he turns on the hero with his men.
[[trigger]]
id = "camp_loot_offer"
map = "camp"
when = { event = "army_defeated", army = "supply" }
if = [ { var = "kord", op = ">=", value = 1 }, { var = "kord", op = "!=", value = 2 } ]
then = [ { dialog = "camp_loot" } ]

[[trigger]]
id = "camp_loot_split"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_loot", choice = "split" }
then = [ { set = "kord", value = 3 }, { add = "companies", value = 1, min = -5, max = 5 } ]

[[trigger]]
id = "camp_loot_keep"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_loot", choice = "keep" }
then = [
    { set = "kord", value = 2 },
    { spawn_army = "kord_band", at = [60, 73], faction = "enemy", model = 5, troops = ["dt:bandit", "dt:bandit", "dt:robber"] },
    { army_goal = "kord_band", attack = "hero" },
    { add = "companies", value = -2, min = -5, max = 5 },
]

# ---- the waygate: lighting it says what it does in chapter 4 ----------------------------------------

# The companies' waygate: the stones can be lit, which opens a gate for chapter 4.
[[trigger]]
id = "camp_gate_offer"
map = "camp"
when = { event = "hero_enters", at = [46, 58, 5, 5] }
then = [ { quest = "gate", title = "camp.quest.gate.title", text = "camp.quest.gate.text" }, { dialog = "camp_gate" } ]

[[trigger]]
id = "camp_gate_light"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_gate", choice = "light" }
then = [ { add = "gates_open", value = 1 }, { add = "companies", value = 1, min = -5, max = 5 }, { complete_quest = "gate" } ]

[[trigger]]
id = "camp_gate_leave"
map = "camp"
when = { event = "dialog_choice", dialog = "camp_gate", choice = "leave" }
then = [ { complete_quest = "gate" } ]

