then = [
    { spawn_army = "bw_king_1", at = [150, 70], faction = "enemy", model = 10, troops = ["dt:deadman", "dt:ghoul", "dt:ghoul"] },
    { army_goal = "bw_king_1", attack = "hero" },
    { add = "taint", value = 1 },
    { dialog = "bw_rises" },
]

[[trigger]]
