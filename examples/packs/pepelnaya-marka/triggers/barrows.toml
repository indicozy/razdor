    { army_goal = "bw_king_3", attack = "hero" },
    { add = "taint", value = 1 },
]

[[trigger]]
id = "bw_host_4"
map = "barrows"
when = { event = "week_start" }
if = [ { var = "dread", op = ">=", value = 10 } ]
then = [
    { spawn_army = "bw_king_4", at = [170, 60], faction = "enemy", model = 10, troops = ["dt:dead_warrior", "dt:dead_warrior", "dt:ghoul"] },
    { army_goal = "bw_king_4", attack = "hero" },
    { add = "taint", value = 1 },
]

[[trigger]]
