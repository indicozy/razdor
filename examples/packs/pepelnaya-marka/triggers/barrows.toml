# Chapter 5 «Курганы», the finale (map `barrows`, 200×200). The Dread decides the King's hosts: each
# threshold sends one more host at the hero (army_goal attack), and each beaten host costs the dead
# a little of their Dread. The hero's allies march on the palace (army_goal go_to) and the Dread falls
# when they arrive. The taint peaks: the King curses the garrisons, then the hero's host; the remedies
# depend on the branch (the Order's rite, the marsh herbs, the Companies' brew) and on Ilm. The
# companions meet their fates on the road (Varga, Tess, Ilm, Kord). The King's throne is the palace on
# the hill: a heretic who heard the wraith (grey_bargain_offered) can kneel there, which is the third
# ending. Otherwise the King's own host is beaten and the council picks the Iron Peace, the Free March,
# or, with neither standing, the fall. The endings are dialogs (`ending = "<dialog-id>"`).

[vars]
bw_iron_ok = false   # the Iron Peace may be chosen: the Crown at 1 or more and the Order at 2 or more
bw_free_ok = false   # the Free March may be chosen: the Companies at 2 or more, or the marsh folk at 3 or more

# The King stands on his step below the palace until the story sends him anything (an AI army would
# wander off it).
[[trigger]]
id = "bw_hold"
map = "barrows"
when = { event = "game_start" }
then = [ { army_goal = "barrow_king", go_to = [166, 36] } ]

# --- The start: the standings decide which endings the council may offer. ---

[[trigger]]
id = "bw_arrive"
map = "barrows"
when = { event = "game_start" }
then = [ { dialog = "bw_arrive" } ]

[[trigger]]
id = "bw_flag_iron"
map = "barrows"
when = { event = "game_start" }
if = [ { var = "crown", op = ">=", value = 1 }, { var = "order", op = ">=", value = 2 } ]
then = [ { set = "bw_iron_ok", value = true } ]

[[trigger]]
id = "bw_flag_free_companies"
map = "barrows"
when = { event = "game_start" }
if = [ { var = "companies", op = ">=", value = 2 } ]
then = [ { set = "bw_free_ok", value = true } ]

[[trigger]]
id = "bw_flag_free_marsh"
map = "barrows"
when = { event = "game_start" }
if = [ { var = "marsh_trust", op = ">=", value = 3 } ]
then = [ { set = "bw_free_ok", value = true } ]

# --- The Dread: one a week, and the taint of the dead's country from dread 8 on. ---

[[trigger]]
id = "bw_dread_week"
map = "barrows"
when = { event = "week_start" }
once = false
then = [ { add = "dread", value = 1 } ]

[[trigger]]
id = "bw_taint_week"
map = "barrows"
when = { event = "week_start" }
if = [ { var = "dread", op = ">=", value = 8 } ]
once = false
then = [ { add = "taint", value = 1 } ]

[[trigger]]
id = "bw_dread_peak"
map = "barrows"
when = { event = "var_changed", var = "dread" }
if = [ { var = "dread", op = ">=", value = 12 } ]
then = [ { add = "taint", value = 1 } ]

[[trigger]]
id = "bw_taint_peak"
map = "barrows"
when = { event = "var_changed", var = "taint" }
if = [ { var = "taint", op = ">=", value = 6 } ]
then = [ { add = "dread", value = 1 } ]

