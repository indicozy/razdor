if = [ { var = "dread", op = ">=", value = 13 } ]
then = [
    { spawn_army = "bw_king_5", at = [110, 160], faction = "enemy", model = 10, troops = ["dt:death_knight", "dt:dead_warrior", "dt:deadman", "dt:ghoul"] },
    { army_goal = "bw_king_5", attack = "hero" },
    { add = "taint", value = 1 },
