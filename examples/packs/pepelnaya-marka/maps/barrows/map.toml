# Chapter 5 «Курганы», 200×200: the finale. The green fields of the south, the river Ash across the
# middle with its one ford under the fort, the burned centre, the marsh and the chapel in the
# south-west, the dunes in the east, and the barrow country in the north-east, where the King's palace
# stands on a stony hill under the snow. terrain.png is painted by
# tools/pepelnaya-marka-terrain-barrows.py. The palace is a neutral building (the hero steps onto it to
# meet the King's offer); the King's own host is the barrow_king army on the step below it. The map's
# own victory is a placeholder that never fires: the chapter ends by the story's `ending` (see
# triggers/barrows.toml and dialogs/barrows.toml).
title = "barrows.map.title"
description = "barrows.map.description"
start_date = "1301-06-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
cell = [100, 192]
classes = ["knight"]
gold = 60
mana = 10
troops = [{ unit = "dt:militiaman", level = 1, count = 3 }]

