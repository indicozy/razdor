# Chapter 3а «Аббатство», 100×100: the ruined abbey on its stony hill in the middle of the March.
# The dead of the barrows (north-east) come for it; the Order's inquisitors come down the north road
# to hold it. The south road is the hero's way in from Marka. terrain.png is painted by
# tools/pepelnaya-marka-terrain-abbey.py. The map's own victory is a placeholder that never fires:
# the chapter ends by the story's `victory` (see triggers/abbey.toml).
title = "abbey.map.title"
description = "abbey.map.description"
start_date = "1300-05-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
