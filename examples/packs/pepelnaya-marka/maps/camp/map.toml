# Chapter 3в «Лагерь рот», 100×100: the Free Companies' camp in the lowland of the middle, with the
# camp's waygate (an obelisk). The Crown's supply road runs across the map from west to east and
# the Crown's relief comes from the north-east. Oakford, the town of the red company's side, lies
# in the west. terrain.png is painted by tools/pepelnaya-marka-terrain-camp.py. The map's own
# victory is a placeholder that never fires: the chapter ends by the story's `victory` (see
# triggers/camp.toml).
title = "camp.map.title"
description = "camp.map.description"
start_date = "1300-05-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
cell = [94, 72]
classes = ["knight"]
gold = 150
mana = 10
troops = [
    { unit = "dt:militiaman", level = 1, count = 3 },
    { unit = "dt:archer", level = 1, count = 2 },
]

# Forest in the north-west, dead trees around the camp, the hills and stones of the north-east.
[[object]]
kind = "trees"
cell = [8, 6]
[[object]]
