# The camp's waygate, the companies' hall, and Oakford (the town the red company can turn).
[[building]]
id = "waygate"
type = "obelisk"
name = "camp.building.waygate.name"
description = "camp.building.waygate.description"
cell = [48, 60]
faction = "neighbour"

[[building]]
id = "hall"
type = "tavern"
name = "camp.building.hall.name"
description = "camp.building.hall.description"
cell = [56, 56]
faction = "neighbour"

[[building]]
id = "oakford"
type = "town"
name = "camp.building.oakford.name"
description = "camp.building.oakford.description"
cell = [20, 40]
faction = "enemy"
income = 30
garrison = [
    { unit = "dt:guardsman", level = 1, count = 2 },
    { unit = "dt:archer", level = 1, count = 1 },
]

# Kord's company, roaming the lowland's west edge until the hero comes to it or it turns.
[[army]]
id = "kord_band"
name = "camp.army.kord_band.name"
cell = [30, 52]
faction = "neighbour"
model = "bandits"
gold = 50
troops = [
    { unit = "dt:bandit", level = 1, count = 3 },
    { unit = "dt:robber", level = 1, count = 2 },
]

# The red company, camped east of the lowland: it can be bought.
[[army]]
id = "red_company"
name = "camp.army.red_company.name"
cell = [76, 46]
faction = "neighbour"
model = "bandits"
gold = 40
troops = [
    { unit = "dt:marauder", level = 1, count = 3 },
    { unit = "dt:brigand", level = 1, count = 2 },
]

# The Crown's supply column on the road: the story sends it to the ambush point.
[[army]]
id = "supply"
name = "camp.army.supply.name"
cell = [14, 71]
faction = "enemy"
model = "feudal"
gold = 120
troops = [
    { unit = "dt:guardsman", level = 1, count = 3 },
    { unit = "dt:archer", level = 1, count = 2 },
]

# The captain of the Crown's guard in the arena: he fights the duel when Varga accepts.
[[army]]
id = "duel_captain"
name = "camp.army.duel_captain.name"
cell = [84, 84]
faction = "enemy"
model = "feudal"
leader = { unit = "dt:captain_of_the_guard", level = 2, name = "camp.captain.name" }
troops = [{ unit = "dt:guardsman", level = 1, count = 2 }]

# The placeholder of the map's victory: it stays inactive (the story ends the chapter).
[[army]]
id = "unmarked"
name = "camp.army.unmarked.name"
cell = [6, 6]
faction = "enemy"
model = "inactive"
troops = [{ unit = "dt:death_knight", level = 1, count = 1 }]

# A lantern at the camp's centre, lit from the start.
[[point]]
cell = [50, 62]
radius = 3
active = true

[victory]
kind = "defeat_army"
army = "unmarked"
message = "camp.map.won"
