# Chapter 4 «Врата», 100×100: the four waygates of the March on their stony rings, the road from the
# south with a branch to each, the marsh and the reedmere island in the south-west, the grass in the
# north-west, the burned east, and the snow-bound barrow corner in the north-east. terrain.png is
# painted by tools/pepelnaya-marka-terrain-gates.py. The waygates are obelisks (neutral buildings):
# the hero steps onto one to choose a stone (triggers/gates.toml). The map's own victory is a
# placeholder that never fires (the sealed host lies in the snow); the chapter ends by the story's
# `victory` (after the last gate is shut or taken).
title = "gates.map.title"
description = "gates.map.description"
start_date = "1301-02-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
cell = [50, 94]
classes = ["knight"]
gold = 60
mana = 10
troops = [{ unit = "dt:militiaman", level = 1, count = 3 }]

