# Chapter 3б «Солончаки», 100×100: the salt marsh of the west and the salt flats of the east.
# A causeway runs north through the marsh from the smugglers' way to the watch; the marsh folk
# keep Reedmere on its dry island and the witch her hut on the next. The Salt Gate on the flats
# guards the Crown's salt. terrain.png is painted by tools/pepelnaya-marka-terrain-salt.py. The
# map's own victory is a placeholder that never fires: the chapter ends by the story's `victory`
# (see triggers/salt.toml).
title = "salt.map.title"
description = "salt.map.description"
start_date = "1300-05-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
cell = [88, 84]
classes = ["knight"]
gold = 60
mana = 10
troops = [
    { unit = "dt:militiaman", level = 1, count = 3 },
    { unit = "dt:archer", level = 1, count = 2 },
]

