# Chapter 2 «Марка», 100×100: the hub the campaign returns to. The river Pepelka runs from north to
# south with three fords (north, middle, south). West of it: the ruined abbey in the north-west, the
# shrine by the old road, the salt marsh with the marsh folk's village Серые Ивы in the south-west.
# East of it: the garrison town Пепельный Брод at the middle ford, the mill village north-east of it,
# the barrow hills in the north-east, and the Free Companies' camp in the south-east. Four waygate
# stones: north-west, north-east (the barrows), south-west (the marsh) and south-east (the camp).
# terrain.png is painted by tools/pepelnaya-marka-terrain-marka.py.
#
# The map's own victory is a reach cell that no hero can step on (inside the snowdrifts). The chapter
# ends by the story's council (`victory` in triggers/marka.toml), when the player picks an ally.
title = "marka.map.title"
description = "marka.map.description"
start_date = "1300-05-01"
relations = [[3, 3, 0, -3], [3, 3, 0, -3], [0, 0, 3, -3], [-3, -3, -3, 3]]

[hero]
cell = [61, 46]
classes = ["knight"]
gold = 80
mana = 10
troops = [{ unit = "dt:militiaman", level = 1, count = 3 }]

