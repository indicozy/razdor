# The Order's route, from the start of the campaign to its ending (playthrough_campaign.rs, Plan::Order):
# chapter 1 on the prepared route, the hub's council sends the hero to the abbey, the siege is won, the hub's
# revisit, the gates by the Order's own means, the barrows by the King's road.
campaign = true
seeds = 15
min_rate = 0.8
# The option «Обход армий на пути» (the route goes round the armies), on from the first hand-over: the
# campaign's own maps are played so (the armies would stop the walks otherwise).
avoid_armies = true

# The choices, given at the start: each is answered when its dialog opens (the hero's own).
# Chapter 1's choices (the side-quest route): the barrow left, the deserters handed to the Crown, the refugees
# taken to Reedmere, the marsh folk helped, Varga joins, the toll talked away.
[[step]]
choose = { dialog = "varga_meet", choice = "join" }
[[step]]
choose = { dialog = "toll", choice = "talk" }
[[step]]
choose = { dialog = "marsh_plea", choice = "help" }
[[step]]
choose = { dialog = "barrow", choice = "leave" }
[[step]]
choose = { dialog = "refugees", choice = "take" }
[[step]]
choose = { dialog = "deserters", choice = "hand" }
# The hub «Марка»: the arrival, the shrine, the marsh folk's offer, the council's Order.
[[step]]
choose = { dialog = "marka_arrival", choice = "take" }
[[step]]
choose = { dialog = "shrine_inside", choice = "cleanse" }
[[step]]
choose = { dialog = "shrine_offer", choice = "accept" }
[[step]]
choose = { dialog = "marsh_offer", choice = "accept" }
[[step]]
choose = { dialog = "council", choice = "order" }
# The abbey's siege and the gates' and barrows' answers are the defaults, except the barrows' King.
[[step]]
choose = { dialog = "bw_council", choice = "iron" }

# Chapter 1 «Брод» on the side-quest route (the campaign's own, playthrough_campaign.rs chapter_one): the
# hanged man's note and the farm, the tower and its recruits, the scout's letter, Varga, the toll talked away,
