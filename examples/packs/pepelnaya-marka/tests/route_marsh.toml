# The marsh folk's route (playthrough_campaign.rs, Plan::Marsh): Tess and the disguise, the salt road, Varga's
# halberd at the south gate, the Free March: the ending «free».
campaign = true
seeds = 15
min_rate = 0.8
# The option «Обход армий на пути» (the route goes round the armies), on from the first hand-over: the
# campaign's own maps are played so (the armies would stop the walks otherwise).
avoid_armies = true

# Chapter 1's choices (the side-quest route): the barrow left, the deserters handed to the Crown, the refugees
# taken to Reedmere, the marsh folk helped, Varga joins, the toll talked away.
[[step]]
choose = { dialog = "varga_meet", choice = "join" }
[[step]]
choose = { dialog = "toll", choice = "talk" }
[[step]]
choose = { dialog = "marsh_plea", choice = "help" }
[[step]]
choose = { dialog = "barrow", choice = "leave" }
[[step]]
choose = { dialog = "refugees", choice = "take" }
[[step]]
choose = { dialog = "deserters", choice = "hand" }
# The hub «Марка»: the arrival, the shrine, the marsh folk's offer, the council's marsh folk.
[[step]]
choose = { dialog = "marka_arrival", choice = "take" }
[[step]]
choose = { dialog = "shrine_inside", choice = "cleanse" }
[[step]]
choose = { dialog = "shrine_offer", choice = "accept" }
[[step]]
choose = { dialog = "marsh_offer", choice = "accept" }
[[step]]
choose = { dialog = "council", choice = "marsh" }
# The gates: Varga's halberd opens the south gate; the Free March at the barrows' council.
[[step]]
choose = { dialog = "gt_closed_s", choice = "varga" }
[[step]]
choose = { dialog = "bw_council", choice = "free" }

