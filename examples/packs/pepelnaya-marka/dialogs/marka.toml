# Chapter 2 «Марка»: the dialogs of the hub. A choice's actions run when it is picked; a choice with no
# actions of its own is followed by its `dialog_choice` trigger in triggers/marka.toml, which does the
# rest (set the quest, end the chapter, travel). Texts: the `marka.*` keys in texts/<lang>.toml.

# The hero rides in from the ford, wounded: the Crown's surgeon in Ashford sends a healing draught.
[[dialog]]
id = "marka_arrival"
title = "marka.arrival.title"
text = "marka.arrival.text"
speaker = "dt:monk"

[[dialog.choice]]
id = "take"
text = "marka.arrival.take"
then = [ { give_item = "crown_draught", to = "pack" } ]

# The captain of the Crown's garrison, when the hero first rides into the town.
[[dialog]]
id = "captain"
title = "marka.captain.title"
text = "marka.captain.text"
speaker = "dt:halberdier"

[[dialog.choice]]
id = "serve"
text = "marka.captain.serve"
then = [ { add = "crown", value = 1, min = -5, max = 5 }, { complete_quest = "power_crown" } ]

[[dialog.choice]]
id = "alone"
text = "marka.captain.alone"
then = [ { add = "crown", value = -1, min = -5, max = 5 }, { complete_quest = "power_crown" } ]

[[dialog.choice]]
id = "gold"
text = "marka.captain.gold"
then = [ { give_gold = 20 }, { add = "crown", value = -1, min = -5, max = 5 }, { complete_quest = "power_crown" } ]

# The Order's monk at the shrine's gate: the first envoy's offer.
[[dialog]]
id = "shrine_offer"
title = "marka.shrine_offer.title"
text = "marka.shrine_offer.text"
speaker = "dt:monk"

[[dialog.choice]]
id = "accept"
text = "marka.shrine_offer.accept"

[[dialog.choice]]
id = "refuse"
text = "marka.shrine_offer.refuse"

# Inside the shrine, once the guards are beaten: the quest's choice, and Brother Ilm joins.
[[dialog]]
id = "shrine_inside"
title = "marka.shrine_inside.title"
text = "marka.shrine_inside.text"
speaker = "dt:pilgrim"

[[dialog.choice]]
id = "cleanse"
text = "marka.shrine_inside.cleanse"
then = [
    { remove_spells = "garrison", garrison = "shrine" },
    { give_unit = "dt:pilgrim", named = "ilm" },
    { set = "ilm", value = 1 },
    { give_item = "ash_seal" },
    { add = "order", value = 2, min = -5, max = 5 },
    { set = "order_quest", value = 2 },
    { add = "quests_done", value = 1 },
]

[[dialog.choice]]
id = "take"
text = "marka.shrine_inside.take"
then = [
    { give_unit = "dt:pilgrim", named = "ilm" },
    { set = "ilm", value = 2 },
    { cast_on_army = "dt:spell/terrible_curse", in = "player", permanent = true },
    { add = "taint", value = 2 },
    { add = "order", value = -2, min = -5, max = 5 },
    { add = "dread", value = 1 },
    { set = "order_quest", value = 2 },
    { add = "quests_done", value = 1 },
]

# The waygate's ritual at the barrow stone: the Order's seal opens it, and the hero goes through.
[[dialog]]
id = "ritual_offer"
title = "marka.ritual_offer.title"
text = "marka.ritual_offer.text"
speaker = "dt:pilgrim"

[[dialog.choice]]
id = "open"
text = "marka.ritual_offer.open"
if = [ { has_item = "ash_seal" } ]

[[dialog.choice]]
id = "walk"
text = "marka.ritual_offer.walk"

# The marsh folk's plea, at the edge of the marsh: the second envoy's offer.
[[dialog]]
id = "marsh_offer"
title = "marka.marsh_offer.title"
text = "marka.marsh_offer.text"
speaker = "dt:hunter"

[[dialog.choice]]
id = "accept"
text = "marka.marsh_offer.accept"

[[dialog.choice]]
id = "later"
text = "marka.marsh_offer.later"

# Tess joins the hero after the wraiths are beaten (the trigger gives her to the army).
[[dialog]]
id = "tess_join"
title = "marka.tess_join.title"
text = "marka.tess_join.text"
speaker = "dt:hunter"

# Kord's company: hire it for gold, betray Kord to the Crown, or walk away.
[[dialog]]
id = "kord_offer"
title = "marka.kord_offer.title"
text = "marka.kord_offer.text"
speaker = "dt:bandit"

[[dialog.choice]]
id = "hire"
text = "marka.kord_offer.hire"
if = [ { gold = 40, op = ">=" } ]

[[dialog.choice]]
id = "betray"
text = "marka.kord_offer.betray"

[[dialog.choice]]
id = "walk"
text = "marka.kord_offer.walk"

# The council: two envoy quests done. Each ally is offered only when its standing is at least 1.
[[dialog]]
id = "council"
title = "marka.council.title"
text = "marka.council.text"

[[dialog.choice]]
id = "order"
text = "marka.council.order"
if = [ { var = "order", op = ">=", value = 1 } ]

[[dialog.choice]]
id = "marsh"
text = "marka.council.marsh"
if = [ { var = "marsh_trust", op = ">=", value = 1 } ]

# The Companies need Kord hired (kord 1, or 3 as a friend): his company is the hero's men.
[[dialog.choice]]
id = "companies"
text = "marka.council.companies"
if = [ { var = "companies", op = ">=", value = 1 }, { var = "kord", op = ">=", value = 1 }, { var = "kord", op = "!=", value = 2 } ]

[[dialog.choice]]
id = "later"
text = "marka.council.later"

