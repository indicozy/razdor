[package]
name = "razdor-server"
version = "0.1.2"
edition = "2021"
authors = ["@indicozy"]
license = "GPL-3.0-only"
publish = false
description = "Razdor's API: analytics, crash reports, battle records, cloud saves and the admin dashboard."

[dependencies]
razdor-wire = { path = "../crates/wire" }
argon2 = "0.5"
axum = "0.8"
getrandom = "0.3"
libc = "0.2"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
zstd = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "razdor-server"
path = "src/main.rs"

# The load test: hammers a running server with fake installs (not part of the service).
[[example]]
name = "load"
path = "tools/load.rs"
