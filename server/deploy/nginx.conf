# nginx snippet for api.<domain>: put it in the server block of the API host (the owner's nginx; the
# TLS certificate comes from Let's Encrypt, the DNS record from the owner). Replace <domain> and the
# certificate paths. The service listens on 127.0.0.1:8080 (config `bind`).

# The API host. Only the API's paths reach the service; the rest is 404.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.<domain>;

    ssl_certificate     /etc/letsencrypt/live/api.<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<domain>/privkey.pem;

    # Bodies: the largest is a framed save or battle record (about 8 MB); the service caps each route.
    client_max_body_size 9m;
    client_body_timeout 15s;
    send_timeout 15s;

    # The service reads the client's address from X-Real-IP (trust_proxy = true). nginx sets it from
    # the socket here, so a client cannot supply its own. The service listens on 127.0.0.1 only.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # The admin dashboard: no caching, not indexed (the service also sends noindex).
    location /admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    # No access log: the default one keeps every client's address, and the API keeps none
    # (`2026-11-22-analytics-design.md`). Errors still go to nginx's error log.
    access_log off;
}

# Plain HTTP only redirects.
server {
    listen 80;
    listen [::]:80;
    server_name api.<domain>;
    return 301 https://$host$request_uri;
}
