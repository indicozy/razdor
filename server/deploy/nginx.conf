# nginx site for razdor.indicozy.dev, for the host's own nginx (not a container: nginx serves the owner's
# other sites too). Copy this file to /etc/nginx/conf.d/razdor.conf: it is at http{} level (it holds the
# limit_req_zone), which conf.d includes on every distribution. Then `nginx -t` and `systemctl reload nginx`.
# The certificate must exist first: see server/deploy/README.md, section 5.
#
# Paths on the one domain:
#   /            the website and the wiki at /wiki/ (the root copy of the Pages site, from
#                /var/www/razdor-site/current, written by razdor-mirror)
#   /hub/        the download mirror (static files from /var/www/razdor-hub, later)
#   /api/...     the API: nginx strips /api, so the service sees /v1/... (its routes are at root)
#   /api/admin   the admin dashboard: the service serves it at /admin, so nginx rewrites the cookie path,
#                the redirects and the form links from /admin to /api/admin
#
# The API container publishes 127.0.0.1:8080 only (the quadlet's PublishPort). Nothing else reaches it.

# Per client address, for /api only. Its rate is the service's own per-address flood limit (ip_per_minute =
# 1200 a minute = 20 a second), so nginx never refuses a request the service would have accepted. Many players
# share one address behind carrier NAT (Russia, Kazakhstan); the service keeps the real limits and the bans.
# This zone only stops a flood before it reaches the service.
limit_req_zone $binary_remote_addr zone=razdor_api:10m rate=20r/s;
limit_req_status 429;
# The download mirror's cache headers (section 3.3 of docs/specs/own-mirror-2026-11-24.md). A release's files
# never change, so they are cached a day; everything else (the json, latest/, status.json) is revalidated with
# its ETag. The map is at http level because nginx does not allow a location inside the /hub/ location.
map $uri $hub_cache_control {
    ~^/hub/[^/]+/[^/]+/releases/download/  "public, max-age=86400";
    default                                "no-cache";
}
# The website's cache headers (docs/specs/own-mirror-2026-11-24.md, section 3.5). The wiki's hashed assets
# never change: a year. Pages and the other small text files are revalidated; the rest a day.
map $uri $site_cache_control {
    ~^/wiki/_astro/          "public, max-age=31536000, immutable";
    ~/$                      "no-cache";
    ~\.(html|json|xml|txt)$  "no-cache";
    default                  "public, max-age=86400";
}
# A refused request is logged by nginx with the client's address. Log it at info, which the default error_log
# level (error) drops: the privacy page says the server keeps no addresses in logs. Keep error_log at error or
# above; do not raise it to info or debug.
limit_req_log_level info;
# The API's own log: one line a request, no client address and no user agent, kept 14 days (see
# server/deploy/logrotate). $uri has no query string. The website keeps no access log.
log_format razdor_api '$time_iso8601 $request_method $uri $status $request_time $request_length $bytes_sent "$http_x_razdor_version" "$http_x_razdor_commit"';
# The country of a client for the /hub/ log, from the DB-IP table (server/deploy/geo-update.sh writes the
# include monthly; README section 10). The lookup happens in memory and the address is never written: the
# log gets the two-letter code only. nginx's `ranges` form is IPv4 only, so an IPv6 client gets "ZZ".
geo $remote_addr $razdor_country {
    ranges;
    default ZZ;
    include /etc/nginx/razdor-geo-country.conf;
}
# The download log of /hub/: time, file, status, bytes sent, the file's size (from Content-Range or
# Content-Length) and the country. No address, no user agent. The fold (server/src/downloads.rs) reads it daily
# and keeps 14 days of raw lines (razdor-hub.logrotate).
log_format razdor_hub escape=json '$msec "$uri" $status $body_bytes_sent "$sent_http_content_range" "$sent_http_content_length" $razdor_country';

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name razdor.indicozy.dev;

    ssl_certificate     /etc/letsencrypt/live/razdor.indicozy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/razdor.indicozy.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # HTTPS only for a year, subdomains included as this host has none.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No access log for the website: the default log keeps every client's address. The API has its own log
    # (razdor_api, in the /api locations below) that keeps no addresses. Errors still go to nginx's error log.
    access_log off;

    # The largest body is a save: 8 MB plus its frame header (the service caps each route). Battles are 4 MB.
    client_max_body_size 9m;
    client_body_timeout 15s;
    send_timeout 15s;

    # The website: the root copy of the Pages site (the wiki at /wiki/). razdor-mirror writes each version
    # under /var/www/razdor-site/versions and points `current` at the live one, in one rename. Until its
    # first sync there is no `current`, and the site answers 404.
    root /var/www/razdor-site/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        etag on;
        # A location's add_header replaces the server's, so the HSTS header is repeated here.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $site_cache_control always;
        # A missing file is not logged with the client's address (the privacy page).
        log_not_found off;
    }

    # The download mirror: static files written by razdor-mirror (the owner's server is the first mirror; GitHub
    # the second). Range works, and so do ETags. The access log keeps no client address (razdor_hub, above).
    # log_not_found off: GitHub's catalog has no index-v2.json, so every Hub open asks for it,
    # and each 404 would otherwise write the client's address into the error log.
    location /hub/ {
        alias /var/www/razdor-hub/;
        autoindex off;
        # The download log without addresses (see razdor_hub above). Its folder is owned by nginx.
        access_log /var/log/razdor-hub/hub.log razdor_hub;
        log_not_found off;
        etag on;
        sendfile on;
        tcp_nopush on;
        gzip off;                       # the archives are compressed already
        # latest/download is our own symlink to a release folder: followed only when the owner is the same
        disable_symlinks if_not_owner from=/var/www/razdor-hub;
        add_header Cache-Control $hub_cache_control always;
        # No limit_req here: carrier NAT shares addresses, and a 429 from nginx would push players to GitHub.
    }

    # The API. The service reads the client address from X-Real-IP (trust_proxy = true): nginx sets it from
    # the socket, so a client cannot supply its own.
    location /api/ {
        limit_req zone=razdor_api burst=60 nodelay;
        error_page 429 = @razdor_429;
        access_log /var/log/nginx/razdor-api.log razdor_api;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # The admin dashboard, through the API prefix. Its pages are HTML with absolute links to /admin, so nginx
    # rewrites them to /api/admin; the session cookie's path and the login redirect follow.
    location ^~ /api/admin {
        limit_req zone=razdor_api burst=20 nodelay;
        error_page 429 = @razdor_429;
        access_log /var/log/nginx/razdor-api.log razdor_api;
        proxy_pass http://127.0.0.1:8080/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_path /admin /api/admin;
        proxy_redirect /admin /api/admin;
        absolute_redirect off;
        sub_filter_once off;
        sub_filter 'action="/admin' 'action="/api/admin';
        sub_filter 'href="/admin' 'href="/api/admin';
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Let's Encrypt renewals (webroot mode) are served from here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # A 429 from nginx's own limit_req (the service's 429s carry their own Retry-After). The wait is short:
    # the zone refills at 20 requests a second.
    location @razdor_429 {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"too many requests"}';
    }
}

# Plain HTTP only redirects (and answers the certificate challenges).
server {
    listen 80;
    listen [::]:80;
    server_name razdor.indicozy.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
