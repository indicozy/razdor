# Deploys GitHub Pages (https://indicozy.github.io/razdor/): the Razdor website (site/, Astro) at the root and
# the player wiki (wiki/, Starlight) under wiki/. Nothing comes from the gh-pages branch any more: the site's
# pictures are not in git. They are the asset site-art.zip of the pre-release site-art, made by
# tools/site/art_pack.py from the owner's install; this workflow downloads it at build time. If it is missing
# the site builds without pictures (every picture degrades gracefully).
# Pages' source is "GitHub Actions". The owner's server gets the same site at the root of
# https://razdor.indicozy.dev/ (job root-copy): it is packed as site.tar.gz, the one asset of the pre-release
# site-latest (docs/specs/own-mirror-2026-11-24.md). The app reads config.json from the Pages root: it must stay.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wiki/**"
      - "changelog/**"
      - "data/remote/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Daily, so a new Hub catalog shows on the site within a day.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            wiki/package-lock.json

      - name: Build the wiki
        working-directory: wiki
        env:
          RAZDOR_WIKI_BASE: /razdor/wiki
        run: npm ci && npm run build

      # The site's pictures (not in git). A missing pack means a site without pictures, not a failed deploy.
      - name: Download the site's pictures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p art-pack
          if gh release download site-art -p site-art.zip -R "$GITHUB_REPOSITORY" -D art-pack --clobber; then
            unzip -q -o art-pack/site-art.zip -d site/public
          else
            echo "::warning::the site-art release is missing: the site is built without pictures"
          fi

      - name: Build the site
        working-directory: site
        env:
          RAZDOR_SITE_BASE: /razdor/
        run: npm ci && npm run build

      - name: Assemble the Pages site
        run: |
          mkdir -p out/wiki
          cp -r site/dist/. out/
          cp -r wiki/dist/. out/wiki/
          # The remote config the app reads (https://indicozy.github.io/razdor/config.json). Source:
          # data/remote/config.json; the owner's server copies it from here (docs/specs/own-mirror-2026-11-24.md).
          cp data/remote/config.json out/config.json
          touch out/.nojekyll
          python3 -I tools/site/canonical.py out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # The owner's server's copy of the same site, at the root of https://razdor.indicozy.dev/ (and /wiki/). The site is
  # built with base /, the wiki with base /wiki, tools/site/root_copy.py makes the copy, and the copy is packed as
  # site.tar.gz, the one asset of the pre-release site-latest in this repository (GITHUB_TOKEN cannot write to the
  # community repository, and no secret is set). The owner's server pulls it (server/src/mirror/site.rs): no secret,
  # no push to the server. The release is a pre-release that is not the latest, so the Hub's catalog (the latest
  # release of razdor-community) and the app's releases are not affected.
  root-copy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: site-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            wiki/package-lock.json

      - name: Build the wiki for the root (base /wiki)
        working-directory: wiki
        env:
          RAZDOR_WIKI_BASE: /wiki
        run: npm ci && npm run build

      - name: Download the site's pictures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p art-pack
          if gh release download site-art -p site-art.zip -R "$GITHUB_REPOSITORY" -D art-pack --clobber; then
            unzip -q -o art-pack/site-art.zip -d site/public
          else
            echo "::warning::the site-art release is missing: the site is built without pictures"
          fi

      - name: Build the site for the root (base /)
        working-directory: site
        env:
          RAZDOR_SITE_BASE: /
        run: npm ci && npm run build

      - name: Assemble the site as the Pages build does
        run: |
          mkdir -p assembled/wiki
          cp -r site/dist/. assembled/
          cp -r wiki/dist/. assembled/wiki/
          cp data/remote/config.json assembled/config.json

      - name: Make the root copy
        run: python3 -I tools/site/root_copy.py assembled root-site

      - name: Pack it
        run: tar -C root-site -czf site.tar.gz .

      - name: Publish it as the site-latest pre-release (the owner's server pulls it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view site-latest >/dev/null 2>&1; then
            gh release create site-latest --prerelease --latest=false \
              --title "Site copy for the owner's server" \
              --notes "The root copy of the Pages site, pulled by the owner's server. Not an app release."
          fi
          gh release upload site-latest site.tar.gz --clobber

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
