# The release pipeline: pushing a tag vX.Y.Z builds razdor (Linux) and Razdor.exe (Windows)
# with scripts/dist.sh, Razdor-win7.exe and razdor-X.Y.Z-windows7.zip (Windows 7 and 8) with
# scripts/dist-win7.sh on the windows7 job, razdor-macos (macOS, universal) with scripts/dist-macos.sh on a Mac,
# razdor.apk (Android, experimental) with scripts/dist-android.sh on the android job (unsigned),
# then signed in the android-sign job, which runs no repository code and gets the release
# keystore only on tags; razdor.ipa (iOS, experimental, unsigned: the player signs it with AltStore
# or Sideloadly) with scripts/dist-ios.sh on the ios job, a Mac with no secrets; the map translator
# beside each (razdor-translate, Razdor-translate.exe, razdor-translate-macos),
# and publishes them as the GitHub release vX.Y.Z, with that version's changelog file
# (changelog/X.Y.Z.md) and the programs' SHA-256 as its notes. The game's update window
# (src/update.rs) shows the notes up to their first `## ` heading: keep the pipeline's own
# part (downloads, SHA-256) under such headings, after the changelog section.
#
# Each file is published twice: under its versioned name (razdor-X.Y.Z-linux, Razdor-X.Y.Z.exe,
# razdor-X.Y.Z-macos, razdor-X.Y.Z.apk, razdor-X.Y.Z.ipa, razdor-translate-X.Y.Z-linux, and so on)
# and under the old fixed name (razdor, Razdor.exe, ...). The versioned copies are made from the
# built files by the "Versioned copies" step (the originals stay), and SHA256SUMS lists all 16.
# Installed copies run an updater that only knows the fixed names, so the fixed-name copies stay
# in every release until the owner drops them; the updater takes the versioned name when there is one.
#
#   1. Set `version` in Cargo.toml, move changelog/unreleased.md into changelog/X.Y.Z.md
#      under "## X.Y.Z — date", run scripts/changelog.sh (it builds CHANGELOG.md); commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Run by hand (Actions → Release → Run workflow), it builds the programs of that commit as
# the run's artifacts and publishes nothing.
#
# The tools are pinned (Rust in rust-toolchain.toml, llvm-mingw below) so a local
# scripts/dist.sh of the same commit builds the same Razdor.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_MINGW_RELEASE: "20260922"
  LLVM_MINGW_NAME: llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64

jobs:
  macos:
    # The macOS SDK comes with Xcode, so the Mac program is built on a Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Tests
        run: cargo test

      - name: Build razdor-macos
        run: sh scripts/dist-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-macos
          path: |
            dist/razdor-macos
            dist/razdor-translate-macos
            dist/menu-art
          if-no-files-found: error

  ios:
    # Experimental: the iOS app, dist/razdor.ipa, built on a Mac (the iOS SDK comes with Xcode).
    # It is not signed by a developer and needs no secrets: the player's AltStore or Sideloadly
    # signs it with their own Apple ID when they install it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml) and the iOS target
        run: |
          rustup show active-toolchain
          rustup target add --toolchain 1.91.1 aarch64-apple-ios

      - name: Build razdor.ipa
        run: sh scripts/dist-ios.sh

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-ios
          path: dist/razdor.ipa
          if-no-files-found: error

  windows7:
    # Razdor for Windows 7 and 8 (scripts/dist-win7.sh): Rust's tier-3 target x86_64-win7-windows-gnu,
    # with its standard library built for it, linked by lld against Ubuntu's mingw-w64 msvcrt sysroot.
    # The zip carries curl.exe (scripts/fetch-curl-win.sh, pinned in scripts/curl-win.env).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Clang, lld and mingw-w64 (the Windows 7 build)
        run: sudo apt-get update && sudo apt-get install -y clang lld mingw-w64 libwinpthread-dev zip

      - name: Rust (rust-toolchain.toml), its source and the crt objects of the Windows 7 target
        run: |
          rustup show active-toolchain
          rustup component add rust-src
          rustup target add x86_64-pc-windows-gnu

      - name: Build Razdor-win7.exe and the Windows 7 zip
        run: sh scripts/dist-win7.sh

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-win7
          path: |
            dist/Razdor-win7.exe
            dist/razdor-*-windows7.zip
          if-no-files-found: error

  android:
    # Experimental: the Android APK (arm64-v8a, armeabi-v7a, x86_64), built with cargo-quad-apk
    # (pinned by its commit) on the runner's Android SDK, with the NDK pinned here. This job has
    # no secrets at all: it makes an unsigned aligned APK, dist/razdor-unsigned.apk, and uploads
    # it. The android-sign job signs it, without this repository.
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "29.0.14206865"
      CARGO_QUAD_APK_REV: "d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6"
    steps:
      - uses: actions/checkout@v5

      - name: Android platform, build-tools and the NDK (pinned)
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust (rust-toolchain.toml) and the Android targets
        run: |
          rustup show active-toolchain
          rustup target add --toolchain 1.91.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: cargo-quad-apk (pinned)
        run: cargo install --git https://github.com/not-fl3/cargo-quad-apk --rev "$CARGO_QUAD_APK_REV" --locked

      - name: Build razdor-unsigned.apk (no secrets here)
        env:
          RAZDOR_ANDROID_UNSIGNED: "1"
        run: sh scripts/dist-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-android-unsigned
          path: dist/razdor-unsigned.apk
          if-no-files-found: error

  android-sign:
    # Signs the APK in a job of its own: no checkout, no cargo, no repository scripts, so the
    # release keystore never sits beside code from the repository or a third party. The keystore
    # secrets reach only the sign step's env, and only on a tag run; a manual run never reads
    # them and signs with a throwaway key made for that run.
    needs: android
    runs-on: ubuntu-22.04
    # This job needs no token: it only moves artifacts and runs apksigner.
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: razdor-android-unsigned
          path: dist

      - name: Sign razdor.apk
        env:
          KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          set -eu
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are needed for a release"
              exit 1
            fi
            # The keystore is decoded for this step only and removed on exit; the password
            # reaches apksigner through env: (not on its command line).
            keystore="$RUNNER_TEMP/razdor-release.keystore"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
                --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
                --out dist/razdor.apk dist/razdor-unsigned.apk
          else
            # A manual run: the release secrets are not in this step's env at all (see above).
            echo "::warning::A run by hand: razdor.apk of this run is signed with a throwaway key, not the release key"
            THROWAWAY_PASSWORD=$(openssl rand -hex 16)
            export THROWAWAY_PASSWORD
            keystore="$RUNNER_TEMP/throwaway.keystore"
            trap 'rm -f "$keystore"' EXIT
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
                -storepass:env THROWAWAY_PASSWORD -keypass:env THROWAWAY_PASSWORD \
                -alias throwaway -dname "CN=Razdor run by hand,O=Razdor,C=US" \
                -keyalg RSA -keysize 2048 -validity 10
            "$apksigner" sign --ks "$keystore" --ks-key-alias throwaway \
                --ks-pass env:THROWAWAY_PASSWORD --key-pass env:THROWAWAY_PASSWORD \
                --out dist/razdor.apk dist/razdor-unsigned.apk
          fi
          "$apksigner" verify --print-certs dist/razdor.apk | head -3
          sha256sum dist/razdor.apk

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-android
          path: dist/razdor.apk
          if-no-files-found: error

  release:
    needs: [macos, android-sign, ios, windows7]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Blocking: a dead game-folder link stops the release (no continue-on-error; a network
      # failure exits 2 and fails here too, it is not skipped).
      - name: The game download's link is alive
        run: bash scripts/check-game-link.sh

      - name: The tag matches the version and the changelog
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not version $version"; exit 1; }
          grep -q "^## $version " "changelog/$version.md" || { echo "changelog/$version.md has no section for $version"; exit 1; }
          scripts/changelog.sh --check

      - name: Libraries for sound (ALSA) and gamepads (udev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Tests
        run: cargo test --no-default-features

      - name: llvm-mingw for the Windows build
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_RELEASE/$LLVM_MINGW_NAME.tar.xz"
          tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "LLVM_MINGW=/opt/$LLVM_MINGW_NAME" >> "$GITHUB_ENV"

      - name: Build razdor and Razdor.exe
        run: sh scripts/dist.sh

      - uses: actions/download-artifact@v8
        with:
          name: razdor-macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: razdor-android
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: razdor-ios
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: razdor-win7
          path: dist

      - name: Versioned copies of the release files
        id: versions
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(awk '/^\[/ {p = ($0 == "[package]")} p && /^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          fi
          echo "V=$V" >> "$GITHUB_ENV"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          chmod +x dist/razdor-macos dist/razdor-translate-macos
          cd dist
          cp razdor "razdor-$V-linux"
          cp Razdor.exe "Razdor-$V.exe"
          cp razdor-macos "razdor-$V-macos"
          cp razdor.apk "razdor-$V.apk"
          cp razdor.ipa "razdor-$V.ipa"
          cp razdor-translate "razdor-translate-$V-linux"
          cp Razdor-translate.exe "Razdor-translate-$V.exe"
          cp razdor-translate-macos "razdor-translate-$V-macos"
          # The promo ads (dist/ads, from dist.sh): read next to the desktop programs (src/ui/ads.rs).
          # A release file is one file, so the folder goes as a zip the player unpacks beside them.
          zip -qr "razdor-ads-$V.zip" ads
          # The first screen's art (dist/menu-art, from dist.sh and dist-macos.sh; src/ui/menu_art.rs): read
          # beside the desktop programs when no game is installed; the player unpacks it there.
          zip -qr "razdor-menu-art-$V.zip" menu-art
          ls -l

      - name: SHA-256 of all of them
        run: |
          (cd dist && sha256sum razdor Razdor.exe razdor-macos razdor-translate Razdor-translate.exe razdor-translate-macos razdor.apk razdor.ipa \
            "razdor-$V-linux" "Razdor-$V.exe" "razdor-$V-macos" "razdor-$V.apk" "razdor-$V.ipa" \
            "razdor-translate-$V-linux" "Razdor-translate-$V.exe" "razdor-translate-$V-macos" "razdor-ads-$V.zip" Razdor-win7.exe "razdor-$V-windows7.zip" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: The programs of a run by hand
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: razdor-${{ github.sha }}
          path: |
            dist/razdor
            dist/Razdor.exe
            dist/razdor-macos
            dist/razdor-translate
            dist/Razdor-translate.exe
            dist/razdor-translate-macos
            dist/razdor.apk
            dist/razdor.ipa
            dist/razdor-${{ steps.versions.outputs.v }}-linux
            dist/Razdor-${{ steps.versions.outputs.v }}.exe
            dist/razdor-${{ steps.versions.outputs.v }}-macos
            dist/razdor-${{ steps.versions.outputs.v }}.apk
            dist/razdor-${{ steps.versions.outputs.v }}.ipa
            dist/razdor-translate-${{ steps.versions.outputs.v }}-linux
            dist/Razdor-translate-${{ steps.versions.outputs.v }}.exe
            dist/razdor-translate-${{ steps.versions.outputs.v }}-macos
            dist/razdor-ads-${{ steps.versions.outputs.v }}.zip
            dist/Razdor-win7.exe
            dist/razdor-${{ steps.versions.outputs.v }}-windows7.zip
            dist/SHA256SUMS

      - name: Release notes from changelog/X.Y.Z.md
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' "changelog/$version.md" > notes.md
          {
            echo
            echo "## Загрузка"
            echo "- **Razdor-$V.exe**: Windows (x86_64). **razdor-$V-linux**: Linux (x86_64). **razdor-$V-macos**: macOS 11+ (Apple Silicon и Intel). **SHA256SUMS**: их контрольные суммы."
            echo "- Положите программу рядом с \`DiscordTimes.exe\` в папке игры и запустите её. Дальше Раздор обновляется сам (Настройки → «Ещё…» → «Обновления»)."
            echo "- **razdor-$V.apk**: Android 8+ (ARM). Установите и откройте: игру скачайте кнопкой «Скачать игру» или выберите её архив кнопкой «Выбрать архив…»; при первом запуске сохранения и игра переносятся в папку Раздора сами; «Доступ ко всем файлам» не запрашивается; экспериментально. Управление жестами (касание — щелчок, долгое нажатие — правая кнопка, щипок — масштаб, два пальца — прокрутка); режим тачпада включается в настройках. Раздор сам предлагает обновиться: загружает новый APK, проверяет его SHA-256 и передаёт системному установщику (Android попросит подтвердить установку); сохранения остаются."
            echo "- **razdor-$V.ipa**: iPhone и iPad (iOS 14+), экспериментально. Файл не подписан: установите его через AltStore или Sideloadly со своим Apple ID (бесплатная подпись действует 7 дней, AltStore продлевает её сам). Папку игры скопируйте в «Файлы» → На iPhone → Раздор → DiscordTimes; см. README, «iOS»."
            echo "- **Razdor-translate-$V.exe**, **razdor-translate-$V-linux**, **razdor-translate-$V-macos**: переводчик карт и данных игры на английский языковой моделью (см. README, «Переводчик карт»); кладётся туда же. Сам он не обновляется."
            echo "- macOS: программа не подписана разработчиком; после загрузки выполните \`xattr -d com.apple.quarantine razdor-$V-macos\` (или правый щелчок → «Открыть») перед первым запуском."
            echo "- **razdor-$V-windows7.zip** (или **Razdor-win7.exe**): Windows 7 и 8 (x86_64). Windows 10 и новее берут Razdor-$V.exe. В архиве рядом с программой лежат curl.exe (для загрузок игры и обновлений) и папки ads и menu-art; на Windows 7 curl.exe запускается только с обновлением KB2999226 (Universal C Runtime)."
            echo "- Файлы без номера версии (Razdor.exe, razdor, razdor-macos, razdor.apk, razdor.ipa и переводчики) — те же программы под старыми именами, для обновления старых версий Раздора."
            echo
            echo "## SHA-256"
            echo "Собрано из коммита ${GITHUB_SHA::7}."
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Предоставляется как есть, без каких-либо гарантий; см. раздел «Отказ от ответственности» в README. Лицензия GPL-3.0 (см. LICENSE и NOTICE)."
          } >> notes.md
          cat notes.md

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Раздор ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            dist/Razdor.exe dist/razdor dist/razdor-macos dist/razdor.apk dist/razdor.ipa \
            dist/Razdor-translate.exe dist/razdor-translate dist/razdor-translate-macos \
            dist/Razdor-$V.exe dist/razdor-$V-linux dist/razdor-$V-macos dist/razdor-$V.apk dist/razdor-$V.ipa \
            dist/Razdor-translate-$V.exe dist/razdor-translate-$V-linux dist/razdor-translate-$V-macos dist/razdor-ads-$V.zip dist/Razdor-win7.exe dist/razdor-$V-windows7.zip dist/SHA256SUMS
