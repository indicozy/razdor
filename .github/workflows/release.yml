# The release pipeline: pushing a tag vX.Y.Z builds razdor (Linux) and Razdor.exe (Windows)
# with scripts/dist.sh, razdor-macos (macOS, universal) with scripts/dist-macos.sh on a Mac,
# razdor.apk (Android, experimental) with scripts/dist-android.sh on the android job (signed
# with the release keystore from the ANDROID_* secrets), and the map translator beside each
# (razdor-translate, Razdor-translate.exe, razdor-translate-macos),
# and publishes them as the GitHub release vX.Y.Z, with that version's changelog file
# (changelog/X.Y.Z.md) and the programs' SHA-256 as its notes. The game's update window
# (src/update.rs) shows the notes up to their first `## ` heading: keep the pipeline's own
# part (downloads, SHA-256) under such headings, after the changelog section.
#
#   1. Set `version` in Cargo.toml, move changelog/unreleased.md into changelog/X.Y.Z.md
#      under "## X.Y.Z — date", run scripts/changelog.sh (it builds CHANGELOG.md); commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Run by hand (Actions → Release → Run workflow), it builds the programs of that commit as
# the run's artifacts and publishes nothing.
#
# The tools are pinned (Rust in rust-toolchain.toml, llvm-mingw below) so a local
# scripts/dist.sh of the same commit builds the same Razdor.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_MINGW_RELEASE: "20260922"
  LLVM_MINGW_NAME: llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64

jobs:
  macos:
    # The macOS SDK comes with Xcode, so the Mac program is built on a Mac.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Tests
        run: cargo test

      - name: Build razdor-macos
        run: sh scripts/dist-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-macos
          path: |
            dist/razdor-macos
            dist/razdor-translate-macos
          if-no-files-found: error

  android:
    # Experimental: the Android APK (arm64-v8a, armeabi-v7a, x86_64), built with cargo-quad-apk
    # (pinned by its commit) on the runner's Android SDK, with the NDK pinned here. The build
    # step has no secrets in its environment: it makes an unsigned aligned APK. The sign step
    # alone gets the keystore secrets, in its own step env (never in GITHUB_ENV, which would
    # reach every later step and the build scripts), and writes dist/razdor.apk. A manual run
    # without the secrets signs with a throwaway debug key; a tag run without them fails.
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "29.0.14206865"
      CARGO_QUAD_APK_REV: "d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6"
    steps:
      - uses: actions/checkout@v5

      - name: Android platform, build-tools and the NDK (pinned)
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          "$sdk" "platforms;android-34" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust (rust-toolchain.toml) and the Android targets
        run: |
          rustup show active-toolchain
          rustup target add --toolchain 1.90.0 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: cargo-quad-apk (pinned)
        run: cargo install --git https://github.com/not-fl3/cargo-quad-apk --rev "$CARGO_QUAD_APK_REV" --locked

      - name: Build razdor-unsigned.apk (no secrets here)
        env:
          RAZDOR_ANDROID_UNSIGNED: "1"
        run: sh scripts/dist-android.sh

      - name: Sign razdor.apk
        # The only step with the keystore secrets, and only in its own env: the keystore is
        # decoded to $RUNNER_TEMP for this step and removed on exit; the passwords reach
        # apksigner through env: (not on its command line).
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            keystore="$RUNNER_TEMP/razdor-release.keystore"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
                --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
                --out dist/razdor.apk dist/razdor-unsigned.apk
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are needed for a release"
            exit 1
          else
            echo "::warning::No Android release keystore secrets: razdor.apk of this run is signed with a throwaway debug key"
            keystore="$RUNNER_TEMP/debug.keystore"
            trap 'rm -f "$keystore"' EXIT
            keytool -genkeypair -keystore "$keystore" -storepass android -keypass android \
                -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
            "$apksigner" sign --ks "$keystore" --ks-key-alias androiddebugkey \
                --ks-pass pass:android --key-pass pass:android \
                --out dist/razdor.apk dist/razdor-unsigned.apk
          fi
          "$apksigner" verify --print-certs dist/razdor.apk
          sha256sum dist/razdor.apk

      - uses: actions/upload-artifact@v7
        with:
          name: razdor-android
          path: dist/razdor.apk
          if-no-files-found: error

  release:
    needs: [macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: The tag matches the version and the changelog
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" Cargo.toml || { echo "Cargo.toml is not version $version"; exit 1; }
          grep -q "^## $version " "changelog/$version.md" || { echo "changelog/$version.md has no section for $version"; exit 1; }
          scripts/changelog.sh --check

      - name: Libraries for sound (ALSA) and gamepads (udev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Tests
        run: cargo test --no-default-features

      - name: llvm-mingw for the Windows build
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_RELEASE/$LLVM_MINGW_NAME.tar.xz"
          tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "LLVM_MINGW=/opt/$LLVM_MINGW_NAME" >> "$GITHUB_ENV"

      - name: Build razdor and Razdor.exe
        run: sh scripts/dist.sh

      - uses: actions/download-artifact@v8
        with:
          name: razdor-macos
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: razdor-android
          path: dist

      - name: SHA-256 of all of them
        run: |
          chmod +x dist/razdor-macos dist/razdor-translate-macos
          (cd dist && sha256sum razdor Razdor.exe razdor-macos razdor-translate Razdor-translate.exe razdor-translate-macos razdor.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: The programs of a run by hand
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: razdor-${{ github.sha }}
          path: |
            dist/razdor
            dist/Razdor.exe
            dist/razdor-macos
            dist/razdor-translate
            dist/Razdor-translate.exe
            dist/razdor-translate-macos
            dist/razdor.apk
            dist/SHA256SUMS

      - name: Release notes from changelog/X.Y.Z.md
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' "changelog/$version.md" > notes.md
          {
            echo
            echo "## Загрузка"
            echo "- **Razdor.exe**: Windows (x86_64). **razdor**: Linux (x86_64). **razdor-macos**: macOS 11+ (Apple Silicon и Intel). **SHA256SUMS**: их контрольные суммы."
            echo "- Положите программу рядом с \`DiscordTimes.exe\` в папке игры и запустите её. Дальше Раздор обновляется сам (Настройки → «Ещё…» → «Обновления»)."
            echo "- **razdor.apk**: Android 8+ (ARM). Установите, дайте «Доступ ко всем файлам», положите папку игры в \`DiscordTimes\` во внутренней памяти; экспериментально, управление только касанием (касание = левый щелчок). Обновления в приложении нет: новый APK ставится поверх."
            echo "- **Razdor-translate.exe**, **razdor-translate**, **razdor-translate-macos**: переводчик карт и данных игры на английский языковой моделью (см. README, «Переводчик карт»); кладётся туда же. Сам он не обновляется."
            echo "- macOS: программа не подписана разработчиком; после загрузки выполните \`xattr -d com.apple.quarantine razdor-macos\` (или правый щелчок → «Открыть») перед первым запуском."
            echo
            echo "## SHA-256"
            echo "Собрано из коммита ${GITHUB_SHA::7}."
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Предоставляется как есть, без каких-либо гарантий; см. раздел «Отказ от ответственности» в README. Лицензия MIT."
          } >> notes.md
          cat notes.md

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Раздор ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            dist/Razdor.exe dist/razdor dist/razdor-macos \
            dist/Razdor-translate.exe dist/razdor-translate dist/razdor-translate-macos dist/razdor.apk dist/SHA256SUMS
