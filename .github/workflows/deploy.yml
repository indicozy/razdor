# Pages' source is "GitHub Actions": the deploy lives in main's .github/workflows/pages.yml
# (this site plus the wiki built into wiki/). A push here starts it.
name: Deploy site

on:
  push:
    branches: [gh-pages]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
